<style>

svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

.leiste-ed{position:sticky;bottom:0;z-index:20;display:flex;gap:10px;flex-wrap:wrap;padding:12px 0 calc(12px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%)}

.bd{position:fixed;inset:0;z-index:100;background:rgba(8,13,21,.55);display:flex;align-items:flex-end;justify-content:center}

.sh h3{font-size:18px;font-weight:780;margin-bottom:6px}.sh .sub{color:var(--ink-2);font-size:14px;margin-bottom:14px}
.knoepfe{display:flex;gap:10px;margin-top:10px}.knoepfe .btn{flex:1}
.licht{position:fixed;inset:0;z-index:150;background:rgba(5,8,13,.92);display:grid;place-items:center;padding:20px}.licht img{max-width:100%;max-height:100%;border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:#0f1826;color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:200;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
#boot{padding:60px 20px;text-align:center;color:var(--ink-3)}
</style>

const URLS = {};

}

/* Einfache Textgestaltung: **fett**, *kursiv*, ## Überschrift, - Liste, 1. Liste, > Hinweis, [Text](Link) */
function format(txt) {
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\n]+?)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:|tel:|[\w.-]+\.html)[^)\s]*)\)/g, (m, t, u) => `<a href="${u.replace(/"/g, '')}"${/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : ''}>${t}</a>`)
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  const zeilen = String(txt || '').replace(/\r/g, '').split('\n'); let h = '', liste = null, absatz = [];
  const absatzEnde = () => { if (absatz.length) { h += `<p>${absatz.map(inl).join('<br>')}</p>`; absatz = [] } };
  const listeEnde = () => { if (liste) { h += `<${liste.t}>${liste.i.map(x => `<li>${inl(x)}</li>`).join('')}</${liste.t}>`; liste = null } };
  for (const z of zeilen) {
    let m;
    if (!z.trim()) { absatzEnde(); listeEnde(); continue }
    if ((m = /^\s*[-•*]\s+(.*)$/.exec(z))) { absatzEnde(); if (!liste || liste.t !== 'ul') { listeEnde(); liste = { t: 'ul', i: [] } } liste.i.push(m[1]); continue }
    if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(z))) { absatzEnde(); if (!liste || liste.t !== 'ol') { listeEnde(); liste = { t: 'ol', i: [] } } liste.i.push(m[1]); continue }
    listeEnde();
    if ((m = /^#{1,3}\s+(.*)$/.exec(z))) { absatzEnde(); h += `<h2>${inl(m[1])}</h2>`; continue }
    if ((m = /^>\s?(.*)$/.exec(z))) { absatzEnde(); h += `<div class="hinweis">${inl(m[1])}</div>`; continue }
    absatz.push(z);
  }
  absatzEnde(); listeEnde(); return h;
}
function heroHTML(n, extra) {

  return `<div class="hero${foto ? ' foto' : ''}${!foto && f[2] ? ' hell' : ''}" style="--g1:${f[0]};--g2:${f[1]}">${foto ? `<img src="${esc(foto)}" alt="" loading="lazy">` : `<div class="sym"><svg><use href="#i-${esc(st.icon || 'bulb')}"/></svg></div><div class="sym2"><svg><use href="#i-${esc(st.icon || 'bulb')}"/></svg></div>`}${extra || ''}</div>`;
}

function bildVerkleinern(file, max) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(u); const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => b ? ok(b) : no(new Error('Bild nicht lesbar')), 'image/jpeg', 0.84) };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('Bild nicht lesbar')) }; img.src = u;
  });
}

    const w = $('#eFotoWeg'); if (w) w.onclick = () => { if (!E.titelbild.startsWith('data:')) weg.push(E.titelbild); E.titelbild = null; malFoto(); vorschau() };
    const i = $('#eFotoIn'); if (i) i.onchange = async () => { const f = i.files[0]; if (!f) return; try { toast('Foto wird hochgeladen …'); const b = await bildVerkleinern(f, 1800); const p = `${ordner}/${uuid()}.jpg`; await hochladen(p, b, 'image/jpeg'); URLS[p] = URL.createObjectURL(b); E.titelbild = p; malFoto(); vorschau() } catch (e) { toast(e.message) } };
  };
  const setModus = m => { modus = m; $$('#eModus button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); $('#eFoto').hidden = m !== 'foto'; $('#eFarbe').hidden = m !== 'farbe'; if (m === 'farbe' && E.titelbild) { if (!E.titelbild.startsWith('data:')) weg.push(E.titelbild); E.titelbild = null; malFoto() } vorschau() };
  const malStil = () => { $$('#eFarben button').forEach(b => b.classList.toggle('on', b.dataset.f === E.stil.farbe)); $$('#eIcons button').forEach(b => b.classList.toggle('on', b.dataset.i === E.stil.icon)) };
  const malAnh = () => {
    const B = E.anhaenge.filter(a => a.bild), F = E.anhaenge.filter(a => !a.bild);
    $('#eBilder').innerHTML = B.map(a => `<div class="thumb"><img src="${esc(url(a.pfad))}" alt=""><button class="weg" data-weg="${esc(a.pfad)}" aria-label="Bild entfernen">${ic('x')}</button></div>`).join('');
    $('#eDateien').innerHTML = F.map(a => `<div class="dz">${ic('file')}${esc(a.name)}<small>${groesse(a.groesse || 0)}</small><button class="weg" data-weg="${esc(a.pfad)}" aria-label="Datei entfernen">${ic('x')}</button></div>`).join('');
    $$('[data-weg]').forEach(b => b.onclick = () => { weg.push(b.dataset.weg); E.anhaenge = E.anhaenge.filter(a => a.pfad !== b.dataset.weg); malAnh() });
  };
  const setZiel = z => { $$('#eZiel button').forEach(b => b.classList.toggle('on', b.dataset.z === z)); $('#eGruppen').hidden = z !== 'gruppen'; if (z === 'alle') $$('#eGruppen input').forEach(i => i.checked = false) };
  malFoto(); setModus(modus); malStil(); malAnh(); setZiel(E.gruppen.length ? 'gruppen' : 'alle'); vorschau();
  $('#eModus').onclick = e => { const b = e.target.closest('button'); if (b) setModus(b.dataset.m) };
  $('#eFarben').onclick = e => { const b = e.target.closest('button'); if (b) { E.stil.farbe = b.dataset.f; malStil(); vorschau() } };
  $('#eIcons').onclick = e => { const b = e.target.closest('button'); if (b) { E.stil.icon = b.dataset.i; malStil(); vorschau() } };
  $('#eZiel').onclick = e => { const b = e.target.closest('button'); if (b) setZiel(b.dataset.z) };
  $('#eTitel').oninput = $('#eTeaser').oninput = vorschau;
  $$('.werkzeug button').forEach(b => b.onclick = () => {
    const t = $('#eInhalt'), [vor, nach] = b.dataset.w.split('|'), a = t.selectionStart, z = t.selectionEnd, sel = t.value.slice(a, z);
    const zeilenAnfang = !nach && a > 0 && t.value[a - 1] !== '\n' ? '\n' : '';
    t.setRangeText(zeilenAnfang + vor + (sel || (nach ? 'Text' : '')) + nach, a, z, 'end'); t.focus();
  });
  $('#eBildIn').onchange = async e => {
    for (const f of e.target.files) { try { toast('Bild wird hochgeladen …'); const b = await bildVerkleinern(f, 1800); const p = `${ordner}/${uuid()}.jpg`; await hochladen(p, b, 'image/jpeg'); URLS[p] = URL.createObjectURL(b); E.anhaenge.push({ pfad: p, name: f.name, typ: 'image/jpeg', groesse: b.size, bild: true }); malAnh() } catch (err) { toast(err.message) } }
    e.target.value = '';
  };
  $('#eDateiIn').onchange = async e => {
    for (const f of e.target.files) {
      if (f.size > 15 * 1048576) { toast(`${f.name} ist größer als 15 MB`); continue }
      try { toast(`${f.name} wird hochgeladen …`); const end = (f.name.match(/\.[\w]{1,6}$/) || [''])[0].toLowerCase(); const p = `${ordner}/${uuid()}${end}`; await hochladen(p, f, f.type); E.anhaenge.push({ pfad: p, name: f.name, typ: f.type || '', groesse: f.size, bild: false }); malAnh() } catch (err) { toast(err.message) }
    }
    e.target.value = '';
  };
  const speichern = async () => {
    const app = $('#eApp').value;
    const p = { id: alt ? alt.id : null, titel: $('#eTitel').value, teaser: $('#eTeaser').value, inhalt: $('#eInhalt').value, titelbild: modus === 'foto' ? E.titelbild : null,
      stil: E.stil, anhaenge: E.anhaenge, app_url: app, app_name: app ? (APPS.find(x => x[0] === app) || [])[1] : '', gruppen: $$('#eGruppen input:checked').map(i => i.value), angeheftet: $('#ePin').checked };
    if (!p.titel.trim()) throw new Error('Bitte einen Titel eingeben.');
    const nid = await rpc('news_speichern', { p });
    await loeschenSpeicher(weg.splice(0)); return nid;
  };
  $('#eSpeichern').onclick = async e => { e.target.disabled = true; $('#eErr').textContent = ''; try { const nid = await speichern(); toast('Gespeichert'); await laden(); location.hash = '#/n/' + nid } catch (err) { $('#eErr').textContent = err.message; e.target.disabled = false } };
  const pub = $('#ePub'); if (pub) pub.onclick = async () => {
    $('#eErr').textContent = '';
    try { const nid = await speichern(); await laden(); veroeffentlichenFenster(D.news.find(x => x.id === nid)); history.replaceState(null, '', '#/bearbeiten/' + nid) } catch (err) { $('#eErr').textContent = err.message }
  };
}

/* ===================== Ablauf ===================== */
function route() {
  const h = location.hash; let m;
  $('#neuBtn').hidden = !D.admin || /^#\/(neu|bearbeiten)/.test(h);
  if ((m = /^#\/n\/([\w-]+)$/.exec(h))) zeigeArtikel(m[1]);
  else if (h === '#/neu' && D.admin) zeigeEditor(null);
  else if ((m = /^#\/bearbeiten\/([\w-]+)$/.exec(h)) && D.admin) zeigeEditor(m[1]);
  else { if (h === '#/vorschlaege' && D.admin) TAB = 'vorschlag'; zeigeFeed() }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
$('#neuBtn').onclick = () => { location.hash = '#/neu' };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const b = document.querySelector('.licht, .bd'); if (b) b.remove() } });
(async function start() {
  if (!storedRefresh()) return toLogin();
  try { await laden() } catch (e) { $('#boot').textContent = /news_liste|schema cache|function/i.test(e.message) ? 'Die News sind noch nicht eingerichtet (news.sql fehlt in Supabase).' : e.message; return }
  $('#unterTitel').textContent = D.admin ? 'Neues aus der App und dem Betrieb · du kannst News schreiben' : 'Neues aus der App und dem Betrieb';
  $('#boot').hidden = true; $('#app').hidden = false; route();
})();
</script>
