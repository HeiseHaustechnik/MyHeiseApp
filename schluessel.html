<script>
'use strict';
/* ===================== Anmeldung (gemeinsame Sitzung heiseSession) ===================== */
const SB = 'https://bbjzfoirefcsqqgztjpt.supabase.co', KEY = 'sb_publishable_foIFF173jDFlX6KQ70vJPQ_kdoTBk6H', SESS_KEY = 'heiseSession';
const AUTH = { access: null, refresh: null, exp: 0 }; let refreshP = null;
const storedRefresh = () => { try { return (JSON.parse(localStorage.getItem(SESS_KEY) || 'null') || {}).r || null } catch (e) { return null } };
function authSave(j) { AUTH.access = j.access_token; AUTH.refresh = j.refresh_token; AUTH.exp = j.expires_at ? j.expires_at * 1000 : Date.now() + (j.expires_in || 3600) * 1000; try { localStorage.setItem(SESS_KEY, JSON.stringify({ r: AUTH.refresh })) } catch (e) { } }
function toLogin() { location.replace('index.html?next=' + encodeURIComponent('schluessel.html')) }
async function refresh() {
  let r; try { r = await fetch(`${SB}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ refresh_token: AUTH.refresh }) }) }
  catch (e) { throw new Error('Keine Verbindung, bitte Netz prüfen') }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { try { localStorage.removeItem(SESS_KEY) } catch (e) { } toLogin(); throw new Error('Sitzung abgelaufen') }
  authSave(j);
}
async function token() {
  if (AUTH.access && AUTH.exp - Date.now() > 60000) return AUTH.access;
  const r = storedRefresh() || AUTH.refresh; if (!r) { toLogin(); throw new Error('Nicht angemeldet') }
  AUTH.refresh = r; if (!refreshP) refreshP = refresh().finally(() => { refreshP = null }); await refreshP; return AUTH.access;
}
async function rpc(name, args) {
  const t = await token(); let r;
  try { r = await fetch(`${SB}/rest/v1/rpc/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + t }, body: JSON.stringify(args || {}) }) }
  catch (e) { throw new Error('Keine Verbindung, bitte Netz prüfen') }
  const j = await r.json().catch(() => null);
  if (!r.ok) { const m = (j && j.message) || r.statusText || 'Fehler'; if (r.status === 401) AUTH.access = null; throw new Error(/42501|permission denied/i.test(m) && !/dürfen/.test(m) ? 'Dafür fehlt dir die Berechtigung' : m) }
  return j;
}
window.addEventListener('storage', e => { if (e.key === SESS_KEY && !e.newValue) location.replace('index.html') });

/* ===================== Hilfen ===================== */
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const zwei = n => String(n).padStart(2, '0');
const dZeit = s => { if (!s) return ''; const d = new Date(s); return `${zwei(d.getDate())}.${zwei(d.getMonth() + 1)}.${d.getFullYear()} ${zwei(d.getHours())}:${zwei(d.getMinutes())}` };
const dTag = s => { if (!s) return ''; const d = new Date(s); return `${zwei(d.getDate())}.${zwei(d.getMonth() + 1)}.${d.getFullYear()}` };
const isoTag = d => `${d.getFullYear()}-${zwei(d.getMonth() + 1)}-${zwei(d.getDate())}`;
const tageSeit = s => Math.floor((Date.now() - new Date(s)) / 864e5);
const ls = (k, v) => { try { if (v === undefined) return localStorage.getItem('sk_' + k); localStorage.setItem('sk_' + k, v) } catch (e) { return null } };
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200) }
const ART = { haustuer: 'Haustür', heizraum: 'Heizraum', beides: 'Haustür + Heizraum', sonstiges: 'Sonstiges', unbekannt: 'Art offen' };
const STATUS = { kasten: 'Im Kasten', mitarbeiter: 'Unterwegs', extern: 'Extern abgeholt', kunde: 'An Kunden zurückgegeben', geloescht: 'Gelöscht' };
const artTxt = k => k.art === 'sonstiges' ? (k.art_text || 'Sonstiges') : ART[k.art] || '';
const aktiv = k => k.status !== 'kunde' && k.status !== 'geloescht';
const adr = k => [k.strasse, k.plz_ort].filter(Boolean).join(', ');

/* ===================== Daten ===================== */
let D = { rolle: null, ich: {}, max_nr: 599, bloecke: [], schluessel: [], personen: [] };
let TAB = ls('tab') || 'liste', ANZ = 80;
const darf = () => D.rolle === 'verwalter' || D.rolle === 'admin';
async function laden() {
  const j = await rpc('sk_laden'); D = Object.assign({ bloecke: [], schluessel: [], personen: [] }, j);
}
const blockVon = nr => D.bloecke.find(b => nr >= b.von && nr <= b.bis);
const belegt = () => { const m = new Map(); D.schluessel.forEach(k => { if (aktiv(k)) m.set(k.nr, k) }); return m };
function freieNummern(blockId, eigeneNr) {
  const B = belegt(), res = [];
  const b = blockId ? D.bloecke.find(x => x.id === +blockId) : null;
  const von = b ? b.von : 1, bis = b ? b.bis : D.max_nr;
  for (let n = von; n <= bis; n++) {
    if (!b && blockVon(n)) continue;
    if (!B.has(n) || n === eigeneNr) res.push(n);
  }
  return res;
}

/* ===================== Anzeige ===================== */
function nrBox(k) { return `<span class="nr ${k.status}">${k.nr}</span>` }
function chips(k) {
  const c = [];
  if (k.art === 'haustuer' || k.art === 'beides') c.push('<span class="chip h">Haustür</span>');
  if (k.art === 'heizraum' || k.art === 'beides') c.push('<span class="chip z">Heizraum</span>');
  if (k.art === 'sonstiges') c.push(`<span class="chip o">${esc(k.art_text || 'Sonstiges')}</span>`);
  if (k.art === 'unbekannt') c.push('<span class="chip">Art offen</span>');
  if (k.anzahl > 1) c.push(`<span class="chip">${k.anzahl} Stück</span>`);
  if (k.wartung) c.push('<span class="chip w">Wartung</span>');
  return c.join('');
}
function statusZeile(k) {
  if (k.status === 'mitarbeiter') { const t = tageSeit(k.seit); return `<em>Bei ${esc(k.bei_name)} seit ${dZeit(k.seit)}${k.bei_zweck ? ' · ' + esc(k.bei_zweck) : ''}${t >= 7 ? ` <span class="chip alt">${t} Tage</span>` : ''}</em>` }
  if (k.status === 'extern') { const t = tageSeit(k.seit); return `<em class="ext">Abgeholt von ${esc(k.bei_name)}${k.bei_firma ? ' (' + esc(k.bei_firma) + ')' : ''} am ${dZeit(k.seit)}${t >= 7 ? ` <span class="chip alt">${t} Tage</span>` : ''}</em>` }

function passt(k, q) {
  if (!q) return true;
  const qs = q.toLowerCase().split(/\s+/).filter(Boolean);
  const h = `${k.nr} ${k.kd_nr} ${k.kunde} ${k.strasse} ${k.plz_ort} ${k.notiz} ${k.bei_name || ''} ${k.bei_firma || ''} ${artTxt(k)}`.toLowerCase();
  return qs.every(x => /^\d+$/.test(x) && x.length <= 3 ? (String(k.nr) === x || h.includes(' ' + x) || k.kd_nr.includes(x)) : h.includes(x));
}
function gefiltert(basis) {
  const q = $('#suche').value.trim(), a = $('#artFil').value, b = $('#blockFil').value;
  let L = basis.filter(k => passt(k, q) && (!a || k.art === a));
  if (b === 'frei') L = L.filter(k => !blockVon(k.nr)); else if (b) L = L.filter(k => blockVon(k.nr)?.id === +b);
  if (q && /^\d+$/.test(q)) L.sort((x, y) => (String(y.nr) === q) - (String(x.nr) === q) || x.nr - y.nr);

}

/* ===================== Fenster ===================== */
function fenster(html) {
  const bd = document.createElement('div'); bd.className = 'bd'; bd.innerHTML = `<div class="sh" role="dialog">${html}</div>`;
  bd.addEventListener('click', e => { if (e.target === bd) bd.remove() }); document.body.appendChild(bd);
  const zu = () => bd.remove(); bd.querySelectorAll('[data-zu]').forEach(b => b.onclick = zu); return { el: bd, zu, q: s => bd.querySelector(s) };
}
async function ausfuehren(btn, fn, errEl) {
  btn.disabled = true; if (errEl) errEl.textContent = '';
  try { await fn(); return true } catch (e) { if (errEl) errEl.textContent = e.message; else toast(e.message); return false } finally { btn.disabled = false }
}

/* ---------- Unterschrift ---------- */
function unterschriftFeld(el) {
  el.innerHTML = '<canvas></canvas><div class="linie"></div><span class="ph">Hier unterschreiben</span><button type="button" class="x">Löschen</button>';
  const c = el.querySelector('canvas'), ctx = c.getContext('2d'); let striche = 0, zeichnet = false, last = null;
  const groesse = () => { const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1); c.width = r.width * dpr; c.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0d1524'; striche = 0 };
  requestAnimationFrame(groesse);
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top] };
  c.addEventListener('pointerdown', e => { zeichnet = true; last = pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, 7); ctx.fillStyle = '#0d1524'; ctx.fill(); striche++; el.querySelector('.ph').hidden = true });
  c.addEventListener('pointermove', e => { if (!zeichnet) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; striche++ });
  const ende = () => { zeichnet = false }; c.addEventListener('pointerup', ende); c.addEventListener('pointercancel', ende);
  el.querySelector('.x').onclick = () => { ctx.clearRect(0, 0, c.width, c.height); striche = 0; el.querySelector('.ph').hidden = false };
  return { leer: () => striche < 6, bild: () => {
    // auf weißen Hintergrund, verkleinert (spart Platz in der Datenbank)
    const o = document.createElement('canvas'), w = Math.min(600, c.width); o.width = w; o.height = Math.round(c.height * w / c.width);
    const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, o.width, o.height); x.drawImage(c, 0, 0, o.width, o.height); return o.toDataURL('image/png') } };
}

    <div class="f"><label>Unterschrift *</label><div class="sig" id="kSig"></div></div>
    <div class="f"><label>Notiz (optional)</label><input class="inp" id="kNotiz" placeholder="z. B. auf Kundenwunsch, Wartungsvertrag beendet" autocomplete="off"></div>

    <div class="knoepfe"><button class="btn sec" data-zu>Abbrechen</button><button class="btn" id="kOk">Rückgabe bestätigen</button></div>`);
  const sig = unterschriftFeld(f.q('#kSig'));
  f.q('#kOk').onclick = e => ausfuehren(e.target, async () => {
    if (!f.q('#kName').value.trim()) throw new Error('Bitte den Namen eingeben.');
    if (sig.leer()) throw new Error('Bitte unterschreiben lassen.');
    const bid = await rpc('sk_an_kunden', { p_id: k.id, p_name: f.q('#kName').value, p_unterschrift: sig.bild(), p_notiz: f.q('#kNotiz').value });
    f.zu(); await neuLaden(); toast(`Nr. ${k.nr} an Kunden zurückgegeben, Nummer ist frei`); quittungFrage(bid);
  }, f.q('#kErr'));
}

/* ---------- Anlegen / Bearbeiten (Verwalter) ---------- */
function formular(k, nrVorschlag) {
  const neu = !k; k = k || { nr: nrVorschlag || null, kd_nr: '', kunde: '', strasse: '', plz_ort: '', art: 'unbekannt', art_text: '', anzahl: 1, wartung: false, notiz: '' };
  let blockId = k.nr ? (blockVon(k.nr)?.id || '') : '';
  const f = fenster(`<h3>${neu ? 'Neuer Schlüssel' : 'Schlüssel bearbeiten'}</h3><div class="sub">${neu ? 'Es werden nur freie Nummern angeboten.' : 'Eine andere Nummer wählen, um den Schlüssel umzuhängen.'}</div>
    <div class="zwei"><div class="f"><label>Hausverwaltung / Bereich</label><select class="inp" id="fBlock"><option value="">Kein Bereich</option>${D.bloecke.map(b => `<option value="${b.id}">${esc(b.name)} (${b.von}–${b.bis})</option>`).join('')}</select></div>
      <div class="f"><label>Nummer *</label><select class="inp" id="fNr"></select></div></div>
    <div class="zwei"><div class="f"><label>Kd.-Nr.</label><input class="inp" id="fKd" value="${esc(k.kd_nr)}" inputmode="numeric" autocomplete="off"></div>
      <div class="f"><label>Kunde / Eigentümer *</label><input class="inp" id="fKunde" value="${esc(k.kunde)}" autocomplete="off"></div></div>
    <div id="fKdHin"></div>
    <div class="zwei"><div class="f"><label>Straße / Objekt</label><input class="inp" id="fStr" value="${esc(k.strasse)}" autocomplete="off"></div>
      <div class="f"><label>PLZ Ort</label><input class="inp" id="fOrt" value="${esc(k.plz_ort)}" placeholder="38700 Braunlage" autocomplete="off"></div></div>
    <div class="f"><label>Wofür ist der Schlüssel?</label><div class="wahl" id="fArt">${Object.entries(ART).map(([a, t]) => `<button type="button" data-a="${a}">${t === 'Art offen' ? 'Noch offen' : t}</button>`).join('')}</div></div>
    <div class="f" id="fArtTW"><label>Sonstiges, und zwar *</label><input class="inp" id="fArtT" value="${esc(k.art_text)}" placeholder="z. B. Garage, Technikraum, Schaltschrank" autocomplete="off"></div>
    <div class="zwei"><div class="f"><label>Anzahl Schlüssel am Haken</label><input class="inp" id="fAnz" type="number" min="1" max="50" value="${k.anzahl || 1}"></div><div class="f"><label>&nbsp;</label><label class="chk"><input type="checkbox" id="fWart"${k.wartung ? ' checked' : ''}> Wartungskunde</label></div></div>
    <div class="f"><label>Notiz</label><textarea class="inp" id="fNotiz">${esc(k.notiz)}</textarea></div>
    <p class="err" id="fErr"></p>
    <div class="knoepfe"><button class="btn sec" data-zu>Abbrechen</button><button class="btn cta" id="fOk">Speichern</button></div>`);
  let art = k.art;
  const setArt = a => { art = a; f.q('#fArt').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.a === a)); f.q('#fArtTW').hidden = a !== 'sonstiges' };
  f.q('#fArt').onclick = e => { const b = e.target.closest('button'); if (b) setArt(b.dataset.a) }; setArt(art);
  const nummern = () => {
    const L = freieNummern(blockId, neu ? null : k.nr), cur = +f.q('#fNr').value || k.nr;
    f.q('#fNr').innerHTML = L.length ? L.map(n => `<option value="${n}"${n === cur ? ' selected' : ''}>${n}${!neu && n === k.nr ? ' (bisher)' : ''}</option>`).join('') : '<option value="">keine Nummer frei</option>';
  };
  f.q('#fBlock').value = blockId; nummern();
  f.q('#fBlock').onchange = e => {
    blockId = e.target.value; nummern();
    const b = D.bloecke.find(x => x.id === +blockId);
    if (b && !f.q('#fKunde').value.trim()) f.q('#fKunde').value = b.name;
    if (b && b.kd_nr && !f.q('#fKd').value.trim()) f.q('#fKd').value = b.kd_nr;
  };
  f.q('#fKd').oninput = () => {
    const kd = f.q('#fKd').value.trim(), t = kd && D.schluessel.find(x => x.kd_nr === kd && x.id !== k.id);
    f.q('#fKdHin').innerHTML = t ? `<div class="info">Kd.-Nr. ${esc(kd)} gibt es schon: <b>${esc(t.kunde)}</b> (Nr. ${t.nr}, ${esc(adr(t))}). ${f.q('#fKunde').value.trim() !== t.kunde ? '<button class="btn sec sm" id="fKdUe" type="button">Namen übernehmen</button>' : ''}</div>` : '';
    const u = f.q('#fKdUe'); if (u) u.onclick = () => { f.q('#fKunde').value = t.kunde; f.q('#fKdHin').innerHTML = '' };
  };
  f.q('#fOk').onclick = e => ausfuehren(e.target, async () => {
    const nr = +f.q('#fNr').value; if (!nr) throw new Error('Bitte eine Nummer wählen.');
    const id = await rpc('sk_speichern', { p: { id: neu ? null : k.id, nr, kd_nr: f.q('#fKd').value, kunde: f.q('#fKunde').value, strasse: f.q('#fStr').value, plz_ort: f.q('#fOrt').value,
      art, art_text: f.q('#fArtT').value, anzahl: +f.q('#fAnz').value || 1, wartung: f.q('#fWart').checked, notiz: f.q('#fNotiz').value } });
    f.zu(); await neuLaden(); toast(neu ? `Schlüssel Nr. ${nr} angelegt` : 'Gespeichert'); detail(id);
  }, f.q('#fErr'));
}
function loeschenFenster(k) {
  const f = fenster(`<h3>${nrBox(k)}<span>Schlüssel löschen</span></h3><div class="sub">${esc(k.kunde)} · ${esc(adr(k))}</div>
    <div class="warn">Nur löschen, wenn der Schlüssel nicht mehr da ist oder falsch angelegt wurde. Wird er dem Kunden übergeben, bitte „An Kunden zurückgeben“ mit Unterschrift nutzen. Nr. ${k.nr} ist danach frei.</div>
    <div class="f"><label>Grund *</label><input class="inp" id="lGrund" autocomplete="off"></div><p class="err" id="lErr"></p>
    <div class="knoepfe"><button class="btn sec" data-zu>Abbrechen</button><button class="btn del" id="lOk">Löschen</button></div>`);
  f.q('#lOk').onclick = e => ausfuehren(e.target, async () => { await rpc('sk_loeschen', { p_id: k.id, p_grund: f.q('#lGrund').value }); f.zu(); await neuLaden(); toast(`Nr. ${k.nr} gelöscht`) }, f.q('#lErr'));
}

/* ---------- Nummernbereiche (Verwalter) ---------- */
function bereicheFenster() {
  const B = belegt();
  const f = fenster(`<h3>Nummernbereiche</h3><div class="sub">Reservierte Bereiche für Hausverwaltungen. Freie Nummern darin werden nur angeboten, wenn beim Anlegen der Bereich gewählt ist.</div>
    <table class="btab"><thead><tr><th>Bereich</th><th>Nummern</th><th>belegt</th><th></th></tr></thead><tbody>${D.bloecke.map(b => { let n = 0; for (let i = b.von; i <= b.bis; i++) if (B.has(i)) n++; return `<tr><td><b>${esc(b.name)}</b>${b.kd_nr ? '<br><small>Kd.-Nr. ' + esc(b.kd_nr) + '</small>' : ''}</td><td>${b.von}–${b.bis}</td><td>${n} von ${b.bis - b.von + 1}</td><td><button class="btn sec sm" data-b="${b.id}">Ändern</button></td></tr>` }).join('')}</tbody></table>
    <div class="knoepfe" style="margin-bottom:16px"><button class="btn sec" id="bNeu">+ Bereich</button></div>
    <div class="zwei"><div class="f"><label>Höchste Nummer im Kasten</label><input class="inp" id="bMax" type="number" min="1" value="${D.max_nr}"></div><div class="f"><label>&nbsp;</label><button class="btn sec" id="bMaxOk">Übernehmen</button></div></div>
    <p class="err" id="bErr"></p><div class="knoepfe"><button class="btn sec" data-zu>Schließen</button></div>`);
  f.q('.btab').onclick = e => { const b = e.target.closest('[data-b]'); if (b) { f.zu(); bereichFenster(D.bloecke.find(x => x.id === +b.dataset.b)) } };
  f.q('#bNeu').onclick = () => { f.zu(); bereichFenster(null) };
  f.q('#bMaxOk').onclick = e => ausfuehren(e.target, async () => { await rpc('sk_max_setzen', { p_max: +f.q('#bMax').value }); f.zu(); await neuLaden(); toast('Höchste Nummer gespeichert') }, f.q('#bErr'));
}
function bereichFenster(b) {
  const neu = !b; b = b || { name: '', von: '', bis: '', kd_nr: '', notiz: '' };
  const f = fenster(`<h3>${neu ? 'Neuer Bereich' : 'Bereich ändern'}</h3>
    <div class="f"><label>Name (Hausverwaltung) *</label><input class="inp" id="rName" value="${esc(b.name)}"></div>
    <div class="zwei"><div class="f"><label>von Nr. *</label><input class="inp" id="rVon" type="number" min="1" value="${b.von}"></div><div class="f"><label>bis Nr. *</label><input class="inp" id="rBis" type="number" min="1" value="${b.bis}"></div></div>
    <div class="f"><label>Kd.-Nr. (wird beim Anlegen vorgeschlagen)</label><input class="inp" id="rKd" value="${esc(b.kd_nr)}"></div>
    <p class="err" id="rErr"></p>
    <div class="knoepfe"><button class="btn sec" data-zu>Abbrechen</button>${neu ? '' : '<button class="btn del" id="rLoe">Bereich auflösen</button>'}<button class="btn cta" id="rOk">Speichern</button></div>`);
  f.q('#rOk').onclick = e => ausfuehren(e.target, async () => { await rpc('sk_block_speichern', { p: { id: neu ? null : b.id, name: f.q('#rName').value, von: +f.q('#rVon').value, bis: +f.q('#rBis').value, kd_nr: f.q('#rKd').value } }); f.zu(); await neuLaden(); bereicheFenster() }, f.q('#rErr'));
  if (!neu) f.q('#rLoe').onclick = e => { if (confirm(`Bereich „${b.name}“ auflösen? Die Schlüssel bleiben, die freien Nummern sind danach für alle wählbar.`)) ausfuehren(e.target, async () => { await rpc('sk_block_loeschen', { p_id: b.id }); f.zu(); await neuLaden(); bereicheFenster() }, f.q('#rErr')) };
}

/* ---------- Drucken / Export ---------- */
function drucken(html) { $('#druck').innerHTML = html; setTimeout(() => window.print(), 60) }
window.addEventListener('afterprint', () => { $('#druck').innerHTML = '' });
const kopf = t => `<div class="kopf"><div><h1>${t}</h1></div><div style="text-align:right"><img src="logo-heise.png" alt=""><br><small>Heise Haustechnik GmbH &amp; Co. KG · Braunlage</small></div></div>`;
async function quittung(bid) {
  let q; try { q = await rpc('sk_quittung', { p_buchung: bid }) } catch (e) { toast(e.message); return }
  const s = q.schluessel, b = q.buchung, a = q.abholung;
  const titel = { entnahme_extern: 'Quittung Schlüsselabholung', rueckgabe: 'Quittung Schlüsselrückgabe', an_kunde: 'Quittung Schlüsselrückgabe an den Kunden', entnahme: 'Schlüsselentnahme' }[b.art] || 'Schlüsselquittung';
  const block = (t, x) => x ? `<h2>${t}</h2><div class="feld"><b>Datum, Uhrzeit</b><span>${dZeit(x.zeit)}</span><b>Name</b><span>${esc(x.person || '')}</span>${x.firma ? `<b>Firma</b><span>${esc(x.firma)}</span>` : ''}${x.zweck ? `<b>Zweck</b><span>${esc(x.zweck)}</span>` : ''}${x.notiz ? `<b>Notiz</b><span>${esc(x.notiz)}</span>` : ''}<b>Gebucht von</b><span>${esc(x.gebucht_von || '')}</span></div>${x.unterschrift ? `<div class="unt"><img src="${x.unterschrift}" alt="Unterschrift"><p>Unterschrift ${esc(x.person || '')}</p></div>` : ''}` : '';
  drucken(`${kopf(titel)}<div class="feld"><b>Schlüssel-Nr.</b><span>${s.nr}</span><b>Kunde</b><span>${esc(s.kunde || '')}${s.kd_nr ? ' (Kd.-Nr. ' + esc(s.kd_nr) + ')' : ''}</span><b>Objekt</b><span>${esc([s.strasse, s.plz_ort].filter(Boolean).join(', '))}</span>${s.art !== 'unbekannt' || s.anzahl > 1 ? `<b>Für</b><span>${esc(s.art === 'sonstiges' ? s.art_text : s.art === 'unbekannt' ? '' : ART[s.art])}${s.anzahl > 1 ? (s.art !== 'unbekannt' ? ', ' : '') + s.anzahl + ' Stück' : ''}</span>` : ''}</div>
    ${b.art === 'rueckgabe' ? block('Abholung', a) + block('Rückgabe', b) : block(b.art === 'an_kunde' ? 'Übergabe an den Kunden' : 'Abholung', b)}
    <p style="margin-top:6mm;font-size:9.5pt">${b.art === 'an_kunde' ? 'Der Schlüssel wurde dem Kunden bzw. der genannten Person endgültig übergeben.' : b.art === 'rueckgabe' ? 'Der Schlüssel wurde vollständig zurückgegeben.' : 'Der Schlüssel wurde an die genannte Person ausgegeben. Bitte nach Gebrauch zurückbringen.'}</p>
    <div class="fuss">Erstellt mit My Heise App am ${dZeit(new Date())}</div>`);
}
function listeDrucken() {
  const L = gefiltert(D.schluessel.filter(aktiv)).sort((a, b) => a.nr - b.nr);
  drucken(`${kopf('Schlüsselkasten')}<p style="margin-bottom:3mm;font-size:9.5pt">Stand ${dZeit(new Date())} · ${L.length} Schlüssel</p><table><thead><tr><th>Nr.</th><th>Kd.-Nr.</th><th>Kunde</th><th>Straße / Objekt</th><th>Für</th><th>Status</th></tr></thead><tbody>${L.map(k => `<tr><td><b>${k.nr}</b></td><td>${esc(k.kd_nr)}</td><td>${esc(k.kunde)}</td><td>${esc(adr(k))}</td><td>${esc(k.art === 'unbekannt' ? '' : artTxt(k))}${k.anzahl > 1 ? ' (' + k.anzahl + ')' : ''}</td><td>${k.status === 'kasten' ? '' : esc(STATUS[k.status] + ': ' + k.bei_name)}</td></tr>`).join('')}</tbody></table>`);
}
function csv(name, kopfzeile, zeilen) {
  const z = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s };
  const txt = '﻿' + [kopfzeile, ...zeilen].map(r => r.map(z).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 500);
}
function listeCsv() {
  csv('Schluesselliste_' + isoTag(new Date()) + '.csv', ['Nr.', 'Kd.-Nr.', 'Kunde', 'Straße / Objekt', 'PLZ Ort', 'Haustür', 'Heizraum', 'Sonstiges', 'Anzahl', 'Wartungskunde', 'Status', 'Bei', 'Seit', 'Notiz'],
    D.schluessel.filter(aktiv).sort((a, b) => a.nr - b.nr).map(k => [k.nr, k.kd_nr, k.kunde, k.strasse, k.plz_ort, /haustuer|beides/.test(k.art) ? 'x' : '', /heizraum|beides/.test(k.art) ? 'x' : '', k.art === 'sonstiges' ? k.art_text : '', k.anzahl, k.wartung ? 'ja' : '', STATUS[k.status], k.bei_name || '', k.status === 'kasten' ? '' : dZeit(k.seit), k.notiz]));
}
function mehrFenster() {
  const f = fenster(`<h3>Mehr</h3><div class="menue">
    <button class="btn sec" id="mDruck">Schlüsselliste drucken / PDF</button><button class="btn sec" id="mCsv">Schlüsselliste als CSV (Excel)</button>
    ${darf() ? '<button class="btn sec" id="mBer">Nummernbereiche und höchste Nummer</button>' : ''}
    <button class="btn sec" data-zu>Schließen</button></div>`);
  f.q('#mDruck').onclick = () => { f.zu(); listeDrucken() }; f.q('#mCsv').onclick = () => { f.zu(); listeCsv() };
  if (darf()) f.q('#mBer').onclick = () => { f.zu(); bereicheFenster() };
}

/* ===================== Ereignisse ===================== */
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; TAB = b.dataset.t; ls('tab', TAB); ANZ = 80; zeigen() };
let suchT; $('#suche').oninput = () => { clearTimeout(suchT); suchT = setTimeout(() => { ANZ = 80; zeigen() }, TAB === 'buchungen' ? 300 : 80) };
$('#artFil').onchange = $('#blockFil').onchange = () => { ANZ = 80; zeigen() };
$('#neuBtn').onclick = () => formular(null);
$('#mehrBtn').onclick = mehrFenster;
document.addEventListener('click', e => {
  const z = e.target.closest('[data-zurueck]'); if (z) { const k = D.schluessel.find(x => x.id === z.dataset.zurueck); if (k) zurueckFenster(k); return }
  const q = e.target.closest('[data-quittung]'); if (q) { quittung(q.dataset.quittung); return }
  if (e.target.closest('.bd')) return;
  if (e.target.id === 'mehrZeigen') { ANZ += 200; zeigen(); return }
  const k = e.target.closest('[data-id]'); if (k) { detail(k.dataset.id); return }
  const fr = e.target.closest('[data-frei]');
  if (fr) { if (darf()) formular(null, +fr.dataset.frei); else toast(`Nr. ${fr.dataset.frei} ist frei`) }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const b = document.querySelector('.bd:last-of-type'); if (b) b.remove() } });
let weg = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) { weg = Date.now(); return } if (Date.now() - weg > 60000 && !document.querySelector('.bd')) neuLaden().catch(e => toast(e.message)) });

(async function start() {
  if (!storedRefresh()) return toLogin();
  try { await laden() } catch (e) { $('#boot').textContent = e.message; return }
  if (!D.rolle) { $('#boot').textContent = 'Für dieses Konto ist kein Benutzerprofil hinterlegt.'; return }
  $('#rolleTxt').textContent = { admin: 'Admin', verwalter: 'Verwalter', nutzer: 'Entnehmen und zurückbuchen' }[D.rolle] || '';
  $('#neuBtn').hidden = !darf();
  blockOptionen();
  $('#boot').hidden = true; $('#app').hidden = false; zeigen();
})();
</script>
</body>
</html>
