<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:15px/1.45 Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit;text-decoration:none}[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 16px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .zur{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);font-size:20px;font-weight:700;flex:none}
.top b{font-size:17px;font-weight:780;display:block}.top small{font-size:12px;color:var(--ink-3);font-weight:600}
.top .sp{flex:1}
.shell{max-width:1100px;margin:0 auto;padding:4px 16px calc(40px + var(--safe-b))}
.leiste{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 12px}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;max-width:100%;overflow-x:auto}

.liste{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.k{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.k:hover{outline:2px solid var(--line)}

.chip.h{background:#e8eefb;color:#2c60a7}.chip.z{background:#fbe9e9;color:#c32328}.chip.o{background:#fff5d6;color:#8a6a00}.chip.w{background:var(--ok-bg);color:var(--ok)}.chip.alt{background:var(--red);color:#fff}
.leer{padding:30px;text-align:center;color:var(--ink-3);background:var(--surface);border-radius:16px}
.mehr{text-align:center;margin:12px}

.kasten button.frei{background:transparent;color:var(--ink-3);outline:1.5px dashed var(--line);outline-offset:-2px;font-weight:600}
.kasten button.res{background:repeating-linear-gradient(45deg,#f1f3f7 0 4px,#fff 4px 8px);color:var(--ink-3);font-weight:600}
.kasten button.vermisst{background:var(--red);color:#fff}.kasten button.mitarbeiter{background:var(--accent);color:#fff}.kasten button.extern{background:var(--ext);color:#fff}
.kasten .bt{grid-column:1/-1;font-size:12.5px;font-weight:780;color:var(--brand);padding:8px 2px 2px}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin:12px 4px 0;font-size:12.5px;color:var(--ink-2)}.leg i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
/* Buchungen */
.bu{display:grid;gap:6px}.bz{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);font-size:14px}
.bz .zt{flex:none;width:92px;color:var(--ink-3);font-size:12.5px;font-weight:650}.bz .bt2{flex:1;min-width:0}.bz .bt2 small{display:block;color:var(--ink-3);font-size:12px}
.bz .bnr{flex:none;font-weight:800;color:var(--brand);width:40px}
/* Fenster */
.bd{position:fixed;inset:0;z-index:100;background:rgba(8,13,21,.5);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.bd{align-items:center}}
.sh{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + var(--safe-b));max-height:94dvh;overflow:auto;animation:rise .2s}
@media(min-width:700px){.sh{border-radius:24px}}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.sh h3{font-size:18px;font-weight:780;margin-bottom:4px;display:flex;align-items:center;gap:10px}.sh .sub{color:var(--ink-2);font-size:13.5px;margin-bottom:14px}
.sh h3 .nr{width:44px;height:44px;font-size:16px}
.f{display:grid;gap:5px;margin-bottom:12px}.f label{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.inp{width:100%;min-height:46px;padding:0 12px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;outline:none}
textarea.inp{padding:10px 12px;min-height:70px;resize:vertical}
.inp:focus{border-color:var(--accent)}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}.zwei .f{min-width:0}
.wahl{display:flex;flex-wrap:wrap;gap:6px}.wahl button{min-height:40px;padding:0 12px;border-radius:12px;background:var(--surface-2);font-weight:650;font-size:14px}
.wahl button.on{background:var(--brand);color:#fff}
.warn{background:var(--amber-bg);border-radius:14px;padding:12px 14px;margin:6px 0 12px;font-size:14px}
.info{background:var(--surface-2);border-radius:14px;padding:10px 14px;margin:0 0 12px;font-size:13.5px;color:var(--ink-2)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-bottom:14px}.dl dt{color:var(--ink-3);font-weight:650}.dl dd{font-weight:600}
.knoepfe{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}.knoepfe .btn{flex:1 1 150px;line-height:1.2;padding:8px 14px}
.vl{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.vl h4{font-size:13px;color:var(--ink-3);margin-bottom:6px}
.vl div{display:flex;gap:10px;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--surface-2)}.vl div span{flex:none;width:104px;color:var(--ink-3);font-size:12.5px}.vl div p{flex:1}
.vl button.q{color:var(--ext);font-weight:700;font-size:12.5px;text-decoration:underline}
.chk{display:flex;gap:10px;align-items:center;font-size:14.5px;font-weight:600;margin-bottom:12px}.chk input{width:20px;height:20px}

  #druck .fuss{margin-top:10mm;font-size:8.5pt;color:#8491a3}
}

<body>
<header class="top">
  <a class="zur" href="index.html" aria-label="Zur Startseite">‹</a>
  <div><b>Schlüssel</b><small id="rolleTxt"></small></div>
  <div class="sp"></div>
  <button class="btn sec sm" id="mehrBtn">Mehr</button>
  <button class="btn cta sm" id="neuBtn" hidden>+ Schlüssel</button>
</header>
<main class="shell">
  <div id="boot">Lädt …</div>
  <div id="app" hidden>
    <div id="meine"></div>
    <div class="leiste">
      <div class="seg" id="tabs">
        <button data-t="liste">Schlüssel</button><button data-t="unterwegs">Unterwegs</button><button data-t="vermisst" hidden>Nicht auffindbar</button><button data-t="kasten">Kasten</button><button data-t="buchungen">Buchungen</button><button data-t="archiv">Archiv</button>
      </div>
    </div>
    <div class="leiste" id="filterLeiste">
      <label class="such"><input type="search" id="suche" placeholder="Nr., Kunde, Kd.-Nr., Straße …" autocomplete="off"></label>
      <select class="fil" id="artFil" aria-label="Art">
        <option value="">Alle Arten</option><option value="haustuer">Haustür</option><option value="heizraum">Heizraum</option><option value="beides">Haustür + Heizraum</option><option value="sonstiges">Sonstiges</option><option value="unbekannt">Art offen</option>
      </select>
      <select class="fil" id="blockFil" aria-label="Bereich"></select>
    </div>
    <div id="ansicht"></div>
  </div>
</main>
<div id="druck"></div>
<div class="toast" id="toast"></div>

/* ===================== Fenster ===================== */
function fenster(html, kl) {
  const bd = document.createElement('div'); bd.className = 'bd' + (kl ? ' ' + kl : ''); bd.innerHTML = `<div class="sh" role="dialog">${html}</div>`;
  bd.addEventListener('click', e => { if (e.target === bd) bd.remove() }); document.body.appendChild(bd);
  const zu = () => bd.remove(); bd.querySelectorAll('[data-zu]').forEach(b => b.onclick = zu); return { el: bd, zu, q: s => bd.querySelector(s) };
}
async function ausfuehren(btn, fn, errEl) {
  btn.disabled = true; if (errEl) errEl.textContent = '';
  try { await fn(); return true } catch (e) { if (errEl) errEl.textContent = e.message; else toast(e.message); return false } finally { btn.disabled = false }
}

/* ---------- Unterschrift ---------- */
function unterschriftFeld(el) {
  el.innerHTML = '<canvas></canvas><div class="linie"></div><span class="ph">Hier unterschreiben</span><button type="button" class="x">Löschen</button>';
  const c = el.querySelector('canvas'), ctx = c.getContext('2d'); let striche = 0, zeichnet = false, last = null;
  const groesse = () => { const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1); c.width = r.width * dpr; c.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0d1524'; striche = 0 };
  requestAnimationFrame(groesse);
  const pos = e => { const r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top] };
  c.addEventListener('pointerdown', e => { zeichnet = true; last = pos(e); c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, 7); ctx.fillStyle = '#0d1524'; ctx.fill(); striche++; el.querySelector('.ph').hidden = true });
  c.addEventListener('pointermove', e => { if (!zeichnet) return; const p = pos(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; striche++ });
  const ende = () => { zeichnet = false }; c.addEventListener('pointerup', ende); c.addEventListener('pointercancel', ende);
  el.querySelector('.x').onclick = () => { ctx.clearRect(0, 0, c.width, c.height); striche = 0; el.querySelector('.ph').hidden = false };
  return { leer: () => striche < 6, bild: () => {
    // auf weißen Hintergrund, verkleinert (spart Platz in der Datenbank)
    const o = document.createElement('canvas'), w = Math.min(600, c.width); o.width = w; o.height = Math.round(c.height * w / c.width);
    const x = o.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, o.width, o.height); x.drawImage(c, 0, 0, o.width, o.height); return o.toDataURL('image/png') } };
}

function csv(name, kopfzeile, zeilen) {
  const z = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s };
  const txt = '﻿' + [kopfzeile, ...zeilen].map(r => r.map(z).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove() }, 500);
}
function listeCsv() {
  csv('Schluesselliste_' + isoTag(new Date()) + '.csv', ['Nr.', 'Kd.-Nr.', 'Kunde', 'Straße / Objekt', 'PLZ Ort', 'Haustür', 'Heizraum', 'Sonstiges', 'Anzahl', 'Wartungskunde', 'Status', 'Bei', 'Seit', 'Notiz'],
    D.schluessel.filter(aktiv).sort((a, b) => a.nr - b.nr).map(k => [k.nr, k.kd_nr, k.kunde, k.strasse, k.plz_ort, /haustuer|beides/.test(k.art) ? 'x' : '', /heizraum|beides/.test(k.art) ? 'x' : '', k.art === 'sonstiges' ? k.art_text : '', k.anzahl, k.wartung ? 'ja' : '', STATUS[k.status], k.bei_name || '', k.status === 'kasten' ? '' : dZeit(k.seit), k.notiz]));
}
/* ---------- Unterschrift auf dem Tablet ---------- */
const VORGANG = { entnahme_extern: 'Abholung', rueckgabe: 'Rückgabe in den Kasten', an_kunde: 'Endgültige Rückgabe an den Kunden' };
const BESTAET = { entnahme_extern: 'Ich habe den Schlüssel erhalten und bringe ihn nach Gebrauch zurück.', rueckgabe: 'Ich habe den Schlüssel zurückgegeben.', an_kunde: 'Ich habe den Schlüssel endgültig erhalten.' };
let TABLET = ls('tablet') === '1', OFFEN = [];
async function tabletAnfrage(f, p, k) {
  const id = await rpc('sk_anfrage_neu', { p });
  let qrHtml = '';
  if (p.weg === 'qr') {
    const st0 = await rpc('sk_anfrage_status', { p_id: id });
    const url = new URL('unterschrift.html?t=' + st0.token, location.href).href;
    const q = qrcode(0, 'M'); q.addData(url); q.make();
    qrHtml = `<div class="qrbox">${q.createSvgTag(6, 2)}<div><b>Mit der Handy-Kamera scannen und unterschreiben</b></div><span class="ab">gültig bis ${new Date(st0.gueltig_bis).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr, nur einmal</span><small>${esc(url)}</small></div>`;
  }
  f.zu();
  const w = fenster(`<h3>${nrBox(k)}<span>Warte auf Unterschrift</span></h3><div class="sub">${esc(VORGANG[p.art])} · ${esc(p.person.trim())}</div>
    ${p.weg === 'qr' ? qrHtml + '<div class="warte" style="padding:6px 0"><i></i></div>' : `<div class="warte"><i></i><div>Bitte am Tablet unterschreiben lassen.<br><small style="color:var(--ink-3)">Auf dem Tablet die Schlüsselseite mit deinem Konto öffnen. Ist es unter „Mehr“ als Unterschriften-Tablet eingerichtet, erscheint die Unterschrift von selbst, sonst oben „Unterschrift wartet“ antippen.</small></div></div>`}
    <p class="err" id="wErr"></p><div class="knoepfe"><button class="btn sec" id="wAb">Abbrechen</button></div>`);
  let aktiv = true;
  w.q('#wAb').onclick = async () => { aktiv = false; w.zu(); try { await rpc('sk_anfrage_abbrechen', { p_id: id }) } catch (e) { } toast('Abgebrochen, nichts gebucht') };
  while (aktiv && document.body.contains(w.el)) {
    await new Promise(r => setTimeout(r, 2000));
    if (!aktiv || !document.body.contains(w.el)) { if (aktiv) { aktiv = false; rpc('sk_anfrage_abbrechen', { p_id: id }).catch(() => { }) } break }
    let st; try { st = await rpc('sk_anfrage_status', { p_id: id }) } catch (e) { w.q('#wErr').textContent = e.message; continue }
    if (st.status === 'erledigt') { aktiv = false; w.zu(); await neuLaden(); toast(`Nr. ${k.nr}: unterschrieben und gebucht`); quittungFrage(st.buchung_id); break }
    if (st.status !== 'offen') { aktiv = false; (w.q('.qrbox') || {}).hidden = true; w.q('.warte').innerHTML = `<div>${st.status === 'abgelaufen' ? `Die Anfrage ist abgelaufen (${p.weg === 'qr' ? 15 : 30} Minuten).` : 'Die Anfrage wurde abgebrochen.'} Es wurde nichts gebucht.</div>`; w.q('#wAb').textContent = 'Schließen'; w.q('#wAb').onclick = w.zu; break }
  }
}

}

$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; TAB = b.dataset.t; ls('tab', TAB); ANZ = 80; zeigen() };
let suchT; $('#suche').oninput = () => { clearTimeout(suchT); suchT = setTimeout(() => { ANZ = 80; zeigen() }, TAB === 'buchungen' ? 300 : 80) };
$('#artFil').onchange = $('#blockFil').onchange = () => { ANZ = 80; zeigen() };
$('#neuBtn').onclick = () => formular(null);
$('#mehrBtn').onclick = mehrFenster;
document.addEventListener('click', e => {
  const u = e.target.closest('[data-unterschrift]'); if (u) { const a = OFFEN.find(x => x.id === u.dataset.unterschrift); if (a) tabletFenster(a); return }
  const z = e.target.closest('[data-zurueck]'); if (z) { const k = D.schluessel.find(x => x.id === z.dataset.zurueck); if (k) zurueckFenster(k); return }
  const q = e.target.closest('[data-quittung]'); if (q) { quittung(q.dataset.quittung); return }
  if (e.target.closest('.bd')) return;
  if (e.target.id === 'mehrZeigen') { ANZ += 200; zeigen(); return }
  const k = e.target.closest('[data-id]'); if (k) { detail(k.dataset.id); return }
  const fr = e.target.closest('[data-frei]');
  if (fr) { if (darf()) formular(null, +fr.dataset.frei); else toast(`Nr. ${fr.dataset.frei} ist frei`) }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const b = document.querySelector('.bd:last-of-type'); if (b) b.remove() } });
let weg = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) { weg = Date.now(); return } if (Date.now() - weg > 60000 && !document.querySelector('.bd')) neuLaden().catch(e => toast(e.message)); offenPruefen(TABLET) });

(async function start() {
  if (!storedRefresh()) return toLogin();
  try { await laden() } catch (e) { $('#boot').textContent = e.message; return }
  if (!D.rolle) { $('#boot').textContent = 'Für dieses Konto ist kein Benutzerprofil hinterlegt.'; return }
  $('#rolleTxt').textContent = { admin: 'Admin', verwalter: 'Verwalter', nutzer: 'Entnehmen und zurückbuchen' }[D.rolle] || '';
  $('#neuBtn').hidden = !darf();
  blockOptionen();
  $('#boot').hidden = true; $('#app').hidden = false; zeigen();
  offenPruefen(true);
})();
</script>
