t.","Vor Erdarbeiten Leitungspläne einholen. Erdkabel und Freileitungen beachten.","Kabel getroffen oder beschädigt? Arbeit stoppen, Abstand halten, sofort melden."],"z":"warnung","i":["schloss","blitz","werkzeug"]},{"titel":"Bei einem Stromunfall","punkte":["Erst den Strom abschalten: Stecker ziehen oder Sicherung ausschalten.","Fasse den Verunglückten nicht an, solange er unter Strom steht.","112 rufen und Erste Hilfe leisten. Auch bei leichten Unfällen muss ein Arzt ran.","Freileitung oder Hochspannung: großen Abstand halten, 112 rufen, Fachleute abschalten lassen."],"z":"rettung","i":["telefon","kreuz","stecker"],"merke":"Erst abschalten, dann helfen. Sonst bist du das nächste Opfer."},{"titel":"Das Wichtigste in Kürze","punkte":["Nur Elektrofachkräfte arbeiten an Elektroanlagen.","Kabel und Geräte vor jeder Benutzung ansehen. Defekt heißt aussortieren und melden.","Kabeltrommel abrollen, Baustrom nur mit Schutzschalter, Nässe meiden.","Bei Unfall: Strom aus, 112, Erste Hilfe."],"z":"info","i":["blitz","kreuz"]}],"fragen":[{"frage":"Wer darf an Verteilern und festen Elektroanlagen arbeiten?","antworten":["Jeder, der schon mal eine Lampe angeschlossen hat","Nur Elektrofachkräfte","Jeder mit einem Spannungsprüfer"],"richtig":1,"erklaerung":"Arbeiten an Elektroanlagen brauchen eine Ausbildung und Erfahrung. Ein Messgerät allein reicht nicht, deshalb machen das nur Elektrofachkräfte."},{"frage":"Am Kabel deines Bohrhammers ist die Isolierung angeschnitten. Was tust du?","antworten":["Gerät nicht benutzen, aussortieren, kennzeichnen und melden","Mit Isolierband umwickeln und weiterarbeiten","Nur mit trockenen Gummihandschuhen weiterarbeiten"],"richtig":0,"erklaerung":"Ein beschädigtes Kabel kann Strom auf das Gehäuse und auf dich übertragen. Ein defektes Gerät wird nicht benutzt, sondern aussortiert und gemeldet."},{"frage":"Warum rollst du eine Kabeltrommel ganz ab?","antworten":["Damit das Kabel weniger verschmutzt","Damit die Trommel leichter zu tragen ist","Aufgewickelt kann sich das Kabel gefährlich erhitzen"],"richtig":2,"erklaerung":"Bei aufgewickeltem Kabel staut sich die Wärme. Das kann die Isolierung schmelzen und einen Brand oder Kurzschluss auslösen."},{"frage":"Ein Kollege hängt an einem defekten Elektrogerät fest. Was tust du zuerst?","antworten":["Ihn sofort mit bloßen Händen wegziehen","Ihn mit einem Werkzeug wegdrücken","Erst Kollegen holen und abwarten","Strom abschalten, Stecker ziehen, dann Erste Hilfe leisten und 112 rufen"],"richtig":3,"erklaerung":"Solange der Strom fließt, kann er auch dich treffen. Erst abschalten, dann helfen und den Notruf 112 wählen."}]},{"nr":8,"titel":"Gasgeruch und Gasanlagen","beschreibung":"Wie du bei Gasgeruch richtig reagierst und sicher mit Gasanlagen, Kohlenmonoxid und Flüssiggas umgehst.","dauer_min":8,"zielgruppen":["gewerblich"],"folien":[{"titel":"Gas ist unser Arbeitsalltag","punkte":["Gas kann mit Luft ein explosives Gemisch bilden. Ein Funke reicht.","Schon eine kleine Undichtigkeit kann gefährlich werden.","Beispiel: Beim Kundentermin riecht es im Keller nach Gas. Du willst Licht anmachen."],"z":"warnung","i":["flamme","gasflasche","ausruf"],"merke":"Bei Gasgeruch zählt jede Sekunde, aber ohne Hektik."},{"titel":"Gas riecht nur durch Zusatz","punkte":["Erdgas und Flüssiggas sind von Natur aus geruchlos.","Ein Geruchsstoff macht Gas für die Nase erkennbar.","Gewöhne dich nicht an leichten Geruch. Ignoriere ihn nie."],"z":"info","i":["wolke","gasflasche"]},{"titel":"Bei Gasgeruch: das ist tabu","punkte":["Keine offene Flamme, kein Feuerzeug, nicht rauchen.","Keine Lichtschalter, Klingeln oder Stecker in der Gefahrenzone betätigen.","Handy nicht im Gefahrenbereich benutzen. Erst draußen telefonieren.","Keine Maschinen oder Motoren starten."],"z":"verbot","i":["flamme","funke","telefon"],"merke":"Jeder Funke kann eine Explosion auslösen."},{"titel":"Bei Gasgeruch: das tust du","punkte":["Fenster und Türen öffnen, damit Durchzug entsteht.","Hauptabsperrhahn schließen, aber nur, wenn es gefahrlos möglich ist.","Gebäude verlassen und andere warnen. Klopfen statt klingeln.","Draußen 112 und den Entstörungsdienst des Gasversorgers anrufen. Nicht zurückgehen."],"z":"rettung","i":["ausgang","telefon","person"]},{"titel":"Arbeiten an Gasanlagen","punkte":["An Gasleitungen und Gasgeräten arbeiten nur berechtigte und qualifizierte Personen.","Nach den Arbeiten gehört eine Dichtheitsprüfung dazu.","Anlage nie improvisiert in Betrieb nehmen. Bei Zweifeln stoppen und nachfragen."],"z":"gebot","i":["rohr","werkzeug","gasflasche"],"merke":"Keine Dichtheitsprüfung, keine Inbetriebnahme."},{"titel":"Kohlenmonoxid und Flüssiggas","punkte":["Kohlenmonoxid (CO) ist unsichtbar und geruchlos. Es entsteht bei schlechter Verbrennung oder Abgasstau.","Warnzeichen: Kopfschmerz, Schwindel, Übelkeit. Danach droht Bewusstlosigkeit. Sofort ins Freie, 112.","Flüssiggasflaschen stehend lagern und transportieren, gegen Umfallen gesichert, Ventil geschlossen."],"z":"warnung","i":["wolke","gasflasche","kreuz"]},{"titel":"Das Wichtigste in Kürze","punkte":["Gasgeruch: keine Flamme, keine Schalter, Fenster auf, Gebäude verlassen.","Draußen 112 und Gasversorger anrufen. Nicht zurückgehen.","Gasarbeiten nur durch Berechtigte, danach Dichtheitsprüfung.","Kopfschmerz und Schwindel im Heizraum: sofort ins Freie."],"z":"info","i":["gasflasche","ausruf"]}],"fragen":[{"frage":"Was ist bei Gasgeruch verboten?","antworten":["Fenster und Türen öffnen","Den Lichtschalter betätigen","Das Gebäude verlassen"],"richtig":1,"erklaerung":"Beim Schalten kann ein kleiner Funke entstehen. Das reicht, um ein Gas-Luft-Gemisch zu zünden. Darum keine Schalter, Klingeln oder Flammen."},{"frage":"Von wo rufst du bei Gasgeruch den Notruf und den Entstörungsdienst an?","antworten":["Von außerhalb des Gebäudes","Aus dem Keller, damit du die Stelle genau beschreiben kannst","Gar nicht, wenn die Fenster offen sind"],"richtig":0,"erklaerung":"Auch ein Handy kann einen Funken erzeugen. Du rufst deshalb erst draußen an, in sicherem Abstand zur Gefahrenzone."},{"frage":"Was gehört nach Arbeiten an einer Gasleitung immer dazu?","antworten":["Ein kurzer Blick, ob es riecht","Sofort die Anlage in Betrieb nehmen","Eine Dichtheitsprüfung"],"richtig":2,"erklaerung":"Kleine Undichtigkeiten riecht man nicht immer. Die Dichtheitsprüfung zeigt, ob die Leitung wirklich dicht ist."},{"frage":"Ein Kollege klagt im Heizraum über Kopfschmerz und Schwindel. Du vermutest Kohlenmonoxid. Was tust du?","antworten":["Kurz hinsetzen und abwarten","Weiterarbeiten, bis es besser wird","Fenster schließen wegen Zugluft","Sofort ins Freie bringen und 112 rufen"],"richtig":3,"erklaerung":"Kohlenmonoxid kann schnell zur Bewusstlosigkeit führen. Deshalb sofort an die frische Luft und den Notruf wählen."}]},{"nr":9,"titel":"Heißarbeiten: Löten, Schweißen, Trennen","beschreibung":"Wie du bei Arbeiten mit Flamme, Funken und Hitze Brände, Verbrennungen und Rauch vermeidest.","dauer_min":7,"zielgruppen":["gewerblich"],"folien":[{"titel":"Funken, Hitze und Brandgefahr","punkte":["Funken fliegen weit. Glut kann erst Stunden später zum Brand werden.","Beispiel: Du lötest ein Kupferrohr neben einer Holzbalkenlage. Abends schwelt es.","Heiße Werkstücke brennen auch noch nach der Arbeit."],"z":"brand","i":["flamme","funke"],"merke":"Ein Schwelbrand fällt oft erst nach Feierabend auf."},{"titel":"Vor dem Start: Bereich sichern","punkte":["Brennbares entfernen oder nicht brennbar abdecken: Holz, Papier, Dämmung, Lösemittel.","Ritzen, Fugen und Rohrdurchführungen abdecken. Funken fallen hindurch.","Denke auch an die Seite hinter der Wand und das Geschoss darunter."],"z":"gebot","i":["funke","flamme","auge"]},{"titel":"Erlaubnisschein und Löschmittel","punkte":["Wo es die Betriebsanweisung vorsieht, arbeitest du nur mit Erlaubnisschein.","Feuerlöscher griffbereit halten. Du weißt, wo er steht und wie er geht.","Kenne den Fluchtweg und den Alarmweg für den Notfall."],"z":"brand","i":["dokument","loescher"]},{"titel":"Schutzausrüstung tragen","punkte":["Schweißhandschuhe schützen vor Hitze und Funken.","Schutzbrille oder Schweißschild passend zum Verfahren.","Kleidung aus schwer entflammbarem Material. Keine Kunstfasern, die schmelzen."],"z":"gebot","i":["brille","handschuh","weste"]},{"titel":"Rauch und Gasflaschen","punkte":["Löt- und Schweißrauch nicht einatmen. Absaugen oder gut lüften, besonders in engen Räumen.","Brenngas- und Sauerstoffflaschen gegen Umfallen sichern.","Rückschlagsicherung am Gerät nutzen. Nach der Arbeit Flaschenventile schließen."],"z":"warnung","i":["maske","gasflasche","wolke"]},{"titel":"Dachstuhl und Nachkontrolle","punkte":["Holz und Dämmung im Dachstuhl sind besonders gefährdet. Frag nach Verfahren ohne Flamme, etwa Pressen.","Nach der Arbeit kontrollierst du den Bereich. Halte die Brandwache nach Betriebsanweisung ein.","Schau auch an versteckten Stellen nach: Fugen, Hohlräume, Durchführungen.","Glimmt es irgendwo: löschen und wenn nötig 112 rufen."],"z":"brand","i":["uhr","auge","flamme"],"merke":"Fertig heißt nicht sicher: erst kontrollieren, dann gehen."},{"titel":"Das Wichtigste in Kürze","punkte":["Brennbares weg oder abdecken, vor dem ersten Funken.","Erlaubnisschein nach Betriebsanweisung, Feuerlöscher griffbereit.","Schutzausrüstung tragen, Rauch absaugen, Gasflaschen sichern.","Nach der Arbeit kontrollieren, denn Schwelbrände kommen später."],"z":"info","i":["flamme","loescher"]}],"fragen":[{"frage":"Warum kontrollierst du den Bereich nach dem Löten noch einmal?","antworten":["Glut oder Schwelbrand kann erst Stunden später ausbrechen","Damit die Lötstelle schön aussieht","Weil der Feuerlöscher sonst verfällt"],"richtig":0,"erklaerung":"Funken und heiße Teile können Holz oder Dämmung unbemerkt zum Schwelen bringen. Die Nachkontrolle findet das, bevor ein Feuer ausbricht."},{"frage":"Du sollst neben einem Dachstuhl aus Holz löten. Was gilt?","antworten":["Wie überall sonst, es geht ja nur kurz","Brennbares entfernen oder abdecken, Freigabe einholen und Feuerlöscher bereithalten","Nur einen Feuerlöscher im Auto lassen"],"richtig":1,"erklaerung":"Holz und Dämmung sind besonders brandgefährdet. Abdecken, Freigabe und griffbereiter Feuerlöscher gehören dazu."},{"frage":"Welche Schutzausrüstung passt zum Schweißen?","antworten":["Stoffhandschuhe und normale Sonnenbrille","Kunstfaserjacke, weil sie leicht ist","Schweißhandschuhe, passender Augenschutz und schwer entflammbare Kleidung"],"richtig":2,"erklaerung":"Funken und Hitze verbrennen Stoff und Haut. Passende Schutzausrüstung hält sie ab, Kunstfasern können schmelzen und an der Haut kleben."},{"frage":"Wie gehst du mit Brenngas- und Sauerstoffflaschen um?","antworten":["Liegend lagern, dann rollen sie nicht weg","Direkt neben der Arbeitsstelle, damit alles griffbereit ist","Ungesichert an die Wand lehnen","Gegen Umfallen sichern und nach der Arbeit die Ventile schließen"],"richtig":3,"erklaerung":"Umfallende Flaschen können Ventile beschädigen. Gesichert und mit geschlossenem Ventil sind sie sicher, auch im Funkenflug."}]},{"nr":10,"titel":"Heben und Tragen","beschreibung":"Wie du schwere Lasten rückenschonend und sicher hebst, trägst und ablegst.","dauer_min":6,"zielgruppen":["gewerblich"],"folien":[{"titel":"Dein Rücken hält viele Jahre","punkte":["Rückenprobleme sind eine Volkskrankheit, im Handwerk besonders häufig.","Oft ist es nicht ein einzelner Hebevorgang, sondern die Summe.","Beispiel: Du hebst allein einen Heizkörper aus dem Bulli und spürst den Rücken."],"z":"warnung","i":["heben","kiste"],"merke":"Ein Rücken, der einmal kaputt ist, bleibt es oft."},{"titel":"Erst die Last einschätzen","punkte":["Schau, wie schwer, sperrig oder unhandlich die Last ist.","Prüfe Gewicht auf Verpackung oder Typenschild.","Schwer oder sperrig: zu zweit oder mit Hebehilfe. Im Zweifel nicht allein."],"z":"info","i":["kiste","auge","gruppe"]},{"titel":"Richtig heben","punkte":["Beine beugen, Rücken gerade halten, Last nah am Körper.","Sicherer Stand, Füße etwa schulterbreit.","Nicht verdrehen: Dreh die Füße mit, nicht den Oberkörper.","Ruhig und gleichmäßig heben, nicht ruckartig."],"z":"gebot","i":["heben","person"],"merke":"Aus den Beinen heben, nicht aus dem Rücken."},{"titel":"Hilfsmittel nutzen","punkte":["Sackkarre, Rohrwagen und Hebegurt nehmen dir Arbeit ab.","Kran oder Ladebordwand nutzt du nur, wenn du eingewiesen bist.","Kein passendes Hilfsmittel da? Melde es. Improvisiere nicht auf Kosten des Rückens."],"z":"gebot","i":["auto","kiste","werkzeug"]},{"titel":"Gemeinsam tragen, Weg prüfen","punkte":["Sprecht euch ab: Wer führt? Zusammen anheben, gehen und absetzen.","Wärmepumpe, Kessel und Speicher trägst du nie allein.","Prüfe den Weg vorher: Treppen, Türen, Kabel, Nässe, Stolperstellen.","Sichtfeld muss frei sein."],"z":"gebot","i":["gruppe","stolpern"]},{"titel":"Ablegen und Fahrzeug","punkte":["Beim Absetzen gehören Finger und Füße nicht unter die Last.","Nicht mit Last von der Ladefläche springen. Nimm Ladebordwand, Stufen oder Hilfe.","Ladung im Fahrzeug sichern: Schweres nach unten, nichts darf verrutschen."],"z":"warnung","i":["auto","hand","schuh"],"merke":"Erst sicher abgesetzt, dann loslassen."},{"titel":"Das Wichtigste in Kürze","punkte":["Last einschätzen: schwer oder sperrig heißt nicht allein.","Beine beugen, Rücken gerade, Last nah am Körper, nicht verdrehen.","Hilfsmittel nutzen, Absprache beim Tragen, Weg prüfen.","Sicher absetzen und Ladung im Fahrzeug sichern."],"z":"info","i":["heben","gruppe"]}],"fragen":[{"frage":"Wie hebst du eine schwere Last richtig?","antworten":["Rücken rund, Beine gestreckt, mit Schwung","Beine beugen, Rücken gerade, Last nah am Körper","Last weit vom Körper halten, so behältst du den Überblick"],"richtig":1,"erklaerung":"Wenn du die Beine beugst und die Last nah am Körper hältst, arbeiten Beine statt Rücken. Das schont die Bandscheiben."},{"frage":"Du sollst eine Wärmepumpe oder einen Kessel transportieren. Was ist richtig?","antworten":["Nie allein: mit Kollegen oder Hilfsmitteln, Weg vorher prüfen","Allein, aber dafür langsam","Allein tragen und einen Rückengurt anlegen"],"richtig":0,"erklaerung":"Solche Geräte sind schwer, sperrig und kippen leicht. Allein droht Rücken- und Quetschgefahr, daher zu zweit oder mit Hilfsmittel."},{"frage":"Du musst mit einer schweren Last die Richtung wechseln. Was tust du?","antworten":["Den Rücken verdrehen, das geht am schnellsten","Die Last ruckartig herumschwingen","Mit den Füßen mitdrehen, Oberkörper nicht verdrehen"],"richtig":2,"erklaerung":"Verdrehen unter Last belastet die Wirbelsäule besonders stark. Wenn du mit den Füßen mitdrehst, bleibt der Rücken gerade."},{"frage":"Wie bringst du eine schwere Kiste sicher von der Ladefläche?","antworten":["Mit der Kiste von der Ladefläche springen","Die Kiste über die Kante kippen und fallen lassen","Rücken beugen und die Kiste ruckartig herunterziehen","Ladebordwand oder Stufen nutzen oder Kollegen um Hilfe bitten"],"richtig":3,"erklaerung":"Springen oder Fallenlassen führt zu Stürzen und Quetschungen. Mit Ladebordwand, Stufen oder Hilfe geht es sicher."}]},{"nr":11,"titel":"Gefahrstoffe und Kältemittel","beschreibung":"Wie du Reiniger, Kleber, Flussmittel und Kältemittel sicher benutzt, lagerst und im Notfall richtig reagierst.","dauer_min":7,"zielgruppen":["gewerblich"],"folien":[{"titel":"Gefahrstoffe sind überall","punkte":["Reiniger, Flussmittel, Kleber, Sprays und Heizungswasser-Zusätze sind Gefahrstoffe.","Beispiel: Ein Rest Rohrreiniger landet in einer Getränkeflasche. Später trinkt jemand daraus.","Viele Stoffe reizen Haut und Atemwege oder schaden erst nach Jahren."],"z":"warnung","i":["kolben","ausruf"],"merke":"Erst lesen, dann arbeiten."},{"titel":"Etikett und Datenblatt lesen","punkte":["Auf dem Etikett stehen Gefahrenpiktogramme mit rotem Rand und ein Signalwort.","Das Signalwort Gefahr warnt vor schwereren Risiken als das Signalwort Achtung.","Lies vor dem Start die Betriebsanweisung. Im Sicherheitsdatenblatt steht mehr, zum Beispiel zu Erster Hilfe.","Etikett fehlt oder ist unleserlich? Nicht benutzen und beim Vorgesetzten nachfragen."],"z":"info","i":["dokument","auge"]},{"titel":"Sicher damit umgehen","punkte":["Trage die Schutzausrüstung aus der Betriebsanweisung, meist Handschuhe und Schutzbrille.","Nur im Originalbehälter aufbewahren. Nie in Getränkeflaschen umfüllen.","Produkte nie mischen. Dabei können giftige Gase entstehen.","Sorge für gute Lüftung, besonders in Kellern und engen Räumen."],"z":"gebot","i":["handschuh","brille","maske"],"merke":"Nie mischen, nie umfüllen."},{"titel":"Lagern und entsorgen","punkte":["Lagere Gefahrstoffe verschlossen, im Originalbehälter und getrennt von Essen und Trinken.","Brennbares gehört weit weg von Funken, Flammen und heißen Teilen.","Reste und leere Behälter sind oft Sonderabfall. Nicht in Ausguss oder Restmüll.","Frag im Zweifel, wie du sie im Betrieb entsorgst."],"z":"info","i":["kiste","tropfen"]},{"titel":"Kältemittel: Gefahren und Sachkunde","punkte":["Kältemittel sind meist schwerer als Luft. In Kellern und Gruben droht Erstickungsgefahr.","Austretendes Kältemittel ist extrem kalt und kann Haut und Augen schwer verletzen.","Am Kältekreis von Klimaanlagen und Wärmepumpen arbeitest du nur mit Sachkundenachweis, dem Kälteschein.","Kältemittel nie in die Umwelt ablassen. Es wird fachgerecht abgesaugt und entsorgt."],"z":"warnung","i":["gasflasche","thermometer","wolke"],"merke":"Kältemittel: ohne Kälteschein nicht anfassen."},{"titel":"Erste Hilfe bei Unfällen","punkte":["Haut: Betroffene Kleidung ausziehen, mit viel Wasser spülen. Bei Erfrierung nicht reiben.","Augen: Sofort und gründlich mit Wasser spülen, dann zum Arzt.","Eingeatmet: Sofort an die frische Luft. Bei Atemnot oder Übelkeit 112 rufen.","Rufe im Zweifel 112 an und halte Etikett oder Sicherheitsdatenblatt bereit."],"z":"rettung","i":["kreuz","tropfen","telefon"]},{"titel":"Das Wichtigste in Kürze","punkte":["Lies Etikett und Betriebsanweisung, bevor du startest.","Nur Originalbehälter, nichts mischen, Schutzausrüstung tragen, gut lüften.","Kältemittel nur mit Kälteschein und nie in die Umwelt ablassen.","Bei Unfall: spülen, frische Luft, im Zweifel 112."],"z":"gebot","i":["dokument","handschuh"]}],"fragen":[{"frage":"Du sollst ein Reinigungsmittel benutzen, das du noch nicht kennst. Was machst du zuerst?","antworten":["Ich probiere es an einer kleinen Stelle aus.","Ich mische es mit meinem Standard-Reiniger für mehr Wirkung.","Ich lese Etikett und Betriebsanweisung.","Ich frage erst nach, wenn es anfängt zu brennen."],"richtig":2,"erklaerung":"Etikett und Betriebsanweisung sagen dir vorher, welche Gefahren es gibt und welche Schutzausrüstung du brauchst. Mischen kann giftige Gase erzeugen."},{"frage":"Du hast einen Rest Rohrreiniger übrig. Was ist richtig?","antworten":["In eine leere Getränkeflasche füllen, dann verschüttet nichts.","Im Originalbehälter verschlossen lagern, getrennt von Essen und Trinken.","In den Ausguss kippen, damit er weg ist.","Im Fahrzeug offen stehen lassen, bis er gebraucht wird."],"richtig":1,"erklaerung":"Nur der Originalbehälter hat das richtige Etikett. Eine Getränkeflasche kann zu gefährlichen Verwechslungen führen, zum Beispiel wenn jemand daraus trinkt."},{"frage":"Was gilt für Arbeiten am Kältekreis einer Wärmepumpe?","antworten":["Das kann jeder machen, wenn es schnell gehen muss.","Ein bisschen Kältemittel ablassen ist im Freien in Ordnung.","Mit Schutzbrille darf jeder daran arbeiten.","Nur mit Sachkundenachweis, und Kältemittel wird nie in die Umwelt abgelassen."],"richtig":3,"erklaerung":"Für Arbeiten am Kältekreis brauchst du den Sachkundenachweis. Kältemittel schadet der Umwelt und wird deshalb abgesaugt und fachgerecht entsorgt."},{"frage":"Dir spritzt ein Reiniger ins Auge. Was tust du sofort?","antworten":["Sofort und gründlich mit Wasser spülen, dann zum Arzt.","Abwarten, ob es von selbst besser wird.","Das Auge kräftig reiben, damit es sauber wird.","Weiterarbeiten und am Abend Tropfen benutzen."],"richtig":0,"erklaerung":"Je schneller du das Auge spülst, desto geringer der Schaden. Reiben verschlimmert die Verletzung. Danach gehört das Auge in ärztliche Behandlung."}]},{"nr":12,"titel":"Staub, Asbest und Lärm","beschreibung":"Wie du dich auf der Baustelle vor Staub, Asbestfasern, Lärm und Vibrationen schützt, bevor Schäden entstehen.","dauer_min":7,"zielgruppen":["gewerblich"],"folien":[{"titel":"Unsichtbar und oft zu spät","punkte":["Staub, Asbestfasern und Lärm schaden oft erst nach Jahren.","Beispiel: Du stemmst einen Wanddurchbruch. Nach kurzer Zeit steht der Staub im ganzen Raum.","Schäden an Lunge und Gehör sind oft nicht mehr heilbar."],"z":"warnung","i":["staub","laerm"],"merke":"Schutz vorher, nicht erst wenn es weh tut."},{"titel":"Staub vermeiden und abhalten","punkte":["Beim Stemmen, Bohren und Schleifen entsteht gesundheitsschädlicher Staub.","Nutze die Absaugung am Gerät und einen geeigneten Sauger.","Arbeite nass, wenn es möglich ist. So wird der Staub gebunden.","Trage Atemschutz laut Betriebsanweisung und sorge für Lüftung."],"z":"gebot","i":["maske","staub"]},{"titel":"Asbest: Wo er stecken kann","punkte":["Asbest wurde bis zum Verbot in vielen Baustoffen verwendet.","Möglich in Eternit-Platten, Bodenbelägen, Klebern, Dichtungen und Nachtspeicheröfen.","Gefährlich sind eingeatmete Fasern. Sie können Jahre später schwere Krankheiten auslösen.","Besonders in Altbauten ist Vorsicht nötig."],"z":"warnung","i":["ausruf","staub"]},{"titel":"Verdacht auf Asbest: Stopp","punkte":["Arbeit sofort stoppen. Nicht weiterbohren, nicht weiterschneiden.","Bereich verlassen, Kollegen warnen und den Vorgesetzten informieren.","Nicht kehren, nicht saugen, nicht selbst aufräumen. Das wirbelt Fasern auf.","Arbeiten an Asbest machen nur Fachfirmen mit Sachkunde."],"z":"verbot","i":["hand","staub"],"merke":"Verdacht heißt Stopp. Erst klären, dann weiterarbeiten."},{"titel":"Lärm und Gehörschutz","punkte":["Gehörschäden durch Lärm sind unumkehrbar. Verlorenes Gehör kommt nicht zurück.","Trage Gehörschutz, wo ein Lärmbereich gekennzeichnet ist, zum Beispiel bei Trennschleifer oder Schlagbohrhammer.","Gehörschutz muss richtig sitzen und sauber sein, sonst schützt er kaum.","Pfeifen im Ohr nach der Arbeit ernst nehmen: melden und zum Arzt."],"z":"gebot","i":["ohr","laerm"]},{"titel":"Vibrationen und Pausen","punkte":["Schlag- und Meißelhämmer übertragen Vibrationen auf Hände und Arme.","Auf Dauer drohen Durchblutungs- und Nervenschäden. Kribbeln, taube oder weiße Finger meldest du.","Wechsle die Tätigkeit ab und mache regelmäßig Pausen.","Scharfes, gepflegtes Werkzeug belastet dich weniger."],"z":"warnung","i":["werkzeug","hand"]},{"titel":"Das Wichtigste in Kürze","punkte":["Staub vermeiden: absaugen, nass arbeiten, Atemschutz tragen.","Verdacht auf Asbest: Stopp, Bereich verlassen, Vorgesetzten informieren.","Im Lärmbereich immer Gehörschutz tragen. Gehörschäden bleiben.","Bei Vibrationen: Pausen machen, Kribbeln und taube Finger melden."],"z":"gebot","i":["ohr","maske"]}],"fragen":[{"frage":"Beim Aufstemmen einer alten Wand findest du eine graue, faserige Platte. Du vermutest Asbest. Was tust du?","antworten":["Ich arbeite mit Maske weiter, die Platte ist ja nur ein kleines Stück.","Ich stoppe, verlasse den Bereich und informiere den Vorgesetzten.","Ich kehre den Staub zusammen und werfe ihn in den Container.","Ich schleife die Platte glatt, damit sie nicht auffällt."],"richtig":1,"erklaerung":"Bei Verdacht heißt es Stopp. Jede weitere Arbeit, auch Kehren oder Saugen, setzt Fasern frei. Asbestarbeiten sind Sache von Fachfirmen mit Sachkunde."},{"frage":"Was hilft beim Bohren und Stemmen gegen gesundheitsschädlichen Staub?","antworten":["Kurz arbeiten, dann merkt man nichts.","Den Staub mit Druckluft wegblasen.","Fenster öffnen und sonst nichts weiter tun.","Absaugung am Gerät nutzen, nass arbeiten und Atemschutz tragen."],"richtig":3,"erklaerung":"Staub sollte gar nicht erst in die Luft kommen. Absaugen und Nassarbeiten binden ihn, der Atemschutz schützt zusätzlich. Wegblasen wirbelt ihn nur auf."},{"frage":"Was gilt für Gehörschäden durch Lärm?","antworten":["Sie sind unumkehrbar, deshalb Gehörschutz im Lärmbereich immer tragen.","Sie heilen nach ein paar ruhigen Tagen wieder aus.","Man gewöhnt sich an Lärm, dann schadet er nicht mehr.","Sie betreffen nur ältere Kollegen."],"richtig":0,"erklaerung":"Zerstörte Hörzellen wachsen nicht nach. Auch wenn du dich an den Lärm gewöhnt hast, schadet er weiter. Darum trägst du den Gehörschutz jedes Mal."},{"frage":"Nach der Arbeit mit dem Schlaghammer kribbeln deine Finger und werden taub. Was ist richtig?","antworten":["Das gehört zum Job, ich sage nichts.","Ich arbeite schneller, damit ich früher fertig bin.","Ich melde es, wechsle die Tätigkeit und lege Pausen ein.","Ich reibe die Hände warm und mache einfach weiter."],"richtig":2,"erklaerung":"Kribbeln und taube Finger können ein Warnzeichen für Vibrationsschäden sein. Frühes Melden, Tätigkeitswechsel und Pausen verhindern, dass es schlimmer wird."}]},{"nr":13,"titel":"Bildschirmarbeitsplatz und Ergonomie","beschreibung":"Wie du Monitor, Stuhl und Tisch richtig einstellst und Beschwerden an Nacken, Rücken und Augen vorbeugst.","dauer_min":6,"zielgruppen":["buero"],"folien":[{"titel":"Warum der Platz passen muss","punkte":["Langes Sitzen am Bildschirm belastet Nacken, Rücken und Augen.","Beispiel: Nach dem Angebotsschreiben brennen die Augen und der Nacken zieht. Oft hilft schon die Einstellung.","Kleine Änderungen am Platz helfen oft sofort."],"z":"info","i":["monitor","stuhl"],"merke":"Der Platz muss zu dir passen, nicht umgekehrt."},{"titel":"Monitor richtig einstellen","punkte":["Dein Blick geht leicht nach unten. Die Oberkante des Monitors liegt ungefähr auf Augenhöhe.","Sitze nicht im Gegenlicht. Das Fenster steht seitlich zum Bildschirm.","Der Monitor steht frontal vor dir, etwa eine Armlänge entfernt.","Stelle Helligkeit und Schriftgröße so ein, dass du ohne Anstrengung liest."],"z":"gebot","i":["monitor","auge"]},{"titel":"Stuhl und Sitzhaltung","punkte":["Stelle die Rückenlehne so ein, dass sie deinen Rücken stützt.","Deine Füße stehen flach auf dem Boden. Sonst frage nach einer Fußstütze.","Arme und Schultern bleiben entspannt.","Wechsle die Sitzhaltung oft, statt lange starr zu sitzen."],"z":"gebot","i":["stuhl","person"]},{"titel":"Tisch, Tastatur und Maus","punkte":["Die Tischhöhe passt, wenn deine Unterarme locker aufliegen und die Handgelenke gerade bleiben.","Tastatur und Maus liegen nah am Körper, nicht weit ausgestreckt.","Was du oft brauchst, zum Beispiel das Telefon, liegt in Reichweite.","Halte genug Platz frei, damit du dich bequem bewegen kannst."],"z":"gebot","i":["hand","monitor"]},{"titel":"Bewegung und Augenpausen","punkte":["Wechsle zwischen Sitzen und Stehen, wenn dein Tisch höhenverstellbar ist.","Steh regelmäßig auf: im Stehen telefonieren, Unterlagen selbst holen, Treppe nehmen.","Schau immer wieder kurz in die Ferne, zum Beispiel aus dem Fenster.","Mehrere kurze Pausen sind besser als eine lange."],"z":"gebot","i":["uhr","auge"],"merke":"Regelmäßig aufstehen und in die Ferne schauen."},{"titel":"Licht, Blendung und Kabel","punkte":["Vermeide Blendung und Spiegelungen. Nutze Jalousie oder Blendschutz und drehe den Bildschirm.","Das Licht soll hell genug sein, ohne dass sich eine Lampe im Monitor spiegelt.","Ordne Kabel und führe sie nicht quer durch den Weg. Es besteht Stolpergefahr.","Melde Schmerzen, Kopfweh oder Blendung dem Vorgesetzten oder der Fachkraft für Arbeitssicherheit."],"z":"warnung","i":["sonne","stolpern"]},{"titel":"Das Wichtigste in Kürze","punkte":["Monitor: Blick leicht nach unten, Fenster seitlich, kein Gegenlicht.","Stuhl und Tisch einstellen: Füße flach, Arme und Schultern entspannt.","Regelmäßig aufstehen und kurz in die Ferne schauen.","Beschwerden und Blendung melden, Kabel ordnen."],"z":"info","i":["monitor","stuhl","uhr"]}],"fragen":[{"frage":"Wie steht dein Monitor richtig?","antworten":["Direkt vor dem Fenster, damit er schön hell ist.","Frontal vor dir, Fenster seitlich, Oberkante ungefähr auf Augenhöhe.","So hoch, dass du nach oben schauen musst.","Ganz nah vor dem Gesicht, damit du gut liest."],"richtig":1,"erklaerung":"Der Blick geht leicht nach unten und das Licht kommt von der Seite. So vermeidest du Blendung, Spiegelungen und einen verspannten Nacken."},{"frage":"Was kannst du tun, damit die Augen bei der Bildschirmarbeit nicht ermüden?","antworten":["Die Helligkeit auf Maximum stellen.","Nur in der Mittagspause die Augen schließen.","Immer wieder kurz in die Ferne schauen.","Näher an den Bildschirm rücken."],"richtig":2,"erklaerung":"Der Blick in die Ferne entspannt die Augenmuskeln. Kurze Augenpausen zwischendurch sind besser als eine lange Pause am Ende."},{"frage":"Wie sitzt du richtig am Schreibtisch?","antworten":["Füße flach auf dem Boden, Rückenlehne stützt, Arme und Schultern entspannt.","Füße unter dem Stuhl verhakt und nach vorn gebeugt.","Beine übereinandergeschlagen, ohne die Lehne zu nutzen.","Möglichst starr sitzen, damit die Haltung gleich bleibt."],"richtig":0,"erklaerung":"Eine abgestützte, entspannte Haltung entlastet den Rücken. Wechsle sie aber öfter, denn starres Sitzen belastet auf Dauer trotzdem."},{"frage":"Du hast oft Kopfschmerzen und wirst am Bildschirm geblendet. Was machst du?","antworten":["Ich halte es aus, ist ja normal.","Ich schalte den Monitor so dunkel wie möglich.","Ich erzähle es nur den Kollegen in der Kaffeeküche.","Ich melde es, damit der Platz angepasst werden kann."],"richtig":3,"erklaerung":"Beschwerden und Blendung lassen sich oft mit einfachen Mitteln beheben, zum Beispiel mit Blendschutz oder einem anderen Stellplatz. Dafür muss der Betrieb aber davon wissen."}]},{"nr":14,"titel":"Elektrische Sicherheit im Büro","beschreibung":"Wie du Steckdosenleisten, Kabel und Elektrogeräte im Büro sicher nutzt und bei Wärme, Brandgeruch oder Feuer richtig handelst.","dauer_min":6,"zielgruppen":["buero"],"folien":[{"titel":"Strom im Büro: unterschätzt","punkte":["Defekte Kabel und überlastete Steckdosenleisten sind eine häufige Brandursache.","Beispiel: Die Leiste unter dem Schreibtisch ist warm und riecht komisch. Heizlüfter und Rechner hängen dran.","Mit wenigen Regeln lässt sich das gut vermeiden."],"z":"warnung","i":["blitz","stecker"],"merke":"Warm oder riecht es komisch? Ernst nehmen."},{"titel":"Steckdosenleisten und Kabel","punkte":["Stecke Steckdosenleisten nie hintereinander. Keine Reihenschaltung.","Überlaste die Leiste nicht. Heizlüfter und Wasserkocher gehören direkt in die Wandsteckdose.","Decke Leisten nicht ab und lege keine Papiere darauf.","Knicke oder quetsche Kabel nicht und klemme sie nicht in Türen ein."],"z":"verbot","i":["stecker","flamme"]},{"titel":"Defekt: Nicht selbst reparieren","punkte":["Kabel beschädigt, Stecker locker oder Gehäuse gerissen? Benutze das Gerät nicht mehr.","Ziehe den Stecker, kennzeichne das Gerät als defekt und melde es dem Vorgesetzten.","Öffne und repariere Geräte nie selbst. Das machen nur Elektrofachkräfte.","Stelle Getränke nicht neben Geräte, Tastatur oder Steckdosen."],"z":"verbot","i":["werkzeug","stecker"]},{"titel":"Küche, Heizlüfter, private Geräte","punkte":["Lass Wasserkocher, Kaffeemaschine und Heizlüfter nicht unbeaufsichtigt laufen.","Bringe private Geräte nur nach Absprache mit. Sie werden oft nicht geprüft.","Schalte am Feierabend Geräte aus. Nimm Kaffeemaschine und Heizlüfter vom Netz."],"z":"warnung","i":["thermometer","stecker","uhr"]},{"titel":"Wärme oder Brandgeruch","punkte":["Sind Netzteil, Stecker oder Leiste ungewöhnlich warm? Riecht es verschmort?","Ziehe den Stecker, wenn es gefahrlos geht. Bei Rauch halte Abstand.","Benutze das Gerät nicht weiter und melde es sofort dem Vorgesetzten."],"z":"warnung","i":["thermometer","ausruf","stecker"]},{"titel":"Wenn es brennt","punkte":["Alarmieren: Brandalarm auslösen und 112 anrufen.","In Sicherheit bringen: Menschen warnen, Fluchtwege nutzen.","Löschversuch nur bei kleinem Brand und ohne Gefahr mit passendem Feuerlöscher. Nie Wasser auf Elektrogeräte.","Deine Sicherheit geht vor. Mehr dazu in der Unterweisung Brandschutz."],"z":"brand","i":["flamme","loescher","telefon"],"merke":"Alarmieren, in Sicherheit bringen, dann löschen."},{"titel":"Das Wichtigste in Kürze","punkte":["Keine Leisten hintereinander, nichts überlasten, Kabel nicht knicken.","Defektes Gerät: Stecker ziehen, nicht mehr benutzen, melden.","Wärme oder Brandgeruch: Stecker ziehen, wenn möglich, und melden.","Feierabend: Geräte ausschalten. Brand: alarmieren, in Sicherheit bringen."],"z":"gebot","i":["stecker","haken"]}],"fragen":[{"frage":"Was gilt für Steckdosenleisten im Büro?","antworten":["Man darf beliebig viele hintereinanderstecken.","Sie werden nicht hintereinandergesteckt und nicht überlastet.","Sie dürfen abgedeckt werden, damit sie nicht stören.","Heizlüfter gehören an die Leiste mit den meisten Geräten."],"richtig":1,"erklaerung":"Hintereinandergesteckte oder überlastete Leisten können sich stark erhitzen und einen Brand auslösen. Große Verbraucher stecken direkt in die Wandsteckdose."},{"frage":"Dein Laptop-Netzteil ist sehr heiß und riecht verschmort. Was tust du?","antworten":["Ich arbeite weiter, das ist normal.","Ich gieße Wasser darüber.","Ich warte ab, ob es besser wird.","Ich ziehe den Stecker, wenn es gefahrlos geht, und melde es."],"richtig":3,"erklaerung":"Hitze und Brandgeruch sind ein Warnsignal. Das Gerät wird vom Netz genommen und gemeldet. Wasser auf Elektrogeräte ist gefährlich."},{"frage":"Ein Gerät im Büro brennt. Was ist richtig?","antworten":["Alarm auslösen, 112 anrufen, Menschen warnen. Löschen nur, wenn es gefahrlos geht.","Mit einem Eimer Wasser löschen.","Erst in Ruhe fotografieren, damit der Schaden dokumentiert ist.","Nichts sagen, damit niemand erschrickt."],"richtig":0,"erklaerung":"Zuerst alarmieren und Menschen in Sicherheit bringen. Ein Löschversuch ist nur bei kleinem Brand sinnvoll. Wasser auf elektrische Geräte ist gefährlich."},{"frage":"Ein Kollege bringt einen privaten Heizlüfter mit. Was gilt?","antworten":["Er kann ihn einfach anschließen.","Er hängt ihn an die Leiste mit vielen anderen Geräten.","Nur nach Absprache, und er darf nicht unbeaufsichtigt laufen.","Er lässt ihn über Nacht laufen, damit es morgens warm ist."],"richtig":2,"erklaerung":"Private Geräte sind oft nicht geprüft und Heizlüfter brauchen viel Strom. Sie sind nur nach Absprache erlaubt und dürfen nie unbeaufsichtigt laufen."}]},{"nr":15,"titel":"Datenschutz im Alltag","beschreibung":"Wie du mit Kunden- und Mitarbeiterdaten im Büroalltag richtig umgehst und was du bei einer Datenpanne tust.","dauer_min":7,"zielgruppen":["buero"],"folien":[{"titel":"Warum Datenschutz uns betrifft","punkte":["Im Büro arbeitest du jeden Tag mit Daten von Kunden und Kollegen.","Beispiel: Eine Mail mit Kundenadresse geht an den falschen Empfänger. Das ist schon eine Datenschutzpanne.","Datenschutz schützt Menschen. Behandle fremde Daten so, wie du deine eigenen behandelt haben willst."],"z":"info","i":["schloss","person"],"merke":"Fremde Daten wie die eigenen behandeln."},{"titel":"Was sind personenbezogene Daten?","punkte":["Alles, was sich auf eine Person bezieht: Name, Adresse, Telefonnummer, E-Mail.","Dazu zählen Kundendaten, Bankdaten und Mitarbeiterdaten, zum Beispiel Krankmeldungen.","Auch Fotos, auf denen Personen zu erkennen sind, gehören dazu.","Auftragsscheine und Rechnungen mit Namen und Adresse ebenfalls."],"z":"info","i":["person","dokument"]},{"titel":"Die Grundregeln in einfachen Worten","punkte":["Zweckbindung: Nutze Daten nur für den Zweck, für den wir sie bekommen haben.","Datensparsamkeit: Erfasse und behalte nur, was wir wirklich brauchen.","Vertraulichkeit: Nur wer die Daten für seine Arbeit braucht, darf sie sehen oder weitergeben."],"z":"info","i":["schloss","dokument"]},{"titel":"Am Arbeitsplatz","punkte":["Sperre den Bildschirm, wenn du den Platz verlässt, zum Beispiel mit Windows-Taste und L.","Clean Desk: Lass keine Unterlagen offen liegen, wenn du weggehst.","Papier mit personenbezogenen Daten gehört in den Aktenvernichter, nicht in den Papierkorb.","Achte darauf, dass Besucher keine Bildschirme oder Unterlagen einsehen können."],"z":"gebot","i":["schloss","monitor","dokument"],"merke":"Platz verlassen: sperren und wegräumen."},{"titel":"Daten sicher weitergeben","punkte":["Schicke Kundendaten nie über private Messenger oder an private E-Mail-Adressen.","Gib Daten nur an Berechtigte weiter, im Zweifel frage nach.","Mail an mehrere externe Empfänger: Adressen ins BCC, nicht ins CC. Sonst sehen alle die Adressen.","Prüfe vor dem Senden Empfänger und Anhang."],"z":"verbot","i":["mail","schloss"]},{"titel":"Fotos, Pannen und Anfragen","punkte":["Fotos von Kunden oder Baustellen nur mit klarem Zweck und Erlaubnis.","Panne passiert, zum Beispiel falscher Empfänger oder verlorener Stick? Sofort melden, nicht verheimlichen.","Fragt jemand, welche Daten wir über ihn haben? Leite die Anfrage sofort an die Verantwortlichen weiter."],"z":"warnung","i":["person","ausruf"],"merke":"Panne passiert? Sofort melden, das schützt alle."},{"titel":"Das Wichtigste in Kürze","punkte":["Daten nur für den Zweck nutzen, nur so viel wie nötig, nur für Berechtigte.","Platz verlassen: Bildschirm sperren, Unterlagen weg, Papier in den Aktenvernichter.","Externe Mails an mehrere: BCC. Keine Kundendaten in private Kanäle.","Panne oder Anfrage: sofort melden oder weiterleiten."],"z":"gebot","i":["schloss","haken"]}],"fragen":[{"frage":"Welche Angabe ist ein personenbezogenes Datum?","antworten":["Der Katalogpreis einer Standard-Umwälzpumpe.","Name und Adresse eines Kunden auf dem Auftragsschein.","Die Öffnungszeiten der Firma.","Die Typbezeichnung eines Heizkessels."],"richtig":1,"erklaerung":"Personenbezogen ist alles, was sich auf eine Person beziehen lässt, etwa Name und Adresse. Preise, Öffnungszeiten und Gerätetypen sind es nicht."},{"frage":"Du schickst eine Rundmail an viele Kunden außerhalb der Firma. Wohin kommen die Adressen?","antworten":["Alle ins BCC, damit niemand die anderen Adressen sieht.","Alle ins CC, das ist übersichtlicher.","Alle in den Betreff, dann sieht man sie gleich.","An meine private Adresse, dann schicke ich es von dort."],"richtig":0,"erklaerung":"Im CC sehen alle Empfänger die Adressen der anderen. Das ist eine Weitergabe von Daten an Unbefugte. Im BCC bleiben die Adressen verborgen."},{"frage":"Du gehst in die Mittagspause. Auf dem Tisch liegt ein Kundenauftrag, der Monitor ist offen. Was tust du?","antworten":["Nichts, es dauert ja nicht lange.","Ich schalte nur den Monitor aus und lasse die Unterlagen liegen.","Ich sperre den Bildschirm und räume die Unterlagen weg.","Ich bitte einen Kunden, kurz darauf aufzupassen."],"richtig":2,"erklaerung":"Wer vorbeikommt, könnte Kundendaten sehen. Bildschirm sperren und Unterlagen wegräumen sind schnell erledigt und verhindern das."},{"frage":"Du hast eine Mail mit Kundendaten an den falschen Empfänger geschickt. Was tust du?","antworten":["Nichts sagen und hoffen, dass es niemand merkt.","Bis Feierabend warten und dann entscheiden.","Den Empfänger selbst bitten, die Mail zu löschen, und dann Ruhe geben.","Sofort melden, damit der Betrieb reagieren kann."],"richtig":3,"erklaerung":"Eine falsch versandte Mail ist eine Datenschutzpanne. Sie muss schnell gemeldet werden, damit der Betrieb reagieren kann. Melden ist kein Vorwurf, Verschweigen macht es schlimmer."}]},{"nr":16,"titel":"IT-Sicherheit: Passwörter und Phishing","beschreibung":"Du lernst, wie du Passwörter richtig wählst, gefälschte Mails erkennst und im Verdachtsfall reagierst.","dauer_min":7,"zielgruppen":["buero"],"folien":[{"titel":"Auch kleine Betriebe sind Ziel","punkte":["Angreifer suchen nicht nur Konzerne. Auch Handwerksbetriebe werden gezielt angeschrieben.","Beispiel: Eine Mail vom angeblichen Lieferanten nennt plötzlich eine neue Bankverbindung. Die Rechnung geht an Betrüger.","Erpressungssoftware sperrt Angebote, Pläne und Rechnungen. Dann steht das Büro still.","Im Büro bist du die erste Verteidigungslinie."],"z":"warnung","i":["mail","ausruf"],"merke":"Ein kurzer Stopp vor dem Klick verhindert viel Ärger."},{"titel":"Passwörter: lang, eigen, geheim","punkte":["Nimm eine lange Passphrase, zum Beispiel mehrere zufällige Wörter hintereinander.","Für jeden Dienst ein eigenes Passwort. Ein Passwortmanager merkt sie sich für dich.","Gib dein Passwort nie weiter, auch nicht an Kollegen oder an die IT.","Schalte die Zwei-Faktor-Anmeldung ein, wo es möglich ist."],"z":"gebot","i":["schloss","person"],"merke":"Lang schlägt kompliziert. Und Passwörter teilt man nicht."},{"titel":"Phishing-Mails erkennen","punkte":["Die Mail kommt unerwartet? Sei erst mal misstrauisch.","Es wird Druck gemacht: sofort zahlen, Konto wird gesperrt, letzte Frist.","Schau dir die Absenderadresse genau an. Der angezeigte Name kann gefälscht sein.","Links nicht blind anklicken. Rechtschreibfehler und komische Anrede sind Warnzeichen."],"z":"warnung","i":["mail","auge"],"merke":"Unerwartet, eilig, seltsam: Dann erst prüfen, dann handeln."},{"titel":"Anhänge und Zahlungsaufforderungen","punkte":["Sei vorsichtig bei Anhängen wie zip oder exe und bei Office-Dateien, die Makros aktivieren wollen.","Neue oder geänderte Bankverbindung? Frag beim Lieferanten nach, mit einer Telefonnummer, die du schon kennst.","Auch bei einer ungewöhnlichen Zahlungsaufforderung vom angeblichen Chef: erst persönlich rückfragen.","Nutze nie die Telefonnummer aus der verdächtigen Mail."],"z":"warnung","i":["dokument","ausruf"],"merke":"Geld nur überweisen, wenn du die Änderung selbst bestätigt hast."},{"titel":"Verdacht oder Klick passiert?","punkte":["Bei Verdacht: nicht klicken, nicht antworten, nichts öffnen.","Melde die Mail an die IT oder an deinen Vorgesetzten.","Doch geklickt oder etwas eingegeben? Melde dich sofort. Schnelle Meldung begrenzt den Schaden.","Melden ist kein Fehler. Verstecken macht alles schlimmer."],"z":"gebot","i":["telefon","haken"],"merke":"Lieber einmal zu viel melden als einmal zu wenig."},{"titel":"Rechner, Sticks und Updates","punkte":["Sperre deinen Rechner, wenn du den Platz verlässt.","Stecke nie fremde USB-Sticks ein, auch keine gefundenen oder geschenkten.","Spiele Updates zeitnah ein. Schließe Programme nicht, nur weil dich das Update nervt.","Frag bei Unsicherheit lieber kurz bei der IT nach."],"z":"gebot","i":["monitor","schloss"],"merke":"Sperren kostet zwei Sekunden und schützt deine Daten."},{"titel":"Das Wichtigste in Kürze","punkte":["Lange Passphrase, für jeden Dienst ein eigenes Passwort, niemals weitergeben.","Unerwartet, eilig, seltsame Bankverbindung: erst prüfen, nachfragen, dann handeln.","Verdacht oder versehentlicher Klick: sofort melden.","Rechner sperren, keine fremden USB-Sticks, Updates einspielen."],"z":"info","i":["haken","schloss"]}],"fragen":[{"frage":"Was macht ein Passwort besonders sicher?","antworten":["Es ist kurz und enthält viele Sonderzeichen.","Es ist eine lange Passphrase aus mehreren zufälligen Wörtern.","Es besteht aus dem Namen der Familie und einer Jahreszahl.","Es ist bei allen Diensten gleich, damit man es nicht vergisst."],"richtig":1,"erklaerung":"Länge macht ein Passwort schwer zu knacken, und eine Passphrase merkt man sich leichter. Persönliche Namen kann man erraten, und ein gleiches Passwort öffnet bei einem Diebstahl alle Türen."},{"frage":"Ein Lieferant schreibt: Unsere Bankverbindung hat sich geändert, bitte ab sofort dorthin überweisen. Was tust du?","antworten":["Sofort umstellen, sonst gibt es Ärger mit dem Lieferanten.","Auf die Mail antworten und um Bestätigung bitten.","Beim Lieferanten unter einer bereits bekannten Telefonnummer nachfragen.","Die Rechnung liegen lassen und nichts unternehmen."],"richtig":2,"erklaerung":"Bei einer geänderten Bankverbindung prüfst du die Änderung auf einem zweiten Weg, mit einer Telefonnummer, die du schon kennst. Antwortest du auf die Mail, landet die Antwort womöglich wieder bei den Betrügern."},{"frage":"Du hast aus Versehen auf einen Link in einer verdächtigen Mail geklickt. Was ist jetzt richtig?","antworten":["Sofort der IT oder dem Vorgesetzten Bescheid geben.","Die Mail löschen und hoffen, dass nichts passiert ist.","Erst mal abwarten, ob am Rechner etwas Auffälliges passiert.","Den Kollegen davon erzählen, aber nicht dem Chef."],"richtig":0,"erklaerung":"Je schneller die IT Bescheid weiß, desto besser lässt sich der Schaden begrenzen. Abwarten oder Verstecken gibt Angreifern nur mehr Zeit."},{"frage":"Auf dem Parkplatz liegt ein USB-Stick. Was machst du damit?","antworten":["Ich stecke ihn kurz ein, um zu sehen, wem er gehört.","Ich prüfe ihn zu Hause an meinem privaten Rechner.","Ich lege ihn in den Schreibtisch, falls ihn jemand sucht.","Ich stecke ihn nirgends ein und gebe ihn an die IT oder den Vorgesetzten."],"richtig":3,"erklaerung":"Fremde Sticks können Schadsoftware enthalten, die sich beim Einstecken sofort startet. Deshalb nie einstecken, auch nicht privat, sondern abgeben."}]},{"nr":17,"titel":"Gesund bleiben im Büro","beschreibung":"Du bekommst einfache Tipps zu Bewegung, Sitzen, Augen, Pausen und zum Umgang mit Stress im Büroalltag.","dauer_min":6,"zielgruppen":["buero"],"folien":[{"titel":"Gesund im Büro: auch Arbeitsschutz","punkte":["Auch im Büro gibt es Belastungen, nur leiser als auf der Baustelle.","Beispiel: Acht Stunden am Rechner, Nacken verspannt, Augen brennen, Kopf voll.","Schon kleine Gewohnheiten im Alltag helfen dir, fit zu bleiben.","Es geht um allgemeine Tipps, nicht um Medizin."],"z":"info","i":["herz","stuhl"],"merke":"Kleine Gewohnheiten wirken mehr als gute Vorsätze."},{"titel":"Bewegung im Arbeitsalltag","punkte":["Steh regelmäßig auf und wechsle zwischen Sitzen und Stehen, wenn du kannst.","Kurz strecken, Schultern kreisen, Nacken lockern: das geht am Platz.","Nimm die Treppe statt des Aufzugs.","Telefoniere zwischendurch im Stehen oder Gehen."],"z":"gebot","i":["person","stuhl"],"merke":"Die beste Sitzhaltung ist die nächste."},{"titel":"Rücken und richtiges Sitzen","punkte":["Sitz tief im Stuhl und lehn dich an. Die Füße stehen flach auf dem Boden.","Stell Stuhl und Tisch passend zu dir ein, nicht umgekehrt.","Der Bildschirm steht mittig vor dir, der obere Rand etwa auf Augenhöhe.","Ändere deine Haltung immer wieder, auch im guten Stuhl."],"z":"gebot","i":["stuhl","monitor"],"merke":"Stell den Arbeitsplatz auf dich ein, nicht dich auf den Arbeitsplatz."},{"titel":"Augen, Trinken und frische Luft","punkte":["Schau zwischendurch in die Ferne und blinzle bewusst. Das entlastet die Augen.","Stell dir Wasser griffbereit hin und trink regelmäßig über den Tag.","Lüfte regelmäßig, damit du frische Luft im Raum hast.","Ein kurzer Gang vor die Tür tut auch dem Kopf gut."],"z":"info","i":["auge","tropfen","sonne"],"merke":"Blick in die Ferne, Glas Wasser, Fenster auf."},{"titel":"Pausen und Feierabend","punkte":["Pausen gehören zur Arbeit. Wer sie ausfallen lässt, wird nicht schneller.","Mach die Mittagspause weg vom Schreibtisch, am besten mit Bewegung an der Luft.","Kurze Pausen zwischendurch erholen mehr als stundenlang durcharbeiten.","Klär mit dem Chef, wann du erreichbar sein musst und wann nicht."],"z":"gebot","i":["uhr","haken"],"merke":"Pause ist kein Luxus, sondern Teil der Arbeit."},{"titel":"Stress und Konflikte früh ansprechen","punkte":["Warnzeichen können sein: ständig gehetzt, schlecht schlafen, gereizt, kaum noch konzentriert.","Sprich früh mit deinem Vorgesetzten. Warte nicht, bis nichts mehr geht.","Priorisiere: Was ist wirklich dringend, was kann warten? Sprich Überlastung offen an.","Konflikte im Team lieber früh ansprechen. Frag im Betrieb nach Ansprechpartnern und Hilfsangeboten."],"z":"warnung","i":["ausruf","gruppe"],"merke":"Wer früh redet, findet leichter eine Lösung."},{"titel":"Das Wichtigste in Kürze","punkte":["Steh regelmäßig auf, bewege dich und wechsle die Sitzhaltung.","Entlaste die Augen, trink genug und lüfte.","Nimm deine Pausen und mach pünktlich Feierabend.","Sprich früh an, wenn dir Stress oder ein Konflikt zu viel wird."],"z":"info","i":["herz","haken"]}],"fragen":[{"frage":"Was hilft gegen langes Sitzen am besten?","antworten":["Den Stuhl so fest einstellen, dass man sich nicht mehr bewegt.","Erst am Feierabend ausgiebig Sport machen.","Zwischendurch aufstehen, kurz bewegen und die Haltung wechseln.","Möglichst lange ohne Unterbrechung durcharbeiten."],"richtig":2,"erklaerung":"Regelmäßige kleine Bewegungspausen und wechselnde Haltungen entlasten Rücken und Nacken. Feierabend-Sport ersetzt sie nicht."},{"frage":"Was tut deinen Augen bei der Bildschirmarbeit gut?","antworten":["Zwischendurch in die Ferne schauen und bewusst blinzeln.","Die Helligkeit dauerhaft auf Maximum stellen.","Den Bildschirm direkt vors Fenster stellen."],"richtig":0,"erklaerung":"Beim Blick in die Ferne entspannen sich die Augen, und Blinzeln befeuchtet sie. Ein Bildschirm direkt vorm Fenster führt zu Blendung und Spiegelungen."},{"frage":"Du bist seit Wochen gereizt und kommst mit deinen Aufgaben nicht hinterher. Was ist sinnvoll?","antworten":["Durchbeißen, das geht von allein vorbei.","Früh mit dem Vorgesetzten sprechen und gemeinsam Aufgaben priorisieren.","Abends und am Wochenende zusätzlich E-Mails abarbeiten."],"richtig":1,"erklaerung":"Je früher du Überlastung ansprichst, desto eher lässt sich etwas ändern, zum Beispiel bei Prioritäten oder Aufgabenverteilung. Durchbeißen macht es meist nur schlimmer."},{"frage":"Was stimmt über Pausen?","antworten":["Pausen sind Zeitverschwendung, wenn viel zu tun ist.","Man macht Pause, wenn alles erledigt ist.","Wer durcharbeitet, bleibt den ganzen Tag gleich leistungsfähig.","Pausen gehören zur Arbeit. Die Mittagspause verbringst du am besten nicht am Schreibtisch."],"richtig":3,"erklaerung":"Pausen erholen dich und sind Teil eines gesunden Arbeitstags. Wer durcharbeitet, wird meist unkonzentrierter und macht mehr Fehler."}]},{"nr":18,"titel":"Baustellenbesuch für Büropersonal","beschreibung":"Du erfährst, wie du dich als Gast auf einer Baustelle sicher verhältst und was du dafür brauchst.","dauer_min":7,"zielgruppen":["buero"],"folien":[{"titel":"Auch als Gast bist du gefährdet","punkte":["Du willst nur kurz Unterlagen vorbeibringen. Trotzdem gelten dort Baustellenregeln.","Beispiel: Du gehst in Turnschuhen über den Hof und trittst auf ein Brett mit Nagel.","Auf Baustellen ändert sich die Lage täglich. Wer nicht ständig dort ist, sieht Gefahren später.","Deshalb gilt: erst anmelden, richtig ausrüsten, aufmerksam bleiben."],"z":"warnung","i":["helm","ausruf"],"merke":"Kurzer Besuch heißt nicht kurzes Risiko."},{"titel":"Anmelden und Notfall kennen","punkte":["Melde dich beim Bauleiter oder Polier an, bevor du die Baustelle betrittst.","Lass dir Regeln und Gefahren zeigen. Sag, wohin du willst.","Frag nach Sammelplatz und Fluchtweg. Den Notruf 112 solltest du parat haben.","Melde dich beim Verlassen wieder ab."],"z":"gebot","i":["person","ausgang","telefon"],"merke":"Wer angemeldet ist, wird im Notfall nicht vergessen."},{"titel":"Die richtige Ausrüstung","punkte":["Trage Sicherheitsschuhe, Warnweste und Helm, so wie es die Baustellenregeln verlangen.","Je nach Arbeiten kommen Handschuhe oder Schutzbrille dazu. Frag nach.","Sneaker, Sandalen und Schuhe mit Absatz sind auf der Baustelle tabu.","Halte eine Grundausrüstung im Auto oder im Büro bereit."],"z":"gebot","i":["helm","weste","schuh"],"merke":"Ohne Ausrüstung bleibst du draußen."},{"titel":"Wege, Absperrungen, Stolperstellen","punkte":["Geh nur auf gekennzeichneten Wegen. Absperrungen nie überschreiten oder verschieben.","Achte auf Kabel, Schläuche, Material am Boden und offene Öffnungen.","Hetz nicht und schau beim Gehen nicht aufs Handy.","Ist etwas unklar, frag lieber nach, statt abzukürzen."],"z":"warnung","i":["stolpern","zaun"],"merke":"Ein Blick nach unten spart dir den Sturz."},{"titel":"Tabuzonen und nichts anfassen","punkte":["Geh nie unter schwebende Lasten und nie in Bereiche mit Kranbetrieb.","Meide Bereiche, in denen über deinem Kopf gearbeitet wird.","Gerüste und Gräben nur mit Freigabe betreten.","Fass nichts an und bediene nichts: keine Maschinen, Geräte oder Schalter."],"z":"verbot","i":["heben","geruest","hand"],"merke":"Nichts anfassen, nirgendwo drunter stellen."},{"titel":"Fahrzeuge, Maschinen und Fotos","punkte":["Bei Fahrzeugen und Baumaschinen: Blickkontakt zum Fahrer suchen und Abstand halten.","Geh erst weiter, wenn der Fahrer dich sicher gesehen hat. Bleib aus dem toten Winkel.","Fotos auf der Baustelle nur mit Erlaubnis, und nicht von Personen oder Kundendaten.","Teile Baustellenfotos nicht in sozialen Netzwerken."],"z":"warnung","i":["auto","auge"],"merke":"Erst Blickkontakt, dann weitergehen."},{"titel":"Das Wichtigste in Kürze","punkte":["Anmelden, Sammelplatz kennen, beim Verlassen abmelden.","Sicherheitsschuhe, Warnweste, Helm: ohne Ausrüstung kein Zutritt.","Nur auf freigegebenen Wegen, nie unter Lasten, nichts anfassen.","Blickkontakt zu Fahrern, Fotos nur mit Erlaubnis."],"z":"gebot","i":["helm","haken"]}],"fragen":[{"frage":"Du kommst auf die Baustelle, um Unterlagen zu bringen. Was ist der erste Schritt?","antworten":["Ich suche den Kollegen und gehe direkt zu ihm.","Ich melde mich beim Bauleiter oder Polier an.","Ich schaue mir erst in Ruhe alles an.","Ich bleibe an der Zufahrt und rufe jemanden an."],"richtig":1,"erklaerung":"Erst die Anmeldung, denn dort erfährst du die aktuellen Gefahren und Regeln. Außerdem weiß man dann, dass du auf der Baustelle bist."},{"frage":"Welche Schuhe sind für den Baustellenbesuch richtig?","antworten":["Sneaker, denn sie sind bequem und rutschfest.","Sandalen, weil es warm ist.","Schuhe mit Absatz, weil du gleich danach zum Kunden gehst.","Sicherheitsschuhe."],"richtig":3,"erklaerung":"Sicherheitsschuhe schützen vor Nägeln am Boden und vor herabfallenden Teilen. Sneaker, Sandalen oder Absätze bieten diesen Schutz nicht."},{"frage":"Ein Kran schwenkt eine Palette über den Weg, den du gehen willst. Was tust du?","antworten":["Ich laufe schnell darunter durch.","Ich gehe unter der Last durch, aber langsam.","Ich warte oder nehme einen anderen Weg, nie unter schwebenden Lasten.","Ich rufe dem Kranfahrer zu, dass er kurz anhalten soll."],"richtig":2,"erklaerung":"Unter schwebenden Lasten kann es lebensgefährlich werden, wenn etwas herabfällt. Bleib draußen und frag den Bauleiter nach einem sicheren Weg."},{"frage":"Ein Bagger fährt rückwärts in deine Richtung. Wie verhältst du dich richtig?","antworten":["Ich halte Abstand, suche Blickkontakt und gehe erst weiter, wenn der Fahrer mich gesehen hat.","Ich gehe zügig hinter dem Bagger vorbei, der Fahrer sieht mich schon.","Ich bleibe direkt hinter dem Bagger stehen und winke.","Ich warte im toten Winkel, weil dort nichts passiert."],"richtig":0,"erklaerung":"Fahrer von Baumaschinen sehen nicht alles, besonders nicht hinter oder neben dem Fahrzeug. Nur mit Blickkontakt weißt du, dass sie dich wahrgenommen haben."}]},{"nr":19,"titel":"Arbeitsschutz im Betrieb: Wer ist wer?","beschreibung":"Du lernst, wer im Betrieb für Arbeitsschutz zuständig ist, welche Pflichten es gibt und was du bei Unfällen tust.","dauer_min":7,"zielgruppen":["buero"],"folien":[{"titel":"Arbeitsschutz geht alle an","punkte":["Beispiel: Eine Stufe im Flur wackelt. Jeder denkt, jemand anderes meldet das schon.","Arbeitsschutz klappt nur, wenn Betrieb und Beschäftigte zusammenarbeiten.","Hier siehst du, wer im Betrieb wofür zuständig ist.","So weißt du, wen du ansprichst und was du selbst tun kannst."],"z":"info","i":["gruppe","herz"],"merke":"Sicherheit entsteht, wenn jeder seinen Teil übernimmt."},{"titel":"Pflichten: Betrieb und Beschäftigte","punkte":["Nach dem Arbeitsschutzgesetz sorgt der Arbeitgeber für sichere Arbeit und Schutzmaßnahmen.","Er unterweist dich, mindestens einmal jährlich, und dokumentiert das. Genau das machst du hier.","Du machst mit: Schutzmaßnahmen nutzen, Anweisungen beachten.","Du meldest Gefahren und Mängel, die dir auffallen."],"z":"info","i":["dokument","gruppe"],"merke":"Der Betrieb sorgt vor, du machst mit und meldest."},{"titel":"Deine Ansprechpartner im Betrieb","punkte":["Fachkraft für Arbeitssicherheit und Betriebsarzt beraten den Betrieb zu Sicherheit und Gesundheit.","Ersthelfer und Brandschutzhelfer sind ausgebildet und helfen im Notfall.","Sicherheitsbeauftragte sind Kollegen, die im Alltag auf Gefahren achten.","Wer das ist, hängt im Betrieb aus. Kennst du sie nicht, frag nach."],"z":"info","i":["person","kreuz"],"merke":"Kenne deine Ansprechpartner, bevor du sie brauchst."},{"titel":"Gefährdungsbeurteilung: Was ist das?","punkte":["Der Betrieb prüft für jeden Arbeitsplatz: Wo kann etwas passieren?","Daraus entstehen Maßnahmen, die Unfälle und Belastungen verringern sollen.","Das gilt auch fürs Büro, nicht nur für Baustelle und Werkstatt.","Du kennst deinen Arbeitsplatz am besten. Gib Hinweise, wenn sich etwas ändert."],"z":"info","i":["dokument","auge"],"merke":"Deine Hinweise machen die Beurteilung besser."},{"titel":"Unfälle und Beinahe-Unfälle melden","punkte":["Melde jeden Unfall, auch kleine Verletzungen. Sie kommen ins Verbandbuch.","Der Betrieb kümmert sich um weitere Meldungen, zum Beispiel an die Berufsgenossenschaft.","Melde auch Beinahe-Unfälle. Sie zeigen Schwachstellen, bevor jemand verletzt wird.","Sag es deinem Vorgesetzten. Das ist kein Petzen, sondern Vorsorge."],"z":"gebot","i":["dokument","ausruf"],"merke":"Melden verhindert den nächsten Unfall."},{"titel":"Versichert, geschützt, vorgesorgt","punkte":["Die gesetzliche Unfallversicherung, die Berufsgenossenschaft, schützt bei Arbeits- und Wegeunfällen.","Bei unmittelbarer, erheblicher Gefahr darfst du den Gefahrenbereich verlassen. Melde das sofort.","Nimm Termine der arbeitsmedizinischen Vorsorge wahr. Sie schützt deine Gesundheit.","Bei Unsicherheit frag deinen Vorgesetzten oder die Fachkraft für Arbeitssicherheit."],"z":"rettung","i":["kreuz","herz"],"merke":"Bei akuter Gefahr zuerst in Sicherheit, dann melden."},{"titel":"Das Wichtigste in Kürze","punkte":["Der Betrieb sorgt für Schutz und unterweist dich jährlich. Du machst mit.","Kenne deine Ansprechpartner: Ersthelfer, Fachkraft, Betriebsarzt, Sicherheitsbeauftragte.","Melde Unfälle, Beinahe-Unfälle und Gefahren.","Bei unmittelbarer, erheblicher Gefahr: in Sicherheit bringen und melden."],"z":"info","i":["haken","gruppe"]}],"fragen":[{"frage":"Wer ist im Betrieb für Arbeitsschutz zuständig?","antworten":["Nur die Fachkraft für Arbeitssicherheit.","Nur der Chef, die Mitarbeiter müssen nichts tun.","Der Betrieb sorgt für Schutzmaßnahmen, und du machst mit und meldest Gefahren.","Jeder Mitarbeiter allein für sich."],"richtig":2,"erklaerung":"Arbeitsschutz ist Teamarbeit: Der Arbeitgeber muss Schutzmaßnahmen schaffen, und du wendest sie an und meldest Gefahren, die dir auffallen."},{"frage":"Du bist im Flur fast über ein Kabel gestolpert, aber nichts ist passiert. Was tust du?","antworten":["Nichts, es ist ja nichts passiert.","Ich melde es, denn Beinahe-Unfälle zeigen Gefahren, bevor jemand verletzt wird.","Ich warte, bis es jemand anderem passiert, und melde es dann."],"richtig":1,"erklaerung":"Beinahe-Unfälle sind Warnsignale. Wird die Stelle behoben, bevor jemand stürzt, verhindert deine Meldung einen echten Unfall."},{"frage":"Was ist eine Gefährdungsbeurteilung?","antworten":["Der Betrieb prüft, wo an Arbeitsplätzen Gefahren entstehen können, und legt Maßnahmen fest.","Eine Bewertung deiner Leistung durch den Vorgesetzten.","Eine Liste aller Unfälle des letzten Jahres."],"richtig":0,"erklaerung":"Die Gefährdungsbeurteilung schaut nach Risiken am Arbeitsplatz, nicht auf einzelne Personen. Deine Hinweise helfen dabei, sie zu verbessern."},{"frage":"Was gilt bei der gesetzlichen Unfallversicherung (Berufsgenossenschaft)?","antworten":["Sie schützt nur im Betrieb, nicht auf dem Weg.","Sie schützt nur bei Arbeiten auf der Baustelle.","Sie schützt nur, wenn ein Unfall vorher gemeldet wurde.","Sie schützt dich bei Arbeitsunfällen und auch auf dem Arbeitsweg."],"richtig":3,"erklaerung":"Die gesetzliche Unfallversicherung deckt Arbeits- und Wegeunfälle ab, im Büro genauso wie auf der Baustelle. Damit der Betrieb alles Nötige veranlassen kann, meldest du Unfälle zeitnah."}]},{"nr":20,"titel":"Mobiles Arbeiten und Homeoffice","beschreibung":"Du erfährst, worauf du zu Hause und unterwegs bei Arbeitsplatz, Datenschutz und Sicherheit achten musst.","dauer_min":7,"zielgruppen":["buero"],"folien":[{"titel":"Regeln gelten auch unterwegs","punkte":["Auch zu Hause und unterwegs gelten Arbeitsschutz und Datenschutz.","Beispiel: Im Zug telefonierst du über Kundendaten. Dein Sitznachbar hört mit.","Beispiel: Am Küchentisch liegt ein Kundenangebot offen, und Besuch kommt vorbei.","Mit ein paar Gewohnheiten bleibst du sicher und gesund."],"z":"info","i":["monitor","schloss"],"merke":"Der Arbeitsort ändert sich, die Regeln bleiben."},{"titel":"Den Arbeitsplatz zu Hause einrichten","punkte":["Arbeite am Tisch mit passendem Stuhl, nicht auf dem Sofa oder im Bett.","Stell den Bildschirm etwa auf Augenhöhe. Bei einem Laptop hilft eine externe Tastatur.","Sorge für gutes Licht ohne Blendung oder Spiegelung auf dem Bildschirm.","Mach Pausen und bewege dich wie im Büro."],"z":"gebot","i":["stuhl","monitor","sonne"],"merke":"Sofa und Küchenhocker sind keine Arbeitsplätze."},{"titel":"Ordnung, Kabel und Elektrik","punkte":["Verlege Kabel so, dass niemand darüber stolpert.","Nutze keine Netzteile oder Verlängerungen mit sichtbaren Schäden. Tausche sie aus.","Überlaste Steckdosen und Mehrfachstecker nicht.","Decke Ladegeräte nicht mit Kissen oder Decken zu."],"z":"warnung","i":["stolpern","stecker","blitz"],"merke":"Beschädigtes Kabel: nicht mehr benutzen."},{"titel":"Datenschutz zu Hause","punkte":["Stell den Bildschirm so, dass Familie und Besucher nichts mitlesen können.","Lass niemanden dein Firmengerät benutzen, auch nicht kurz.","Sperre den Bildschirm, sobald du den Platz verlässt. Schließe Unterlagen weg.","Wirf Firmenunterlagen nie in den Hausmüll. Entsorge sie datenschutzgerecht im Betrieb."],"z":"gebot","i":["schloss","dokument","monitor"],"merke":"Firmendaten gehören nicht in fremde Hände oder in den Hausmüll."},{"titel":"WLAN, VPN und unterwegs","punkte":["Nutze zu Hause ein WLAN mit eigenem Passwort. Halte den Router aktuell.","Greife auf Firmendaten nur über den VPN-Zugang des Betriebs zu.","In öffentlichen WLANs, etwa im Café oder in der Bahn, arbeitest du nur mit VPN.","Nutze einen Sichtschutz und lass den Laptop nie unbeaufsichtigt, auch nicht kurz im Auto."],"z":"warnung","i":["wolke","schloss","person"],"merke":"Öffentliches WLAN: nur mit VPN."},{"titel":"Verlust und Unfall melden","punkte":["Gerät verloren oder gestohlen? Melde es sofort, auch bei bloßem Verdacht.","Halte Geräte gesperrt und verschlüsselt, damit ein Verlust weniger Schaden anrichtet.","Passiert im Homeoffice bei dienstlicher Arbeit ein Unfall, melde ihn wie im Betrieb.","Ob Versicherungsschutz besteht, hängt vom Einzelfall ab. Melde trotzdem, den Rest klärt der Betrieb."],"z":"gebot","i":["telefon","ausruf"],"merke":"Lieber gleich melden, als später erklären."},{"titel":"Das Wichtigste in Kürze","punkte":["Fester Arbeitsplatz mit Tisch, Stuhl und gutem Licht. Pausen nicht vergessen.","Kabel und Geräte in Ordnung halten, Beschädigtes aussortieren.","Bildschirm sperren, Firmengerät nicht teilen, Unterlagen sicher entsorgen.","Öffentliches WLAN nur mit VPN. Verlust oder Unfall sofort melden."],"z":"info","i":["haken","schloss"]}],"fragen":[{"frage":"Wo arbeitest du zu Hause am besten?","antworten":["Auf dem Sofa, damit es bequem ist.","An einem Tisch mit passendem Stuhl und Bildschirm auf Augenhöhe.","Im Bett, damit ich morgens keine Zeit verliere."],"richtig":1,"erklaerung":"Ein fester Arbeitsplatz mit Tisch und Stuhl schont Rücken, Nacken und Augen. Auf Sofa oder Bett sitzt du meist verdreht und mit gebe async function fileUrl(path){
  const c=PH.get(path);if(c&&c.exp>Date.now())return c.url;
  const tok=await ensureToken();
  const enc=path.split('/').map(encodeURIComponent).join('/');
  const r=await fetch(`${SB}/storage/v1/object/sign/${BUCKET}/${enc}`,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+tok},body:JSON.stringify({expiresIn:3600})});

  PH.set(path,{url,exp:Date.now()+3300e3});return url;
}

async function compressImage(file,max=1600,q=.82){
  let src,w,h;
  try{src=await createImageBitmap(file,{imageOrientation:'from-image'});w=src.width;h=src.height}
  catch(e){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
  const k=Math.min(1,max/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return await new Promise(res=>c.toBlob(res,'image/jpeg',q));
}

    inp.click();
  });
}

      const f=inp.files&&inp.files[0];if(!f)return res(null);

    };

  });
}

function signSVG(z,icon,label){

const signsHTML=(z,icons)=>`<div class="signs n${Math.min(3,(icons||[]).length||1)}">${(icons&&icons.length?icons:['ausruf']).slice(0,3).map(i=>signSVG(z,i)).join('')}</div>`;
/* =====================================================================
   Unterweisungen – Daten, Rahmen, Router, Start, Mehr
   ===================================================================== */
const view=()=>$('#view');
let TOKEN=0;
const GRP={buero:'Büro',gewerblich:'Gewerblich'};
const GRPIC={buero:'monitor',gewerblich:'wrench'};
const PASS=75;
const thisYear=()=>+berlinToday().slice(0,4);
const byNr=(a,b)=>(a.nr-b.nr)||String(a.titel).localeCompare(String(b.titel),'de');
const NWCOLS='id,benutzer_id,benutzer_name,gruppe,thema_id,thema_nr,thema_titel,thema_version,jahr,datum,richtig,gesamt,prozent,created_at';
const themaById=id=>S.themen.find(t=>t.id===id);
/** Pflicht-Unterweisungen einer Gruppe: aktiv, für die Gruppe freigegeben, mit Prüfungsfragen */
const themaReq=g=>S.themen.filter(t=>t.aktiv&&(t.zielgruppen||[]).includes(g)&&(+t.fragen_anzahl||0)>0).sort(byNr);
const myNw=y=>S.nw.filter(n=>n.jahr===y);
const nwOf=(list,tid)=>list.find(n=>n.thema_id===tid);
const firstName=n=>String(n||'').trim().split(/\s+/)[0]||'';

async function loadAll(){
  const cols='id,nr,titel,beschreibung,dauer_min,zielgruppen,aktiv,version,fragen_anzahl'+(isAdmin()?',folien':'');
  const [g,t,nw,us]=await Promise.all([
    rpc('unt_meine_gruppe'),
    api('GET','unt_themen',null,`?select=${cols}&order=nr.asc,titel.asc`),
    api('GET','unt_nachweise',null,`?benutzer_id=eq.${S.me.id}&select=${NWCOLS}&order=datum.desc,created_at.desc&limit=500`),
    isAdmin()?rpc('unt_benutzerliste'):Promise.resolve([])
  ]);
  S.gruppe=g||'gewerblich';S.themen=t||[];S.nw=nw||[];S.users=us||[];S.loadedAt=Date.now();
}
async function refreshNw(){S.nw=await api('GET','unt_nachweise',null,`?benutzer_id=eq.${S.me.id}&select=${NWCOLS}&order=datum.desc,created_at.desc&limit=500`)}
async function refreshThemen(){
  const cols='id,nr,titel,beschreibung,dauer_min,zielgruppen,aktiv,version,fragen_anzahl'+(isAdmin()?',folien':'');
  S.themen=await api('GET','unt_themen',null,`?select=${cols}&order=nr.asc,titel.asc`);
}

/* ---------- Kleine Bausteine ---------- */
function ringHTML(pct,big,small,cls=''){
  const R=42,C=2*Math.PI*R,off=C*(1-Math.max(0,Math.min(100,pct))/100);
  return`<div class="ring ${cls} ${pct>=100?'ok':''}"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="${R}"/><circle class="fg" cx="50" cy="50" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg><div class="mid"><div><b>${big}</b>${small?`<small>${small}</small>`:''}</div></div></div>`;
}
const grpChip=g=>`<span class="grpchip">${ic(GRPIC[g]||'user')}${esc(GRP[g]||g)}</span>`;
const zgChips=zg=>(zg||[]).map(g=>grpChip(g)).join(' ');

/* ---------- Rahmen ---------- */
function renderShell(){
  const ini=(S.me.name||'?').trim().charAt(0).toUpperCase();
  const tabs=[['start','home','Start','#/'],['nachweise','clip','Nachweise','#/nachweise']];
  if(isAdmin())tabs.push(['team','users','Team','#/team']);
  tabs.push(['mehr','more','Mehr','#/mehr']);
  const tb=$('#tabbar');tb.style.gridTemplateColumns=`repeat(${tabs.length},1fr)`;
  tb.innerHTML=tabs.map(([k,i,l,h])=>`<a class="tab" data-nav="${k}" href="${h}">${ic(i)}<span>${l}</span></a>`).join('');
  $('#rail').innerHTML=
    `<div class="rail-brand"><div class="rail-logo">${ic('book','lg')}<img src="icon.png?v=4" alt="" onload="this.previousElementSibling.remove()" onerror="this.remove()"></div><div><b>Unterweisungen</b><small>Heise Haustechnik</small></div></div>`+
    `<nav class="rail-nav">`+
      `<a class="rail-item" data-nav="start" href="#/">${ic('home')} Start</a>`+
      `<a class="rail-item" data-nav="nachweise" href="#/nachweise">${ic('clip')} Meine Nachweise</a>`+
      (isAdmin()?`<a class="rail-item" data-nav="team" href="#/team">${ic('users')} Team-Stand</a><a class="rail-item" data-nav="inhalte" href="#/inhalte">${ic('sliders')} Inhalte verwalten</a>`:'')+
    `</nav>`+
    `<div class="rail-foot">`+
      `<a class="rail-item" href="${PORTAL}#/nachrichten">${ic('bell')} Nachrichten<span class="nzb" data-nz hidden></span></a>`+
      `<a class="rail-item" href="${PORTAL}">${ic('apps')} My Heise Startseite</a>`+
      `<div class="userbox"><div class="avatar">${esc(ini)}</div><div style="min-width:0;flex:1"><b style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(S.me.name)}</b><small>${esc(isAdmin()?'Admin':GRP[S.gruppe]||'')}</small></div><button class="iconbtn flat" data-act="logout" aria-label="Abmelden" title="Abmelden">${ic('logout')}</button></div>`+
    `</div>`;
}
function setNav(seg){
  const wide=window.matchMedia('(min-width:960px)').matches;
  let key=seg||'start';
  if(key==='inhalte'&&!wide)key='mehr';
  $$('[data-nav]').forEach(a=>{a.classList.toggle('on',a.dataset.nav===key);a.setAttribute('aria-current',a.dataset.nav===key?'page':'false')});
}
function paint(html){
  const v=view();v.style.animation='none';v.innerHTML=html;void v.offsetWidth;v.style.animation='';
  hydratePhotos(v);paintNz();
}

/* ---------- Router ---------- */
function route(){
  const h=location.hash||'#/';
  const parts=h.startsWith('#/')?h.slice(2).split('/'):[''];let seg=parts[0]||'start';
  TOKEN++;const token=TOKEN;
  window.scrollTo(0,0);
  if(!isAdmin()&&['team','inhalte'].includes(seg))seg='start';
  setNav(seg);
  const V={start:viewStart,nachweise:viewNachweise,team:()=>parts[1]?viewPerson(parts[1],token):viewTeam(token),inhalte:()=>parts[1]?viewEditor(parts[1],token):viewInhalte(),mehr:viewMehr};
  (V[seg]||viewStart)();
}
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState==='visible'&&S.me&&Date.now()-S.loadedAt>60000){
    try{await loadAll();renderShell();if(!SHEETS.length&&!$('#wizLayer').firstChild&&!/^#\/(inhalte\/)/.test(location.hash))route()}catch(e){}
  }
});

/* ---------- Start ---------- */
function topicRow(t,i,nw){
  const done=!!nw;
  return`<button class="lcard ${done?'done':''}" data-act="topic" data-id="${t.id}" style="width:100%;text-align:left">
    <div class="tnum tone-${done?'ok':'violet'}">${done?ic('check'):i+1}</div>
    <div class="lcard-main"><div class="lcard-top"><b class="tt">${esc(t.titel)}</b></div>
      <div class="lcard-tags">${done?chip('ok','Erledigt '+fmtD(nw.datum).slice(0,6)):chip('amber','Offen')}<span class="chip tone-gray">${ic('clock')} ca. ${t.dauer_min||6} Min.</span></div></div>${ic('chev','chev')}</button>`;
}
function viewStart(){
  const y=thisYear(),req=themaReq(S.gruppe),mine=myNw(y);
  const done=req.filter(t=>nwOf(mine,t.id)),open=req.filter(t=>!nwOf(mine,t.id));
  const pct=req.length?Math.round(done.length/req.length*100):0,next=open[0];
  const left=dayDiff(`${y}-12-31`),first=firstName(S.me.name);
  const allDone=req.length>0&&!open.length;
  let body='';
  if(!req.length){
    body=isAdmin()
      ?`<div class="seedcard"><h3>Noch keine Unterweisungen freigegeben</h3><p>${S.themen.length?'Es gibt Themen, aber noch keine mit Prüfungsfragen für deinen Bereich. Prüfe die Inhalte.':'Lege Inhalte selbst an oder lade die 20 Beispiel-Unterweisungen (Büro und Gewerblich), um die App zu zeigen.'}</p><a class="btn btn-primary" href="#/inhalte">${ic('sliders')} Zu den Inhalten</a></div>`
      :`<div class="card">${emptyState('book','Noch keine Unterweisungen','Sobald die Unterweisungen für dieses Jahr freigegeben sind, findest du sie hier.')}</div>`;
  }else{
    body=`<div class="ringbox">${ringHTML(pct,`${done.length}/${req.length}`,'erledigt')}
      <div class="txt"><b>${allDone?'Alles erledigt – danke!':`${open.length} ${open.length===1?'Unterweisung':'Unterweisungen'} offen`}</b>
      <div class="muted">${allDone?`Deine Jahresunterweisung ${y} ist komplett.`:`Frist: 31.12.${y}${left>=0?` (noch ${left} ${left===1?'Tag':'Tage'})`:''}`}</div>
      <div style="margin-top:8px">${grpChip(S.gruppe)}</div></div></div>
      ${!allDone&&left<=60?callout('amber','clock','Frist im Blick',`Bis Jahresende sind noch ${open.length} ${open.length===1?'Unterweisung':'Unterweisungen'} zu erledigen. Jede dauert etwa ${next.dauer_min||6} Minuten.`):''}
      ${next?`<button class="hero-go" data-act="startThema" data-id="${next.id}"><span class="ico">${ic('play','lg')}</span><span><small>${done.length?'Weiter mit':'Jetzt starten'}</small><b>${esc(next.titel)}</b></span>${ic('chev','chev')}</button>`:`<button class="btn btn-soft btn-block" data-act="jahresPdfMe" style="margin-bottom:6px">${ic('doc')} Jahresnachweis ${y} als PDF</button>`}
      <div class="sec"><h2>Unterweisungen ${y}</h2></div>
      <div class="list tlist">${req.map((t,i)=>topicRow(t,i,nwOf(mine,t.id))).join('')}</div>`;
  }
  paint(`
  <div class="pills"><a class="hubpill" href="${PORTAL}">${ic('apps','sm')} My Heise</a><a class="hubpill" href="${PORTAL}#/nachrichten">${ic('bell','sm')} Nachrichten<span class="nzb" data-nz hidden></span></a></div>
  <div class="head"><div><div class="eyebrow">Sicherheitsunterweisung ${y}</div><h1>${first?esc(first):'Unterweisungen'}</h1></div><div class="avatar" style="width:46px;height:46px;font-size:18px">${esc((S.me.name||'?').charAt(0).toUpperCase())}</div></div>
  ${body}
  ${isAdmin()?`<div id="teamCard"></div>`:''}`);
  if(isAdmin()&&req.length)teamCard(TOKEN);
}
async function teamCard(tk){
  try{
    await loadTeam(thisYear());
    if(tk!==TOKEN||!$('#teamCard'))return;
    const st=teamStats(S.team);
    $('#teamCard').innerHTML=`<div class="sec"><h2>Team-Stand ${S.team.year}</h2><a href="#/team">Details</a></div>
      <a class="ringbox" href="#/team" style="margin-bottom:0">${ringHTML(st.pct,st.pct+'%','Quote','sm')}<div class="txt"><b>${st.komplett} von ${st.rows.length} komplett</b><div class="muted">${st.offen?`${st.offen} ${st.offen===1?'Mitarbeiter hat':'Mitarbeiter haben'} noch offene Unterweisungen`:'Alle Mitarbeiter sind fertig'}</div></div>${ic('chev','chev')}</a>`;
  }catch(e){console.error(e)}
}

/* ---------- Thema antippen ---------- */
ACT.topic=el=>{
  const t=themaById(el.dataset.id);if(!t)return;
  const nw=nwOf(myNw(thisYear()),t.id);
  sheet({title:t.titel,
    body:`${t.beschreibung?`<p class="muted" style="margin-bottom:14px">${esc(t.beschreibung)}</p>`:''}<div class="chips" style="margin-bottom:12px">${nw?chip('ok','Erledigt am '+fmtD(nw.datum)):chip('amber','Offen')}<span class="chip tone-gray">${ic('clock')} ca. ${t.dauer_min||6} Min.</span><span class="chip tone-gray">${t.fragen_anzahl} Prüfungsfragen</span></div>
      ${nw?`<p class="muted">Ergebnis: ${nw.richtig} von ${nw.gesamt} richtig (${nw.prozent} %).</p>`:`<p class="muted">So läuft es ab: Folien ansehen, ${t.fragen_anzahl} Fragen beantworten (mindestens ${PASS} % richtig), unterschreiben. Fertig.</p>`}`,
    footer:nw
      ?`<button class="btn btn-ghost" data-act="reviewThema" data-id="${t.id}">${ic('book')} Nochmal ansehen</button><button class="btn btn-primary" data-act="pdfNw" data-id="${nw.id}">${ic('doc')} PDF-Nachweis</button>`
      :`<button class="btn btn-ghost" data-act="closeSheet">Später</button><button class="btn btn-primary" data-act="startThema" data-id="${t.id}">${ic('play')} Starten</button>`});
};
ACT.startThema=el=>{while(SHEETS.length)closeSheet();openPlayer(el.dataset.id,false)};
ACT.reviewThema=el=>{while(SHEETS.length)closeSheet();openPlayer(el.dataset.id,true)};

function sigPad(host,initial){
  host.innerHTML=`<canvas></canvas><div class="base"></div><div class="ph">Hier mit dem Finger unterschreiben</div><button class="clear" type="button">Löschen</button>`;
  const cv=$('canvas',host),ctx=cv.getContext('2d'),ph=$('.ph',host);
  let drawing=false,dirty=false,last=null,mid=null;
  const INK='#0b1220';
  const fit=()=>{const r=host.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(10,Math.round(r.width*dpr));cv.height=Math.max(10,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=INK;ctx.fillStyle=INK};
  fit();
  if(initial){const im=new Image();im.onload=()=>{const r=host.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height);dirty=true;ph.hidden=true};im.src=initial}
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}drawing=true;last=pos(e);mid=last;ctx.beginPath();ctx.arc(last.x,last.y,1.4,0,7);ctx.fill();dirty=true;ph.hidden=true;e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e),m={x:(last.x+p.x)/2,y:(last.y+p.y)/2};ctx.beginPath();ctx.moveTo(mid.x,mid.y);ctx.quadraticCurveTo(last.x,last.y,m.x,m.y);ctx.stroke();last=p;mid=m;e.preventDefault()});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drawing=false}));
  $('.clear',host).onclick=()=>{ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();dirty=false;ph.hidden=false};
  return{empty:()=>!dirty,data(){const o=document.createElement('canvas');o.width=600;o.height=Math.max(60,Math.round(600*cv.height/cv.width));const c=o.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,o.width,o.height);c.drawImage(cv,0,0,o.width,o.height);return o.toDataURL('image/png')}};
}

function teamStats(team){
  const by={};team.nw.forEach(n=>{(by[n.benutzer_id]=by[n.benutzer_id]||[]).push(n)});
  const rows=S.users.map(u=>{
    const req=themaReq(u.gruppe),nws=by[u.id]||[];

      state:total===0||done.length===total?'komplett':done.length?'teil':'nichts'};
  });
  const sumT=rows.reduce((s,r)=>s+r.total,0),sumD=rows.reduce((s,r)=>s+r.n,0);

async function pdfNew(title,sub){

function pdfKV(P,rows,y){

function pngSize(d){
  try{const b=atob(d.split(',')[1].slice(0,60));const w=(b.charCodeAt(16)<<24|b.charCodeAt(17)<<16|b.charCodeAt(18)<<8|b.charCodeAt(19)),h=(b.charCodeAt(20)<<24|b.charCodeAt(21)<<16|b.charCodeAt(22)<<8|b.charCodeAt(23));if(w>0&&h>0)return[w,h]}catch(e){}
  return[600,170];
}
function pdfPara(P,text,y,size=10,color=[13,21,36]){
  P.doc.setFont('helvetica','normal');P.doc.setFontSize(size);P.doc.setTextColor(...color);

  if(y+t.length*(size*0.5)>272){P.doc.addPage();y=20}
