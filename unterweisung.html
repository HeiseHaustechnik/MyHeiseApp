  let y=pdfKV(P,[['Mitarbeiter',n.benutzer_name],['Bereich',GRP[n.gruppe]||n.gruppe],['Unterweisung',n.thema_titel],['Datum',fmtD(n.datum)],['Ergebnis der Prüfung',`${n.richtig} von ${n.gesamt} richtig (${n.prozent} %) - bestanden (mindestens ${PASS} % erforderlich)`],['Form','Digital in der My Heise App: Folienvortrag mit anschließender Wissensprüfung']],P.y);
  const F=n.folien_titel||[];
  if(F.length){y=pdfH(P,'Behandelte Inhalte',y);y=pdfTable(P,['Nr.','Thema der Folie'],F.map((t,i)=>[String(i+1),t]),y,{columnStyles:{0:{cellWidth:14}}})}
  y=pdfPara(P,'Der Mitarbeiter bestätigt mit seiner Unterschrift, dass er an der oben genannten Unterweisung teilgenommen, die Inhalte verstanden und die Prüfung bestanden hat.',y+2,9.5,GREY);
  y=pdfSig(P,y+2,n.unterschrift,n.benutzer_name,fmtD(n.datum),'Unterschrift des Mitarbeiters');
  return pdfDeliver(P,`Unterweisung_${fname(n.benutzer_name||'Mitarbeiter')}_${fname(n.thema_titel).slice(0,40)}_${n.datum}.pdf`);
}
async function pdfJahr({benutzer_id,name,gruppe,jahr}){
  const rows=await api('GET','unt_nachweise',null,`?benutzer_id=eq.${benutzer_id}&jahr=eq.${jahr}&select=*&order=datum.asc,created_at.asc`);
  const cy=thisYear(),req=jahr===cy?themaReq(gruppe):[];
  const open=req.filter(t=>!rows.some(n=>n.thema_id===t.id)),doneReq=req.length-open.length;
  const P=await pdfNew(`Jahresnachweis Unterweisungen ${jahr}`,`${name} · Bereich ${GRP[gruppe]||gruppe}`);
  const status=jahr===cy?(req.length&&!open.length?`Alle ${req.length} Unterweisungen ${jahr} abgeschlossen`:`${doneReq} von ${req.length} Unterweisungen abgeschlossen`):`${rows.length} ${rows.length===1?'Unterweisung':'Unterweisungen'} dokumentiert`;
  let y=pdfKV(P,[['Mitarbeiter',name],['Bereich',GRP[gruppe]||gruppe],['Jahr',jahr],['Stand',fmtD(berlinToday())],['Status',status],['Bestehensgrenze',`${PASS} % richtige Antworten`]],P.y);
  y=pdfH(P,'Abgeschlossene Unterweisungen',y);
  const sig=rows.map(r=>r.unterschrift);
  y=pdfTable(P,['Nr.','Datum','Unterweisung','Ergebnis','Unterschrift'],rows.length?rows.map((r,i)=>[String(i+1),fmtD(r.datum),r.thema_titel,`${r.richtig}/${r.gesamt} (${r.prozent} %)`,'']):[['','','Noch keine Unterweisung abgeschlossen','','']],y,
    {columnStyles:{0:{cellWidth:10},1:{cellWidth:24},3:{cellWidth:28},4:{cellWidth:34}},bodyStyles:{minCellHeight:13,valign:'middle'},
     didDrawCell:d=>{if(d.section==='body'&&d.column.index===4&&sig[d.row.index]){const im=sig[d.row.index],[w,h]=pngSize(im),bw=30,bh=Math.min(11,bw*h/w),bw2=bh*w/h;try{P.doc.addImage(im,'PNG',d.cell.x+2,d.cell.y+(d.cell.height-bh)/2,bw2,bh)}catch(e){}}}});
  if(open.length){y=pdfH(P,'Noch offen',y);y=pdfTable(P,['Nr.','Unterweisung'],open.map((t,i)=>[String(i+1),t.titel]),y,{columnStyles:{0:{cellWidth:14}}})}
  y=pdfPara(P,'Die Unterweisungen wurden digital in der My Heise App durchgeführt (Folienvortrag mit anschließender Wissensprüfung). Jede Unterweisung wurde vom Mitarbeiter einzeln unterschrieben; die Einzelnachweise sind separat abrufbar.',y+2,9,GREY);
  return pdfDeliver(P,`Jahresnachweis_Unterweisungen_${jahr}_${fname(name)}.pdf`);
}
/* =====================================================================
   Start der App
   ===================================================================== */
function showNoAccess(msg){
  $('#boot').hidden=true;
  $('#view').innerHTML=`<div class="noaccess">${ic('lock')}<h1>Kein Zugriff auf die Unterweisungen</h1><p class="muted">${esc(msg||'Für dein Konto sind die Unterweisungen nicht freigeschaltet. Bitte melde dich beim Administrator.')}</p><div class="btnrow" style="margin-top:22px"><a class="btn btn-primary" href="${PORTAL}">Zur Startseite</a><button class="btn btn-ghost" data-act="logout">Abmelden</button></div></div>`;
  $('#app').hidden=false;$('#tabbar').hidden=true;
}
async function boot(){
  if(!storedRefresh()&&!AUTH.refresh)return toLogin();
  try{
    await ensureToken();
    const sub=jwtSub(AUTH.access);
    const rows=await api('GET','benutzer',null,`?auth_id=eq.${sub}`);
    if(!rows.length)return showNoAccess('Für dieses Konto ist kein Benutzerprofil hinterlegt.');
    S.me=rows[0];
    if(S.me.pw_aendern)return location.replace(`${PORTAL}?next=${encodeURIComponent('unterweisung.html')}`);
    if(!(await rpc('unt_zugriff')))return showNoAccess();
    await loadAll();
  }catch(e){
    console.error(e);
    if(/abgelaufen|Nicht angemeldet/.test(e.message||''))return;
    $('#boot').hidden=true;$('#app').hidden=false;$('#tabbar').hidden=true;
    $('#view').innerHTML=`<div class="noaccess">${ic('alert')}<h1>Konnte nicht laden</h1><p class="muted">${esc(niceErr(e))}</p><div class="btnrow" style="margin-top:22px"><button class="btn btn-primary" onclick="location.reload()">Erneut versuchen</button></div></div>`;
    return;
  }
  $('#boot').hidden=true;$('#app').hidden=false;
  renderShell();route();loadNz();
}
window.addEventListener('storage',e=>{if(e.key===SESS_KEY&&!e.newValue&&S.me){location.replace(PORTAL)}}); // in einem anderen Tab abgemeldet
boot();

</script>
