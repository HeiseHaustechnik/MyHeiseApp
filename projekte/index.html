<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>Heise Projekte</title>
<link rel="stylesheet" href="lib/heise-ui.css">
<style>
.pagehead{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.pagehead h1{font-size:24px;font-weight:770;overflow-wrap:anywhere}
.pagehead small{display:block;color:var(--ink-3);font-size:13px;font-weight:600;margin-top:2px}
.form-b{padding:0 0 4px}
.form-b .field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.delbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.delbtn:active{background:var(--red-bg);color:var(--red)}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
input[type=file].inp{padding:12px 14px}
.eyebtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3);flex:0 0 auto}
.eyebtn:active{background:var(--surface-2)}
.row-card.aus{opacity:.55}
.chk{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.chk b{display:block;font-size:14.5px}
.emrow{display:grid;grid-template-columns:1fr 1fr 110px 40px;gap:8px;align-items:end;margin-bottom:8px}
@media(max-width:560px){.emrow{grid-template-columns:1fr 1fr 40px}.emrow .er{grid-column:1/3}}
.emrow .field{margin:0}
.btn.danger{color:var(--red)}
.btn.danger:active{background:var(--red-bg)}
.fold-b .sep{border-top:1px solid var(--line);margin:16px 0 12px}
.mpq{display:flex;align-items:center;gap:12px;justify-content:space-between}
.mpq .hint{margin:4px 0 0}
.mpl{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.mrow{display:grid;grid-template-columns:28px 130px 1.3fr 1fr 190px 40px;gap:8px;align-items:end;background:var(--surface,#fff);border:1px solid var(--line);border-radius:14px;padding:10px}
.mrow.aus{opacity:.5}
.mrow .field{margin:0}
.mrow .field label{font-size:11.5px}
.mchk{align-self:center;display:grid;place-items:center}
.mchk input{width:22px;height:22px;accent-color:var(--accent)}
.mhint{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}
/* PDS_V2: Übernahme aus pds */
.pdsbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pdsp{border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--surface,#fff)}
.pdsp .kopf{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pdsp .kopf b{font-size:15px}
.pdsp small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:2px}
.pdsp .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pdssys{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;margin:0 0 14px;font-size:14px;font-weight:600}
.pdssys.test{background:var(--amber-bg);color:var(--amber)}
.pdssys.live{background:var(--ok-bg);color:var(--ok)}
.pdssys .ic{flex:0 0 auto;margin-top:1px}
.sec-title .lnk{float:right;font-size:13px;font-weight:650;color:var(--accent);background:none;border:0;cursor:pointer}
@media(max-width:720px){.mrow{grid-template-columns:28px 1fr 40px}.mrow .field{grid-column:2/3}.mrow .delbtn{grid-column:3;grid-row:1}.mhint{grid-column:2/3}}
</style>
</head>
<body>
<header class="topbar pjs-desk-aus">
  <a href="../index.html" class="brand" title="Zur My Heise App"><div class="lt"><img src="lib/heise-logo.svg" alt="Heise Haustechnik"></div><div style="min-width:0"><b>Heise Projekte</b><small>Aufmaß · Bautagebuch</small></div></a>
</header>
<main class="shell" id="app"><div class="empty">Lädt …</div></main>
<div class="toast" id="toast"></div>
<script src="lib/heise-icons.js"></script>
<script src="lib/pj-api.js"></script>
<script src="lib/pj-shell.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dDE=d=>d?new Date(d).toLocaleDateString('de-DE'):'';
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2200); }
const api=(path,opt={})=>PJ.api(path,opt);
function route(){ const m=location.hash.match(/^#p=(.+)$/); window.scrollTo(0,0);
  if(m){ PJS.set({seite:'projekt',pid:decodeURIComponent(m[1]),erfassen:false}); showProjekt(m[1]); }
  else if(location.hash==='#mehrere'){ PJS.set({seite:'liste',pid:null,pname:''}); showMehrere(); }
  else if(location.hash==='#pds'){ PJS.set({seite:'liste',pid:null,pname:''}); showPds(); }
  else { PJS.set({seite:'liste',pid:null,pname:''}); showListe().then(()=>{ if(location.hash==='#neu'){ const d=$('#np_name')&&$('#np_name').closest('details'); if(d){ d.open=true; d.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>$('#np_name').focus(),300); } } }); } }
window.addEventListener('hashchange',route);
const plural=(n,a,b)=>n+' '+(n==1?a:b);

/* ---------- Startseite ---------- */
async function showListe(){
  const app=$('#app');
  let list=[];
  try{ list=await api('projekte'); }catch(e){ app.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  const h=new Date().getHours(), gruss=h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend';
  const aktiv=list.filter(p=>p.status!=='archiv');
  // „Meine Projekte“: eigene Einstellung zuerst, sonst zugeordnet bzw. ohne Team (Projektleitung sieht standardmäßig alle)
  const mein=p=>p.status!=='archiv' && (p.ansicht===true || (p.ansicht!==false && (PJ.leitung() || p.meins || !p.team_n)));
  let modus='meine'; try{ modus=localStorage.getItem('pj_modus')||'meine'; }catch(e){}
  const zeig=modus==='alle'? list : list.filter(mein);
  app.innerHTML=`${PJS.pills()}
    <section class="hero">
      <div><div class="ey">${gruss}</div><h1>Projekte</h1></div>
      <div class="logo-tile"><img src="lib/heise-logo.svg" alt="Heise Haustechnik"></div>
      <p>${plural(aktiv.length,'aktives Projekt','aktive Projekte')} · Aufmaße erfassen, prüfen und unterschreiben lassen.</p>
    </section>
    <div class="segc" style="margin:18px 0 6px"><button data-modus="meine" class="${modus==='meine'?'on':''}">Meine Projekte (${list.filter(mein).length})</button><button data-modus="alle" class="${modus==='alle'?'on':''}">Alle (${list.length})</button></div>
    <p class="hint" style="margin:0 0 12px">Mit dem Auge blendest du ein Projekt für dich ein oder aus. Unter „Alle“ findest du jederzeit jedes Projekt, auch archivierte.</p>
    ${zeig.length? zeig.map(p=>`<a class="row-card${mein(p)?'':' aus'}" href="#p=${p.id}">
        <div class="mi tone-brand">${IC('building')}</div>
        <div class="mt"><b>${esc(p.name)}</b><small>${esc([p.nr,p.adresse].filter(Boolean).join(' · '))}</small>
          <div class="tags"><span class="pill tone-blue">${plural(p.anz_aufmasse,'Aufmaß','Aufmaße')}</span><span class="pill tone-gray">${p.anz_lv} LV-Positionen</span>${p.meins?'<span class="pill tone-ok"><i></i>zugeordnet</span>':''}${p.status==='archiv'?'<span class="pill tone-gray">archiviert</span>':mein(p)?'':'<span class="pill tone-gray">ausgeblendet</span>'}</div></div>
        <button class="eyebtn" data-eye="${p.id}" data-on="${mein(p)?1:0}" title="${mein(p)?'Für mich ausblenden':'Für mich einblenden'}" aria-label="${mein(p)?'Für mich ausblenden':'Für mich einblenden'}">${IC(mein(p)?'eye':'eyeoff')}</button>
        <span class="chev">${IC('chev')}</span></a>`).join('')
      : list.length? `<div class="empty">${IC('eyeoff')}<div>In deiner Ansicht sind gerade keine Projekte. Unter „Alle“ kannst du Projekte mit dem Auge einblenden.</div></div>`
      :`<div class="empty">${IC('building')}<div>Noch keine Projekte angelegt.</div></div>`}
    <div class="sec-title nur-leitung">Verwaltung</div>
    <details class="fold nur-leitung"><summary>${IC('plus')}Neues Projekt anlegen</summary><div class="fold-b">
      <div class="row2"><div class="field"><label>Projekt-Nr.</label><input class="inp" id="np_nr"></div><div class="field"><label>Name *</label><input class="inp" id="np_name"></div></div>
      <div class="field"><label>Adresse</label><input class="inp" id="np_adr"></div>
      <button class="btn cta block" id="np_ok">Projekt anlegen</button>
      <p class="hint" style="margin-top:10px">Das LV wird danach im Projekt aus der Kalkulations-Excel importiert.</p></div></details>
    <a class="row-card nur-leitung" href="#mehrere"><div class="mi tone-brand">${IC('plus')}</div><div class="mt"><b>Mehrere Projekte auf einmal anlegen</b><small>Baustellen aus der Planung übernehmen oder eine Liste aus Excel einfügen</small></div><span class="chev">${IC('chev')}</span></a>
    <a class="row-card nur-admin" href="#pds"><div class="mi tone-brand">${IC('upload')}</div><div class="mt"><b>${PJ.test?'Aus dem pds-Testsystem übernehmen':'Aus pds übernehmen'}</b><small>Projekte und LV mit „MyHeiseApp = Ja“, erst Vorschau, dann übernehmen</small></div><span class="chev">${IC('chev')}</span></a>
    ${PJ.test?'':`<button class="row-card nur-admin" style="width:100%;text-align:left" onclick="PJ.setTest(true)"><div class="mi tone-amber">${IC('alert')}</div><div class="mt"><b>PDS-Testbereich öffnen</b><small>Eigene Testdaten für die pds-Anbindung, getrennt von den echten Projekten</small></div><span class="chev">${IC('chev')}</span></button>`}
    <details class="fold nur-leitung"><summary>${IC('upload')}Projekt aus Importdatei anlegen</summary><div class="fold-b">
      <p class="hint" style="margin-bottom:10px">Für vorbereitete Projektdateien mit LV, Bereichen und Vorschlägen (.json).</p>
      <div class="field"><input type="file" class="inp" id="imp_f" accept=".json,application/json"></div>
      <button class="btn block" id="imp_ok">Importieren</button><div id="imp_msg"></div></div></details>
    <details class="fold nur-admin"><summary>${IC('upload')}Daten aus der alten Projekte-Seite übernehmen</summary><div class="fold-b">
      <p class="hint" style="margin-bottom:10px">Einmalig: die Datei <b>daten-uebernahme.json</b> wählen. Sie enthält alle Projekte, LVs, Aufmaße und Bautagebücher der alten Seite. Kann gefahrlos wiederholt werden, nichts wird doppelt angelegt.</p>
      <div class="field"><input type="file" class="inp" id="mig_f" accept=".json,application/json"></div>
      <button class="btn block" id="mig_ok">Daten übernehmen</button><div id="mig_msg"></div></div></details>
    <p class="hint" style="text-align:center;margin-top:30px">Heise Haustechnik GmbH &amp; Co. KG · Braunlage</p>`;
  document.querySelectorAll('[data-modus]').forEach(b=>b.onclick=()=>{ try{ localStorage.setItem('pj_modus',b.dataset.modus); }catch(e){} showListe(); });
  document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=async ev=>{ ev.preventDefault(); ev.stopPropagation();
    const an=b.dataset.on!=='1'; b.disabled=true;
    try{ await api('projekte/'+b.dataset.eye+'/ansicht',{method:'PUT',body:JSON.stringify({sichtbar:an})}); toast(an?'Projekt eingeblendet':'Projekt ausgeblendet'); showListe(); }
    catch(e){ toast(e.message); b.disabled=false; } });
  $('#mig_ok').onclick=migration;
  ['#np_nr','#np_name','#np_adr'].forEach(s=>{ const e=$(s); if(e) e.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); $('#np_ok').click(); } }; });
  $('#np_ok').onclick=async()=>{ const name=$('#np_name').value.trim(); if(!name) return toast('Bitte einen Namen eintragen');
    try{ const r=await api('projekte',{method:'POST',body:JSON.stringify({nr:$('#np_nr').value.trim(),name,adresse:$('#np_adr').value.trim()})}); location.hash='#p='+r.id; }catch(e){ toast(e.message); } };
  $('#imp_ok').onclick=async()=>{ const f=$('#imp_f').files[0]; if(!f) return toast('Bitte eine Datei wählen');
    const b=$('#imp_ok'); b.disabled=true; b.textContent='Importiere …';
    try{ const d=JSON.parse(await f.text()); const r=await api('import',{method:'POST',body:JSON.stringify(d)}); location.hash='#p='+r.projekt_id; }
    catch(e){ $('#imp_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; b.disabled=false; b.textContent='Importieren'; } };
}

/* ---------- Mehrere Projekte auf einmal anlegen (supabase/projekte_schnell.sql) ---------- */
let MP={rows:[],pl:[],pj:[],geladen:false,fertig:false};
const mpNorm=s=>String(s||'').toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim();
const mpNrOk=n=>!n||/^\d{8}$/.test(n)||/^\d{7}-\d{4}$/.test(n);
function mpPlanVorschlag(name,wunsch){ const frei=MP.pl.filter(b=>!MP.rows.some(r=>r.baustelle===b.id));
  if(wunsch){ const w=mpNorm(wunsch); const t=frei.find(b=>mpNorm(b.name)===w); if(t) return t.id; }
  const n=mpNorm(name); if(!n) return '';
  const t=frei.find(b=>mpNorm(b.name)===n)||frei.find(b=>{ const m=mpNorm(b.name); return m.length>=4&&(n.includes(m)||m.includes(n)); });
  return t?t.id:''; }
function mpHinweis(r){ const h=[];
  const vorh=r.nr?MP.pj.find(p=>p.nr===r.nr):MP.pj.find(p=>mpNorm(p.name)===mpNorm(r.name));
  if(vorh) h.push(['gray',`gibt es schon („${vorh.name}“)${vorh.planung?', bereits in der Planung':r.baustelle?', wird nur verknüpft':''}`]);
  if(!r.nr) h.push(['warn','ohne Projekt-Nr.']);
  else if(!mpNrOk(r.nr)) h.push(['warn','Nr. prüfen (Form 32600972 oder 3261000-0004)']);
  if(MP.rows.filter(x=>x.nr&&x.nr===r.nr).length>1) h.push(['warn','Nr. doppelt in der Liste']);
  return h; }
async function showMehrere(){
  const app=$('#app');
  if(!PJ.leitung()){ app.innerHTML=`<div class="err">Nur die Projektleitung kann Projekte anlegen.</div><a class="btn ghost" href="#">Zurück</a>`; return; }
  if(!MP.geladen){ app.innerHTML='<div class="empty">Lädt …</div>';
    try{ const d=await PJ.rpc('pj_schnell_laden',{}); MP.pl=d.planung||[]; MP.pj=d.projekte||[]; MP.geladen=true; }
    catch(e){ app.innerHTML=`<div class="err">${esc(/pj_schnell_laden|function/i.test(e.message)?'Die Datenbank-Erweiterung projekte_schnell.sql ist noch nicht eingespielt. Bitte zuerst im Supabase SQL-Editor ausführen.':e.message)}</div><a class="btn ghost" href="#">Zurück</a>`; return; } }
  mpZeichnen();
}
function mpZeichnen(){
  const app=$('#app'), offen=MP.pl.filter(b=>!b.fertig&&!MP.rows.some(r=>r.baustelle===b.id));
  const opt=sel=>`<option value="">nicht verknüpfen</option>${MP.pl.map(b=>`<option value="${esc(b.id)}" ${b.id===sel?'selected':''} ${b.id!==sel&&MP.rows.some(r=>r.baustelle===b.id)?'disabled':''}>${esc(b.name)}${b.fertig?' (abgeschl.)':''}</option>`).join('')}`;
  const anz=MP.rows.filter(r=>r.an&&r.name.trim()).length;
  app.innerHTML=`
    <div class="pagehead"><a class="iconbtn" href="#" aria-label="Zurück">${IC('back')}</a><div style="min-width:0"><h1>Mehrere Projekte anlegen</h1><small>Aus der Planung übernehmen oder eine Liste einfügen</small></div></div>
    <div class="card mpq"><div><b>Aus der Planung</b><p class="hint">${offen.length?`${plural(offen.length,'Baustelle','Baustellen')} aus der Planung haben noch kein App-Projekt.`:'Alle laufenden Baustellen der Planung haben schon ein App-Projekt.'}</p></div>
      <button class="btn" id="mp_pl" ${offen.length?'':'disabled'}>${IC('plus')}Übernehmen</button></div>
    <div class="card"><b>Liste einfügen</b>
      <p class="hint" style="margin:4px 0 8px">Eine Zeile je Projekt: <b>Projekt-Nr.; Name; Adresse; Baustelle in der Planung</b>. Direkt aus Excel kopieren geht auch. Nur der Name ist Pflicht.</p>
      <textarea class="inp" id="mp_txt" rows="4" placeholder="32500554; WvS Bad Harzburg 2. BA; Bad Harzburg; WvS&#10;32601090; Sonnenberg Ramblers Lodge"></textarea>
      <button class="btn block" id="mp_ein" style="margin-top:8px">In die Liste übernehmen</button></div>
    ${MP.rows.length?`<div class="sec-title">Liste (${MP.rows.length})<button class="lnk" id="mp_leer">Liste leeren</button></div>
    <div class="mpl">${MP.rows.map((r,i)=>{ const h=mpHinweis(r); return `<div class="mrow${r.an?'':' aus'}" data-i="${i}">
        <label class="mchk"><input type="checkbox" data-k="an" ${r.an?'checked':''} aria-label="anlegen"></label>
        <div class="field"><label>Projekt-Nr.</label><input class="inp" data-k="nr" value="${esc(r.nr)}" inputmode="numeric"></div>
        <div class="field"><label>Name *</label><input class="inp" data-k="name" value="${esc(r.name)}"></div>
        <div class="field"><label>Adresse</label><input class="inp" data-k="adresse" value="${esc(r.adresse)}"></div>
        <div class="field"><label>Planung</label><select class="inp" data-k="baustelle">${opt(r.baustelle)}</select></div>
        <button class="delbtn" data-del="${i}" aria-label="Zeile entfernen">${IC('x')}</button>
        ${h.length?`<div class="mhint">${h.map(([t,s])=>`<span class="pill tone-${t==='warn'?'orange':'gray'}">${esc(s)}</span>`).join('')}</div>`:''}</div>`; }).join('')}</div>
    <button class="btn cta block" id="mp_go" ${anz?'':'disabled'}>${anz?plural(anz,'Projekt','Projekte')+' anlegen':'Projekte anlegen'}</button>
    <p class="hint" style="margin-top:8px">Projekte, deren Nummer es schon gibt, werden nicht doppelt angelegt, sondern nur mit der Planung verknüpft. Die Baustelle in der Planung bekommt die Projekt-Nr., wenn sie noch keine hat.</p>`
    :'<div class="empty">'+IC('building')+'<div>Noch keine Projekte in der Liste.</div></div>'}
    <div id="mp_res"></div>`;
  $('#mp_pl').onclick=()=>{ offen.forEach(b=>MP.rows.push({an:!!b.nr,nr:b.nr||'',name:b.name,adresse:b.ort||'',baustelle:b.id})); mpZeichnen(); };
  $('#mp_ein').onclick=()=>{ const n=mpEinfuegen($('#mp_txt').value); if(!n) return toast('Keine Zeilen erkannt'); toast(plural(n,'Zeile','Zeilen')+' übernommen'); mpZeichnen(); };
  const leer=$('#mp_leer'); if(leer) leer.onclick=()=>{ MP.rows=[]; mpZeichnen(); };
  document.querySelectorAll('.mrow').forEach(z=>{ const r=MP.rows[+z.dataset.i];
    z.querySelectorAll('[data-k]').forEach(el=>{ const k=el.dataset.k;
      el.onchange=()=>{ r[k]=k==='an'?el.checked:el.value.trim(); mpZeichnen(); }; }); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ MP.rows.splice(+b.dataset.del,1); mpZeichnen(); });
  const go=$('#mp_go'); if(go) go.onclick=mpAnlegen;
}
function mpEinfuegen(txt){ let n=0;
  String(txt||'').split(/\r?\n/).forEach(z=>{ if(!z.trim()) return;
    let f=z.split(z.includes('\t')?'\t':';').map(s=>s.trim());
    if(/name/i.test(z)&&/nr|nummer/i.test(z)&&n===0) return; // Kopfzeile
    let nr=''; if(f.length>1&&/^\d[\d\s\-\/]*$/.test(f[0]||'')){ nr=f.shift().replace(/\s/g,''); }
    const name=f[0]||''; if(!name) return;
    if(MP.rows.some(r=>(nr&&r.nr===nr&&mpNorm(r.name)===mpNorm(name))||(!nr&&!r.nr&&mpNorm(r.name)===mpNorm(name)))) return;
    MP.rows.push({an:true,nr,name,adresse:f[1]||'',baustelle:''});
    const r=MP.rows[MP.rows.length-1]; r.baustelle=mpPlanVorschlag(name,f[2]); n++; });
  return n; }
async function mpAnlegen(){
  const zeilen=MP.rows.filter(r=>r.an&&r.name.trim()).map(r=>({nr:r.nr,name:r.name.trim(),adresse:r.adresse,baustelle:r.baustelle}));
  if(!zeilen.length) return;
  if(!confirm(`${plural(zeilen.length,'Projekt','Projekte')} anlegen bzw. verknüpfen?`)) return;
  const b=$('#mp_go'); b.disabled=true; b.textContent='Lege an …';
  try{ const x=await PJ.rpc('pj_schnell_anlegen',{p:{zeilen}});
    const z=x.zeilen||[], neu=z.filter(s=>s.status.startsWith('neu')).length, vk=z.filter(s=>s.status.includes('verknuepft')).length;
    MP.rows=MP.rows.filter(r=>!(r.an&&r.name.trim())); MP.geladen=false; await showMehrere();
    $('#mp_res').innerHTML=`<div class="card"><b>Fertig: ${plural(neu,'Projekt','Projekte')} neu angelegt, ${vk} mit der Planung verknüpft</b>
      ${z.map(s=>`<a class="row-card" href="#p=${esc(s.id)}"><div class="mi tone-brand">${IC('building')}</div><div class="mt"><b>${esc(s.name)}</b><small>${esc([s.nr,s.status.startsWith('neu')?'neu angelegt':'gab es schon',s.status.includes('verknuepft')?'mit Planung verknüpft':''].filter(Boolean).join(' · '))}</small></div><span class="chev">${IC('chev')}</span></a>`).join('')}</div>`;

/* ---------- Übernahme aus pds (Edge Function pds-bruecke, nur Admin) PDS_V2 ----------
   Erst immer ein Trockenlauf (nichts wird geändert). Übernommen wird
   • aus dem pds-Testsystem: in den PDS-Testbereich (Schema pdstest), nie in die echten Projekte,
   • aus dem Produktivsystem: in die echten Projekte, nur mit Secret PDS_SCHREIBEN = ja.
   Die Testdaten sieht man nur im Testbereich (PJ.setTest). */
let PDS={erg:null,laeuft:false,fehler:'',fertig:null};
async function showPds(){
  const app=$('#app');
  if(PJ.rolle!=='admin'){ app.innerHTML=`<div class="err">Nur für Administratoren.</div><a class="btn ghost" href="#">Zurück</a>`; return; }
  pdsZeichnen();
}
function pdsZahl(lv){ if(!lv) return '';
  if(lv.status!=='aktualisiert') return lv.status||'';
  const t=[]; if(lv.neu) t.push(plural(lv.neu,'neue Position','neue Positionen')); if(lv.geaendert) t.push(lv.geaendert+' geändert');
  if(lv.entfallen) t.push(lv.entfallen+' entfallen'); if(lv.behalten_wegen_aufmass) t.push(lv.behalten_wegen_aufmass+' wegen Aufmaß behalten');
  if(!t.length) t.push('unverändert');
  return plural(lv.positionen,'Position','Positionen')+' · '+t.join(', '); }
function pdsProjekt(p,imZiel){
  const st=p.status==='neu'?['blue','wird neu angelegt']:p.status==='verknüpft'?['blue','wird mit vorhandenem Projekt verknüpft']:p.status==='aktualisiert'?['gray','schon vorhanden']:p.status==='konflikt'?['red','Konflikt']:['red',p.status||'?'];
  const lv=p.lv||{}, lvTon=lv.status==='übersprungen'?'amber':(lv.neu||lv.geaendert||lv.entfallen)?'blue':'gray';
  const team=(p.team||[]).map(t=>t.app?`<span class="pill tone-ok"><i></i>${esc(t.app)}</span>`:`<span class="pill tone-amber" title="Kein App-Benutzer zu diesem Namen gefunden">${esc(t.pds)}: kein Benutzer</span>`).join('');
  return `<div class="pdsp"><div class="kopf"><div style="min-width:0"><b>${esc(p.nr)} · ${esc(p.name)}</b><small>${esc(p.adresse||'ohne Adresse')}</small></div>
      ${imZiel&&p.app_id&&p.status!=='konflikt'?`<a class="btn ghost sm" href="#p=${esc(p.app_id)}">Öffnen</a>`:''}</div>
    <div class="tags"><span class="pill tone-${st[0]}">${st[1]}</span><span class="pill tone-${lvTon}">LV: ${esc(pdsZahl(lv))}</span>${team}</div>
    ${p.hinweis||lv.hinweis?`<p class="hint" style="margin:8px 0 0">${esc(p.hinweis||lv.hinweis)}</p>`:''}
    ${(lv.umbenannt||[]).length?`<p class="hint" style="margin:6px 0 0">Doppelte Positionsnummern: ${lv.umbenannt.map(u=>esc(u.pds+' → '+u.app)).join(', ')}</p>`:''}</div>`; }
function pdsZeichnen(){
  const app=$('#app'), e=PDS.erg;
  const test=e&&e.testbereich;
  // Projekte öffnen geht nur dort, wo sie liegen: Testdaten im Testbereich, echte Daten außerhalb
  const imZiel=e? (!!test===!!PJ.test) : false;
  const sys=!e?'':test
      ?`<div class="pdssys test">${IC('alert')}<div>Verbunden mit dem pds-Testsystem. Übernommen wird nur in den <b>PDS-Testbereich</b>. Die echten Projekte der App bleiben unberührt.</div></div>`
      :e.schreiben_erlaubt
      ?`<div class="pdssys live">${IC('check')}<div>Verbunden mit ${esc(e.system_name||'pds')}. Übernahme in die echten Projekte ist freigegeben.</div></div>`
      :`<div class="pdssys test">${IC('alert')}<div>${esc(e.system_name||'pds')}: nur Vorschau. In der App wird nichts angelegt oder geändert (Secret PDS_SCHREIBEN fehlt).</div></div>`;
  const prj=e?(e.projekte||[]):[];
  const aenderung=prj.some(p=>p.status==='neu'||p.status==='verknüpft'||(p.lv&&(p.lv.neu||p.lv.geaendert||p.lv.entfallen)));
  const goText=test?'In den Testbereich übernehmen':'Jetzt übernehmen';
  app.innerHTML=`${PJS.pills()}
    <div class="pagehead"><a class="iconbtn" href="#" aria-label="Zurück">${IC('back')}</a><div style="min-width:0"><h1>${PJ.test?'pds-Testsystem → Testbereich':'Aus pds übernehmen'}</h1><small>Projektakten und Aufträge mit „MyHeiseApp = Ja“</small></div></div>
    <div class="card"><p class="hint" style="margin:0 0 12px">Die Vorschau liest nur aus pds und zeigt, was angelegt oder geändert würde. Preise werden nie übernommen. Vorhandene Aufmaße bleiben erhalten.</p>
      <div class="pdsbar"><button class="btn cta" id="pds_vor" ${PDS.laeuft?'disabled':''}>${PDS.laeuft==='vorschau'?'Lese pds …':e?'Vorschau neu laden':'Vorschau laden'}</button>
      ${e&&e.schreiben_erlaubt&&prj.length?`<button class="btn" id="pds_go" ${PDS.laeuft?'disabled':''}>${PDS.laeuft==='echt'?'Übernehme …':goText}</button>`:''}</div>
      ${PJ.test?`<div class="sep" style="border-top:1px solid var(--line);margin:14px 0 10px"></div><div class="pdsbar"><a class="btn ghost sm" href="#">Testprojekte ansehen</a><button class="btn ghost sm danger" id="pds_leer">Testbereich leeren</button></div>`:''}</div>
    ${PDS.fehler?`<div class="err">${esc(PDS.fehler)}</div>`:''}
    ${PDS.fertig?`<div class="card" style="background:var(--ok-bg)"><b style="color:var(--ok)">Übernommen in ${esc(PDS.fertig.ziel)}: ${plural(PDS.fertig.neu,'Projekt','Projekte')} neu, ${PDS.fertig.akt} aktualisiert.</b>
      ${test&&!PJ.test?`<p class="hint" style="margin:6px 0 0">Die Testprojekte siehst du im Testbereich.</p><button class="btn sm" style="margin-top:8px" onclick="PJ.setTest(true)">Testbereich öffnen</button>`:''}</div>`:''}
    ${sys}
    ${e?`<div class="sec-title">${e.probe===false?'Ergebnis':'Vorschau'} · ${plural(prj.length,'Projekt','Projekte')}</div>
      ${prj.length?prj.map(p=>pdsProjekt(p,imZiel)).join(''):`<div class="empty">${IC('list')}<div>In pds ist keine Projektakte und kein Auftrag mit „MyHeiseApp = Ja“ markiert.</div></div>`}
      ${prj.length&&!aenderung&&e.probe!==false?'<p class="hint">Alles ist schon auf dem Stand von pds.</p>':''}
      ${(e.hinweise||[]).length?`<div class="sec-title">Hinweise</div><div class="card">${e.hinweise.map(h=>`<p class="hint" style="margin:0 0 6px">${esc(h)}</p>`).join('')}</div>`:''}
      <p class="hint" style="margin-top:14px">${plural(e.projektakten_gelesen||0,'Projektakte','Projektakten')} gelesen, ${plural(e.auftraege_markiert||0,'markierter Auftrag','markierte Aufträge')} · ${Math.round((e.dauer_ms||0)/100)/10} s</p>`:''}`;
  $('#pds_vor').onclick=()=>pdsLaden(true);
  const go=$('#pds_go'); if(go) go.onclick=()=>{
    const n=prj.filter(p=>p.status==='neu').length;
    if(!confirm(`${test?'In den PDS-Testbereich übernehmen?':'Jetzt in die echten Projekte übernehmen?'}

${plural(n,'Projekt wird','Projekte werden')} neu angelegt, ${plural(prj.length-n,'Projekt wird','Projekte werden')} aktualisiert.`)) return;
    pdsLaden(false); };
  const leer=$('#pds_leer'); if(leer) leer.onclick=async()=>{
    if(!confirm('Alle Testdaten im PDS-Testbereich löschen?\n\nDie echten Projekte bleiben unberührt.')) return;
    try{ await PJ.rpc('pds_test_leeren',{}); PDS.erg=null; PDS.fertig=null; toast('Testbereich geleert'); pdsZeichnen(); }catch(err){ toast(err.message); } };
}
async function pdsLaden(probe){
  PDS.laeuft=probe?'vorschau':'echt'; PDS.fehler=''; PDS.fertig=null; pdsZeichnen();
  try{
    const r=await PJ.fn('pds-bruecke',probe?{action:'uebernehmen'}:{action:'uebernehmen',probe:false});
    PDS.erg=r;
    if(!probe){ const p=r.projekte||[]; PDS.fertig={ziel:r.ziel||'die App',neu:p.filter(x=>x.status==='neu').length,akt:p.length-p.filter(x=>x.status==='neu').length}; }
  }catch(e){
    PDS.fehler=e.daten&&e.daten.hinweis?e.message+' '+e.daten.hinweis
      :e.status===403&&e.daten&&e.daten.schreiben_erlaubt===false?e.message
      :/Nur für Administratoren/.test(e.message)?'Nur für Administratoren.'
      :/Failed to fetch|Load failed|Keine Verbindung/i.test(e.message)?'Keine Verbindung zur Funktion pds-bruecke.'
      :e.message;
  }
  PDS.laeuft=false; pdsZeichnen();
}

      <div class="field"><label>Name / Firma</label><input class="inp" data-i="${i}" data-k="name" value="${esc(r.name)}" placeholder="z. B. Landkreis Göttingen"></div>
      <div class="field"><label>E-Mail *</label><input class="inp" type="email" data-i="${i}" data-k="email" value="${esc(r.email)}" placeholder="name@firma.de"></div>
      <div class="field er"><label>Rolle</label><input class="inp" data-i="${i}" data-k="rolle" value="${esc(r.rolle)}" placeholder="Bauherr" list="emRollen"></div>
      <button class="delbtn" data-del="${i}" title="Entfernen">${IC('trash','sm')}</button></div>`).join('')+`<datalist id="emRollen"><option>Bauherr</option><option>Architekt</option><option>Planungsbüro</option><option>Bauleitung</option><option>Projektsteuerung</option></datalist>`
      : '<p class="hint">Noch keine Empfänger eingetragen.</p>';
    document.querySelectorAll('#emList [data-k]').forEach(el=>el.oninput=()=>{ L[+el.dataset.i][el.dataset.k]=el.value; });
    document.querySelectorAll('#emList [data-del]').forEach(b=>b.onclick=()=>{ L.splice(+b.dataset.del,1); draw(); }); };
  draw();
  $('#emAdd').onclick=()=>{ L.push({name:'',email:'',rolle:''}); draw(); const x=document.querySelectorAll('#emList [data-k="name"]'); x[x.length-1].focus(); };
  $('#emSave').onclick=async()=>{
    const out=L.map(r=>({name:r.name.trim(),email:r.email.trim(),rolle:r.rolle.trim()})).filter(r=>r.name||r.email);
    const bad=out.find(r=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)); if(bad) return toast('Bitte eine gültige E-Mail-Adresse eintragen'+(bad.name?' ('+bad.name+')':''));
    try{ await api('projekte/'+pid,{method:'PUT',body:JSON.stringify({empfaenger:out})}); L=out; draw(); toast('Empfänger gespeichert'); }catch(e){ toast(e.message); } };
}
/* ---------- Projektdaten, Archiv, Löschen ---------- */
function projektSetup(id,p,hatDaten){
  $('#ep_ok').onclick=async()=>{ const name=$('#ep_name').value.trim(); if(!name) return toast('Bitte einen Namen eintragen');
    try{ await api('projekte/'+id,{method:'PUT',body:JSON.stringify({nr:$('#ep_nr').value.trim(),name,adresse:$('#ep_adr').value.trim()})}); toast('Projektdaten gespeichert'); route(); }catch(e){ toast(e.message); } };
  $('#ep_arch').onclick=async()=>{ const neu=p.status==='archiv'?'aktiv':'archiv';
    try{ await api('projekte/'+id,{method:'PUT',body:JSON.stringify({status:neu})}); toast(neu==='archiv'?'Projekt archiviert':'Projekt wieder aktiv'); route(); }catch(e){ toast(e.message); } };
  $('#ep_del').onclick=async()=>{
    let body={};
    if(hatDaten){
      const ein=prompt(`Achtung: Alle Aufmaße, Bautagebuch-Einträge, Fotos und das LV von „${p.name}“ werden endgültig gelöscht.\n\nZur Bestätigung den Projektnamen genau eintragen:`);
      if(ein===null) return;
      if(ein.trim()!==p.name) return toast('Der Name stimmt nicht, nichts gelöscht');
      body={bestaetigung:p.name};
    } else if(!confirm(`Projekt „${p.name}“ löschen?`)) return;
    try{ await api('projekte/'+id,{method:'DELETE',body:JSON.stringify(body)}); toast('Projekt gelöscht'); location.hash=''; }catch(e){ toast(e.message); } };
}
async function delAufmass(id,bez){
  if(!confirm(`Aufmaß „${bez}“ mit allen Einträgen endgültig löschen?`)) return;
  try{ await api('aufmasse/'+id,{method:'DELETE'}); route(); toast('Aufmaß gelöscht'); }catch(e){ toast(e.message); }

/* ---------- LV-Import aus Excel ---------- */
function loadScript(src,test,name){ return test()? Promise.resolve() : new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error(name+' konnte nicht geladen werden')); document.head.appendChild(s); }); }
const loadExcelJS=()=>loadScript('lib/exceljs.min.js',()=>window.ExcelJS,'ExcelJS');
const loadSheetJS=()=>loadScript('lib/xlsx.core.min.js',()=>window.XLSX,'SheetJS');
const cellVal=v=>{ if(v==null) return ''; if(typeof v==='object'){ if('result' in v) return v.result??''; if(v.richText) return v.richText.map(t=>t.text).join(''); if(v.text) return v.text; } return v; };
/* Liest .xlsx (ExcelJS) und alte .xls-Exporte, z. B. aus Addison (SheetJS).
   Ergebnis je Blatt: Zeilen {v:[Rohwerte], t:[Text], hidden} mit Spalten ab Index 1 wie in Excel. */
async function readSheets(f){
  const buf=await f.arrayBuffer();
  if(/\.xlsx$/i.test(f.name)){
    await loadExcelJS(); const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf);
    return wb.worksheets.map(ws=>({name:ws.name,rows:()=>{ const out=[]; for(let r=1;r<=ws.rowCount;r++){ const row=ws.getRow(r), v=[''], t=['']; for(let c=1;c<=Math.max(ws.columnCount,row.cellCount);c++){ const cell=row.getCell(c); const x=cellVal(cell.value); v.push(x); let tx=''; try{ tx=cell.text; }catch(e){} t.push(String(tx||x||'')); } out.push({v,t,hidden:!!row.hidden}); } return out; }}));
  }
  await loadSheetJS(); const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellStyles:true});
  return wb.SheetNames.map(n=>({name:n,rows:()=>{ const ws=wb.Sheets[n]; if(!ws['!ref']) return []; const R=XLSX.utils.decode_range(ws['!ref']), meta=ws['!rows']||[], out=[];
    for(let r=R.s.r;r<=R.e.r;r++){ const v=[''], t=['']; for(let c=0;c<=R.e.c;c++){ const cell=ws[XLSX.utils.encode_cell({r,c})]; v.push(cell?cell.v:''); t.push(cell?String(cell.w!=null?cell.w:cell.v):''); } out.push({v,t,hidden:!!(meta[r]&&meta[r].hidden)}); }
    return out; }}));
}
/* pds-Export „pds XML (XML ohne Anhang)“: Export > Auftrag (o. ä.) > EbenenListe > Ebene (Los) > Ebene (Titel) > PositionenListe > Position.
   Positionen vom Typ TEXT (ohne Nummer) werden zu Zwischenüberschriften. Lohnzeit steht je Einheit in Sekunden
   (geprüft an FTZ: 3000 = 50 min laut Kalkulation) und wird in Minuten übernommen. Preise werden ignoriert.
   Alle Positionen kommen in die Aufmaß-Liste, weil pds keine ausgeblendeten Zeilen kennt. */
function parsePdsXml(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('Die XML-Datei ist nicht lesbar');
  const kids=(e,n)=>e?[...e.children].filter(c=>c.localName===n):[], kid=(e,n)=>kids(e,n)[0], tx=(e,n)=>{ const c=kid(e,n); return c?c.textContent.trim():''; };
  const root=doc.documentElement, vorgang=[...root.children].find(c=>kid(c,'EbenenListe'));
  if(!vorgang) throw new Error('Keine pds-Vorgangsdatei: „EbenenListe“ nicht gefunden. Bitte in pds „Export pds XML (XML ohne Anhang)“ verwenden.');
  const out=[];
  const posListe=e=>{ for(const P of kids(kid(e,'PositionenListe'),'Position')){
      const nr=tx(P,'Nummer'), kurz=tx(P,'Kurztext').split(/\r?\n/)[0].trim();
      if(tx(P,'Typ')==='TEXT' || !nr){ if(kurz) out.push({typ:'X',bez:kurz.length>70? kurz.slice(0,67).replace(/\s+\S*$/,'')+' …' : kurz}); continue; }
      let me=tx(P,'Masseinheit'); if(/^st/i.test(me)) me='Stck'; if(me==='M') me='m';
      const lz=parseFloat(tx(P,'Lohnzeit'))||0, z=Math.round(lz/60*100)/100;
      out.push({typ:'P',pos:nr,bez:kurz||tx(P,'Name'),menge:parseFloat(tx(P,'Menge'))||0,me,in_liste:1,zeit:z>0?z:null}); } };
  const ebene=(E,prefix)=>{
    const nr=[prefix,tx(E,'Nummer')].filter(Boolean).join('.'), bez=tx(E,'Bezeichnung').split(/\r?\n/)[0].trim(), unter=kids(E,'Ebene');
    if(unter.length){ out.push({typ:'L',pos:nr,bez}); unter.forEach(u=>ebene(u,nr)); if(kids(kid(E,'PositionenListe'),'Position').length){ out.push({typ:'T',pos:nr,bez:bez+' (weitere Positionen)'}); posListe(E); } }
    else { out.push({typ:'T',pos:nr,bez}); posListe(E); }
  };
  kids(kid(vorgang,'EbenenListe'),'Ebene').forEach(E=>ebene(E,''));
  if(!out.some(o=>o.typ==='P')) throw new Error('Keine Positionen in der pds-Datei gefunden');
  return {lv:out, info:{nr:tx(vorgang,'Nummer'), bez:tx(vorgang,'Bezeichnung')}};
}
async function lvImport(pid){
  const f=$('#lv_f').files[0]; if(!f) return;
  $('#lv_msg').innerHTML='<p class="hint">Lese Datei …</p>';
  try{
    if(!/\.(xlsx|xls|xml)$/i.test(f.name)) throw new Error('Bitte eine Excel-Datei (.xlsx, .xls) oder einen pds-Export (.xml) wählen');
    if(/\.xml$/i.test(f.name)){ const {lv,info}=parsePdsXml(await f.text()); $('#lv_sheet').innerHTML=''; zeigLV(pid,lv,`pds-Vorgang ${info.nr} ${info.bez}`.trim()); return; }
    const sheets=await readSheets(f), names=sheets.map(w=>w.name);
    $('#lv_sheet').innerHTML=`<label>Blatt</label><select class="inp" id="lv_ws">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select>`;
    const upd=()=>{ try{ zeigLV(pid,parseLV(sheets.find(w=>w.name===$('#lv_ws').value).rows()),''); }catch(e){ $('#lv_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; } };
    $('#lv_ws').onchange=upd;
    let pref=names.findIndex(n=>/aufma/i.test(n)); if(pref<0) pref=0; $('#lv_ws').selectedIndex=pref;
    upd();
  }catch(e){ $('#lv_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function zeigLV(pid,r,quelle){
        window._lv=r;
        const P=r.filter(o=>o.typ==='P'), mitZeit=P.filter(o=>o.zeit>0), h=P.reduce((a,o)=>a+(o.zeit||0)*(o.menge||0),0)/60;
        $('#lv_msg').innerHTML=`${quelle?`<p class="hint" style="margin-bottom:4px">${esc(quelle)}</p>`:''}<p>${P.length} Positionen erkannt, davon ${P.filter(o=>o.in_liste).length} sichtbar (Aufmaß-Liste), ${r.filter(o=>o.typ==='L').length?r.filter(o=>o.typ==='L').length+' Lose, ':''}${r.filter(o=>o.typ==='T').length} Titel.</p>
          <p class="hint" style="margin-top:4px">${mitZeit.length?`Zeiten übernommen: ${mitZeit.length} Positionen, zusammen ${h.toLocaleString('de-DE',{maximumFractionDigits:1})} h. Sie sind nur im Aufmaß für das Team sichtbar, nicht im PDF und nicht bei der Unterschrift.`:'Keine Zeit-Spalte gefunden, das LV wird ohne Zeiten übernommen.'} Preise werden nicht übernommen.</p>
          <button class="btn cta block" id="lv_ok" style="margin-top:10px">LV übernehmen</button>`;
        $('#lv_ok').onclick=async()=>{ $('#lv_ok').disabled=true; try{ await api('projekte/'+pid+'/lv',{method:'PUT',body:JSON.stringify(window._lv)}); route(); }catch(e){ alert(e.message); $('#lv_ok').disabled=false; } };
}
/* Spalten über die Kopfzeile finden: Typ (Spalte A), Pos.-Nr., Bezeichnung, Menge, ME,
   dazu die Zeit je Einheit: „Zeit in min pro Stück“ (pds/Kalkulation), „Zeit“ (Addison, Minuten)
   oder „Zeit in h pro Stück“ (wird in Minuten umgerechnet). Preise werden ignoriert. */
function parseLV(rows){
  let hr=-1, col={};
  for(let r=0;r<Math.min(20,rows.length);r++){
    const vals=rows[r].t.map(v=>String(v).trim().toLowerCase());
    const pi=vals.findIndex(v=>v.startsWith('pos')), bi=vals.findIndex(v=>v.startsWith('bezeichnung'));
    if(pi>0&&bi>0){
      const jeEinheit=v=>/^zeit/.test(v) && /\b(pro|je)\b/.test(v) && !/gesamt/.test(v);
      let zi=vals.findIndex(v=>jeEinheit(v) && /\bmin\b/.test(v)), zf=1;
      if(zi<0) zi=vals.findIndex(v=>v==='zeit');
      if(zi<0){ zi=vals.findIndex(v=>jeEinheit(v) && /\bh\b/.test(v)); zf=60; }
      hr=r; col={pos:pi,bez:bi,menge:vals.findIndex(v=>v==='menge'),me:vals.findIndex(v=>v==='me'),typ:1,zeit:zi,zf}; break; }
  }
  if(hr<0) throw new Error('Kopfzeile mit „Pos.-Nr.“ und „Bezeichnung“ nicht gefunden');
  const num=x=>{ if(typeof x==='number') return x; const n=Number(String(x).replace(/\./g,'').replace(',','.')); return isFinite(n)?n:0; };
  const out=[]; let started=false;
  for(let r=hr+1;r<rows.length;r++){
    const row=rows[r]; const t=c=>c>0?String(row.t[c]??'').trim():'', v=c=>c>0?row.v[c]:'';
    const typ=t(col.typ), pos=t(col.pos).replace(/\.$/,''), bez=t(col.bez);
    const vis=!row.hidden;
    if(typ==='Los'){ started=true; out.push({typ:'L',pos,bez}); }
    else if(typ==='Titel'){ out.push({typ:'T',pos,bez:bez.split('\n')[0]}); }
    else if(typ==='Position'){ let me=t(col.me); if(/^st/i.test(me)) me='Stck'; if(me==='M') me='m';
      const z=col.zeit>0? Math.round(num(v(col.zeit))*col.zf*100)/100 : 0;
      out.push({typ:'P',pos,bez:bez.split('\n')[0],menge:num(v(col.menge))||0,me,in_liste:vis?1:0,zeit:z>0?z:null}); }
    else if(/^text/i.test(typ) && started){ const first=bez.split('\n')[0].trim(); if(first && first.length<=70) out.push({typ:'X',bez:first}); }
  }
  if(!out.some(o=>o.typ==='P')) throw new Error('Keine Positionen gefunden (Spalte A muss „Position“ enthalten)');
  return out;
}
route();
