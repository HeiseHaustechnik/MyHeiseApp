<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>Heise Projekte</title>
<link rel="stylesheet" href="lib/heise-ui.css">
<style>
.pagehead{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
.pagehead h1{font-size:24px;font-weight:770;overflow-wrap:anywhere}
.pagehead small{display:block;color:var(--ink-3);font-size:13px;font-weight:600;margin-top:2px}
.form-b{padding:0 0 4px}
.form-b .field{margin-bottom:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.delbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.delbtn:active{background:var(--red-bg);color:var(--red)}
.kv{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
input[type=file].inp{padding:12px 14px}
.eyebtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3);flex:0 0 auto}
.eyebtn:active{background:var(--surface-2)}
.row-card.aus{opacity:.55}
.chk{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.chk b{display:block;font-size:14.5px}
.emrow{display:grid;grid-template-columns:1fr 1fr 110px 40px;gap:8px;align-items:end;margin-bottom:8px}
@media(max-width:560px){.emrow{grid-template-columns:1fr 1fr 40px}.emrow .er{grid-column:1/3}}
.emrow .field{margin:0}
.btn.danger{color:var(--red)}
.btn.danger:active{background:var(--red-bg)}
.fold-b .sep{border-top:1px solid var(--line);margin:16px 0 12px}
</style>
</head>
<body>
<header class="topbar">
  <a href="../index.html" class="brand" title="Zur My Heise App"><div class="lt"><img src="lib/heise-logo.svg" alt="Heise Haustechnik"></div><div style="min-width:0"><b>Heise Projekte</b><small>Aufmaß · Bautagebuch</small></div></a>
</header>
<main class="shell" id="app"><div class="empty">Lädt …</div></main>
<div class="toast" id="toast"></div>
<script src="lib/heise-icons.js"></script>
<script src="lib/pj-api.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dDE=d=>d?new Date(d).toLocaleDateString('de-DE'):'';
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2200); }
const api=(path,opt={})=>PJ.api(path,opt);
function route(){ const m=location.hash.match(/^#p=(.+)$/); window.scrollTo(0,0); m? showProjekt(m[1]) : showListe(); }
window.addEventListener('hashchange',route);
const plural=(n,a,b)=>n+' '+(n==1?a:b);

/* ---------- Startseite ---------- */
async function showListe(){
  const app=$('#app');
  let list=[];
  try{ list=await api('projekte'); }catch(e){ app.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  const h=new Date().getHours(), gruss=h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend';
  const aktiv=list.filter(p=>p.status!=='archiv');
  // „Meine Projekte“: eigene Einstellung zuerst, sonst zugeordnet bzw. ohne Team (Bauleitung sieht standardmäßig alle)
  const mein=p=>p.status!=='archiv' && (p.ansicht===true || (p.ansicht!==false && (PJ.leitung() || p.meins || !p.team_n)));
  let modus='meine'; try{ modus=localStorage.getItem('pj_modus')||'meine'; }catch(e){}
  const zeig=modus==='alle'? list : list.filter(mein);
  app.innerHTML=`
    <section class="hero">
      <div><div class="ey">${gruss}</div><h1>Projekte</h1></div>
      <div class="logo-tile"><img src="lib/heise-logo.svg" alt="Heise Haustechnik"></div>
      <p>${plural(aktiv.length,'aktives Projekt','aktive Projekte')} · Aufmaße erfassen, prüfen und unterschreiben lassen.</p>
    </section>
    <div class="segc" style="margin:18px 0 6px"><button data-modus="meine" class="${modus==='meine'?'on':''}">Meine Projekte (${list.filter(mein).length})</button><button data-modus="alle" class="${modus==='alle'?'on':''}">Alle (${list.length})</button></div>
    <p class="hint" style="margin:0 0 12px">Mit dem Auge blendest du ein Projekt für dich ein oder aus. Unter „Alle“ findest du jederzeit jedes Projekt, auch archivierte.</p>
    ${zeig.length? zeig.map(p=>`<a class="row-card${mein(p)?'':' aus'}" href="#p=${p.id}">
        <div class="mi tone-brand">${IC('building')}</div>
        <div class="mt"><b>${esc(p.name)}</b><small>${esc([p.nr,p.adresse].filter(Boolean).join(' · '))}</small>
          <div class="tags"><span class="pill tone-blue">${plural(p.anz_aufmasse,'Aufmaß','Aufmaße')}</span><span class="pill tone-gray">${p.anz_lv} LV-Positionen</span>${p.meins?'<span class="pill tone-ok"><i></i>zugeordnet</span>':''}${p.status==='archiv'?'<span class="pill tone-gray">archiviert</span>':mein(p)?'':'<span class="pill tone-gray">ausgeblendet</span>'}</div></div>
        <button class="eyebtn" data-eye="${p.id}" data-on="${mein(p)?1:0}" title="${mein(p)?'Für mich ausblenden':'Für mich einblenden'}" aria-label="${mein(p)?'Für mich ausblenden':'Für mich einblenden'}">${IC(mein(p)?'eye':'eyeoff')}</button>
        <span class="chev">${IC('chev')}</span></a>`).join('')
      : list.length? `<div class="empty">${IC('eyeoff')}<div>In deiner Ansicht sind gerade keine Projekte. Unter „Alle“ kannst du Projekte mit dem Auge einblenden.</div></div>`
      :`<div class="empty">${IC('building')}<div>Noch keine Projekte angelegt.</div></div>`}
    <div class="sec-title nur-leitung">Verwaltung</div>
    <details class="fold nur-leitung"><summary>${IC('plus')}Neues Projekt anlegen</summary><div class="fold-b">
      <div class="row2"><div class="field"><label>Projekt-Nr.</label><input class="inp" id="np_nr"></div><div class="field"><label>Name *</label><input class="inp" id="np_name"></div></div>
      <div class="field"><label>Adresse</label><input class="inp" id="np_adr"></div>
      <button class="btn cta block" id="np_ok">Projekt anlegen</button>
      <p class="hint" style="margin-top:10px">Das LV wird danach im Projekt aus der Kalkulations-Excel importiert.</p></div></details>
    <details class="fold nur-leitung"><summary>${IC('upload')}Projekt aus Importdatei anlegen</summary><div class="fold-b">
      <p class="hint" style="margin-bottom:10px">Für vorbereitete Projektdateien mit LV, Bereichen und Vorschlägen (.json).</p>
      <div class="field"><input type="file" class="inp" id="imp_f" accept=".json,application/json"></div>
      <button class="btn block" id="imp_ok">Importieren</button><div id="imp_msg"></div></div></details>
    <details class="fold nur-admin"><summary>${IC('upload')}Daten aus der alten Projekte-Seite übernehmen</summary><div class="fold-b">
      <p class="hint" style="margin-bottom:10px">Einmalig: die Datei <b>daten-uebernahme.json</b> wählen. Sie enthält alle Projekte, LVs, Aufmaße und Bautagebücher der alten Seite. Kann gefahrlos wiederholt werden, nichts wird doppelt angelegt.</p>
      <div class="field"><input type="file" class="inp" id="mig_f" accept=".json,application/json"></div>
      <button class="btn block" id="mig_ok">Daten übernehmen</button><div id="mig_msg"></div></div></details>
    <p class="hint" style="text-align:center;margin-top:30px">Heise Haustechnik GmbH &amp; Co. KG · Braunlage</p>`;
  document.querySelectorAll('[data-modus]').forEach(b=>b.onclick=()=>{ try{ localStorage.setItem('pj_modus',b.dataset.modus); }catch(e){} showListe(); });
  document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=async ev=>{ ev.preventDefault(); ev.stopPropagation();
    const an=b.dataset.on!=='1'; b.disabled=true;
    try{ await api('projekte/'+b.dataset.eye+'/ansicht',{method:'PUT',body:JSON.stringify({sichtbar:an})}); toast(an?'Projekt eingeblendet':'Projekt ausgeblendet'); showListe(); }
    catch(e){ toast(e.message); b.disabled=false; } });
  $('#mig_ok').onclick=migration;
  $('#np_ok').onclick=async()=>{ const name=$('#np_name').value.trim(); if(!name) return toast('Bitte einen Namen eintragen');
    try{ const r=await api('projekte',{method:'POST',body:JSON.stringify({nr:$('#np_nr').value.trim(),name,adresse:$('#np_adr').value.trim()})}); location.hash='#p='+r.id; }catch(e){ toast(e.message); } };
  $('#imp_ok').onclick=async()=>{ const f=$('#imp_f').files[0]; if(!f) return toast('Bitte eine Datei wählen');
    const b=$('#imp_ok'); b.disabled=true; b.textContent='Importiere …';
    try{ const d=JSON.parse(await f.text()); const r=await api('import',{method:'POST',body:JSON.stringify(d)}); location.hash='#p='+r.projekt_id; }
    catch(e){ $('#imp_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; b.disabled=false; b.textContent='Importieren'; } };
}

/* ---------- Einmalige Datenübernahme (nur Admin) ---------- */
async function migration(){
  const f=$('#mig_f').files[0]; if(!f) return toast('Bitte die Datei daten-uebernahme.json wählen');
  const b=$('#mig_ok'), msg=$('#mig_msg'); b.disabled=true; b.textContent='Spiele Daten ein …';
  try{
    const d=JSON.parse(await f.text());
    const x=await api('migration',{method:'POST',body:JSON.stringify(d)});
    msg.innerHTML=`<p style="margin-top:10px">Fertig: ${x.projekte} Projekte, ${x.aufmasse} Aufmaße mit ${x.eintraege} Einträgen, ${x.bautagebuch} Bautagebuch-Einträge, ${x.fotos} Fotos.</p>`;
    b.textContent='Erneut übernehmen'; b.disabled=false; setTimeout(route,1800);
  }catch(e){ msg.innerHTML=`<div class="err">${esc(e.message)}</div>`; b.disabled=false; b.textContent='Daten übernehmen'; }
}

/* ---------- Projekt ---------- */
async function showProjekt(id){
  const app=$('#app');
  let d, am;
  let bt=[];
  try{ [d,am,bt]=await Promise.all([api('projekte/'+id),api('projekte/'+id+'/aufmasse'),api('projekte/'+id+'/bautagebuch').catch(()=>[])]); }catch(e){ app.innerHTML=`<div class="err">${esc(e.message)}</div><a class="btn ghost" href="#">Zurück</a>`; return; }
  const p=d.projekt;
  const nP=d.lv.filter(o=>o.typ==='P').length, nL=d.lv.filter(o=>o.typ==='P'&&o.in_liste).length;
  const offen=am.reduce((a,x)=>a+(x.anz_ungeprueft||0),0);
  app.innerHTML=`
    <div class="pagehead"><a class="iconbtn" href="#" aria-label="Zurück">${IC('back')}</a><div style="min-width:0"><h1>${esc(p.name)}</h1><small>${esc([p.nr,p.adresse].filter(Boolean).join(' · '))}${p.status==='archiv'?' · archiviert':''}</small></div></div>
    <div class="apps">
      <button class="app" style="--g1:#4a5a7a;--g2:#2f3b53" onclick="document.getElementById('amList').scrollIntoView({behavior:'smooth'})">
        ${offen?`<span class="app-n">${offen}</span>`:''}<div class="app-ico">${IC('ruler')}</div><div><b>Aufmaß</b><span>${plural(am.length,'Aufmaß','Aufmaße')} · ${nP} LV-Positionen</span></div></button>
      <a class="app" href="bautagebuch.html?p=${id}" style="--g1:#e8742f;--g2:#c94a03">${bt.some(x=>x.datum===new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10))?'':'<span class="app-n">!</span>'}<div class="app-ico">${IC('book')}</div><div><b>Bautagebuch</b><span>${plural(bt.length,'Eintrag','Einträge')} · ${bt.length&&bt[0]?'zuletzt '+dDE(bt[0].datum):'noch leer'}</span></div></a>
    </div>
    <div class="sec-title" id="amList">Aufmaße</div>
    ${am.length? am.map(a=>`<div class="row-card" onclick="location.href='aufmass.html?id=${a.id}'">
        <div class="mi tone-${a.unterschrieben?'ok':'brand'}">${IC(a.unterschrieben?'check':'clip')}</div>
        <div class="mt"><b>${esc(a.bez)}</b><small>${dDE(a.datum)}${a.monteur?' · '+esc(a.monteur):''}</small>
          <div class="tags"><span class="pill tone-gray">${plural(a.anz_eintraege,'Eintrag','Einträge')}</span>${a.anz_ungeprueft?`<span class="pill tone-amber"><i></i>${a.anz_ungeprueft} ungeprüft</span>`:''}${a.unterschrieben?'<span class="pill tone-ok"><i></i>unterschrieben</span>':''}</div></div>
        <button class="delbtn nur-leitung" title="Löschen" onclick="event.stopPropagation();delAufmass('${a.id}','${esc(a.bez).replace(/'/g,'')}')">${IC('trash','sm')}</button>
        <span class="chev">${IC('chev')}</span></div>`).join('')
      :`<div class="empty">${IC('clip')}<div>Noch kein Aufmaß angelegt.</div></div>`}
    <details class="fold" style="margin-top:12px"><summary>${IC('plus')}Neues Aufmaß</summary><div class="fold-b">
      <div class="field"><label>Bezeichnung *</label><input class="inp" id="na_bez" placeholder="z. B. Aufmaß 2 – Trinkwasser OG"></div>
      <div class="row2"><div class="field"><label>Datum</label><input class="inp" type="date" id="na_dat" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Monteur</label><input class="inp" id="na_mon"></div></div>
      <button class="btn cta block" id="na_ok" ${nP?'':'disabled'}>Anlegen und öffnen</button>${nP?'':'<p class="hint">Zuerst das LV importieren.</p>'}</div></details>
    <div class="sec-title nur-leitung">Projekt</div>
    <details class="fold nur-leitung"><summary>${IC('edit')}Projektdaten bearbeiten</summary><div class="fold-b">
      <div class="row2"><div class="field"><label>Projekt-Nr.</label><input class="inp" id="ep_nr" value="${esc(p.nr)}"></div><div class="field"><label>Name *</label><input class="inp" id="ep_name" value="${esc(p.name)}"></div></div>
      <div class="field"><label>Adresse</label><input class="inp" id="ep_adr" value="${esc(p.adresse)}"></div>
      <button class="btn cta block" id="ep_ok">Speichern</button>
      <div class="sep"></div>
      <p class="hint" style="margin-bottom:10px">${p.status==='archiv'?'Das Projekt ist archiviert. Es erscheint nicht mehr unter „Meine Projekte“, nur noch unter „Alle“.':'Abgeschlossene Projekte archivieren: Sie verschwinden aus „Meine Projekte“, alle Daten bleiben erhalten.'}</p>
      <button class="btn ghost block" id="ep_arch">${p.status==='archiv'?'Wieder aktivieren':'Projekt archivieren'}</button>
      <div class="sep"></div>
      <p class="hint" style="margin-bottom:10px">${am.length||bt.length?`Das Projekt enthält ${plural(am.length,'Aufmaß','Aufmaße')} und ${plural(bt.length,'Bautagebuch-Eintrag','Bautagebuch-Einträge')}. Löschen kann es nur ein Admin, alle Daten gehen dabei endgültig verloren. Besser archivieren.`:'Das Projekt ist noch leer und kann gelöscht werden.'}</p>
      <button class="btn ghost block danger ${am.length||bt.length?'nur-admin':''}" id="ep_del">${IC('trash','sm')}Projekt löschen</button></div></details>
    <div class="sec-title nur-leitung">Team und Empfänger</div>
    <details class="fold nur-leitung" id="teamFold"><summary>${IC('users')}Team (wer sieht das Projekt unter „Meine Projekte“)</summary><div class="fold-b" id="teamBox"><p class="hint">Lädt …</p></div></details>
    <details class="fold nur-leitung"><summary>${IC('mail')}E-Mail-Empfänger für Bautagebücher (${empfListe(p).length})</summary><div class="fold-b">
      <p class="hint" style="margin-bottom:10px">Diese Adressen stehen beim Senden eines Bautagebuchs zur Auswahl, z. B. Bauherr, Architekt oder Planungsbüro.</p>
      <div id="emList"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn ghost sm" id="emAdd">${IC('plus','sm')}Empfänger hinzufügen</button><button class="btn cta sm" id="emSave">Speichern</button></div></div></details>
    <div class="sec-title nur-leitung">Leistungsverzeichnis</div>
    <details class="fold nur-leitung"><summary>${IC('sheet')}${nP? `${nP} Positionen · ${nL} in der Aufmaß-Liste` : 'Noch kein LV importiert'}</summary><div class="fold-b">
      <p class="hint" style="margin-bottom:10px">LV aus der Kalkulations-Excel, dem Addison-Export (.xlsx, .xls) oder dem pds-Export „pds XML ohne Anhang“ (.xml) importieren${nP?', ersetzt das bestehende':''}. Erwartet die Spalten Typ (Los / Titel / Text-Pos. / Position), Pos.-Nr., Bezeichnung, Menge, ME. Ausgeblendete Zeilen landen im „Gesamten LV“, sichtbare in der „Aufmaß-Liste“. Eine Spalte „Zeit“ (Minuten je Einheit) wird als Soll-Zeit für das Team übernommen, Preise nicht.</p>
      <div class="field"><input type="file" class="inp" id="lv_f" accept=".xlsx,.xls,.xml"></div><div id="lv_sheet" class="field"></div><div id="lv_msg"></div></div></details>`;
  $('#na_ok').onclick=async()=>{ const bez=$('#na_bez').value.trim(); if(!bez) return toast('Bitte eine Bezeichnung eintragen');
    try{ const r=await api('projekte/'+id+'/aufmasse',{method:'POST',body:JSON.stringify({bez,datum:$('#na_dat').value,monteur:$('#na_mon').value.trim()})}); location.href='aufmass.html?id='+r.id; }catch(e){ toast(e.message); } };
  $('#lv_f').onchange=()=>lvImport(id);
  if(PJ.leitung()){ teamSetup(id); empfSetup(id,p); projektSetup(id,p,am.length+bt.length>0); }
}
/* ---------- Team (nur Ansicht, keine Sperre) ---------- */
function teamSetup(pid){
  const fold=$('#teamFold'); let geladen=false;
  fold.addEventListener('toggle',async()=>{ if(!fold.open||geladen) return; geladen=true;
    const box=$('#teamBox');
    try{
      const t=await api('projekte/'+pid+'/team');
      box.innerHTML=(t.length? t.map(u=>`<label class="chk"><input type="checkbox" value="${esc(u.id)}" ${u.zugeordnet?'checked':''}><b>${esc(u.name)}</b></label>`).join('') : '<p class="hint">Noch niemand hat Zugriff auf das Modul Projekte.</p>')
        +`<p class="hint" style="margin:10px 0">Zugeordnete Personen sehen das Projekt unter „Meine Projekte“. Ohne Zuordnung sehen alle das Projekt. Über „Alle“ bleibt jedes Projekt erreichbar.</p><button class="btn cta sm" id="teamSave">Team speichern</button>`;
      if(t.length) $('#teamSave').onclick=async()=>{ const ids=[...box.querySelectorAll('input:checked')].map(c=>c.value);
        try{ await api('projekte/'+pid+'/team',{method:'PUT',body:JSON.stringify(ids)}); toast('Team gespeichert'); }catch(e){ toast(e.message); } };
      else $('#teamSave').remove();
    }catch(e){ box.innerHTML=`<div class="err">${esc(e.message)}</div>`; geladen=false; }
  });
}
/* ---------- E-Mail-Empfänger für Bautagebücher ---------- */
function empfListe(p){ try{ const a=JSON.parse(p.empfaenger||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function empfSetup(pid,p){
  let L=empfListe(p).map(x=>({name:x.name||'',email:x.email||'',rolle:x.rolle||''}));
  const draw=()=>{ $('#emList').innerHTML=L.length? L.map((r,i)=>`<div class="emrow">
      <div class="field"><label>Name / Firma</label><input class="inp" data-i="${i}" data-k="name" value="${esc(r.name)}" placeholder="z. B. Landkreis Göttingen"></div>
      <div class="field"><label>E-Mail *</label><input class="inp" type="email" data-i="${i}" data-k="email" value="${esc(r.email)}" placeholder="name@firma.de"></div>
      <div class="field er"><label>Rolle</label><input class="inp" data-i="${i}" data-k="rolle" value="${esc(r.rolle)}" placeholder="Bauherr" list="emRollen"></div>
      <button class="delbtn" data-del="${i}" title="Entfernen">${IC('trash','sm')}</button></div>`).join('')+`<datalist id="emRollen"><option>Bauherr</option><option>Architekt</option><option>Planungsbüro</option><option>Bauleitung</option><option>Projektsteuerung</option></datalist>`
      : '<p class="hint">Noch keine Empfänger eingetragen.</p>';
    document.querySelectorAll('#emList [data-k]').forEach(el=>el.oninput=()=>{ L[+el.dataset.i][el.dataset.k]=el.value; });
    document.querySelectorAll('#emList [data-del]').forEach(b=>b.onclick=()=>{ L.splice(+b.dataset.del,1); draw(); }); };
  draw();
  $('#emAdd').onclick=()=>{ L.push({name:'',email:'',rolle:''}); draw(); const x=document.querySelectorAll('#emList [data-k="name"]'); x[x.length-1].focus(); };
  $('#emSave').onclick=async()=>{
    const out=L.map(r=>({name:r.name.trim(),email:r.email.trim(),rolle:r.rolle.trim()})).filter(r=>r.name||r.email);
    const bad=out.find(r=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)); if(bad) return toast('Bitte eine gültige E-Mail-Adresse eintragen'+(bad.name?' ('+bad.name+')':''));
    try{ await api('projekte/'+pid,{method:'PUT',body:JSON.stringify({empfaenger:out})}); L=out; draw(); toast('Empfänger gespeichert'); }catch(e){ toast(e.message); } };
}
/* ---------- Projektdaten, Archiv, Löschen ---------- */
function projektSetup(id,p,hatDaten){
  $('#ep_ok').onclick=async()=>{ const name=$('#ep_name').value.trim(); if(!name) return toast('Bitte einen Namen eintragen');
    try{ await api('projekte/'+id,{method:'PUT',body:JSON.stringify({nr:$('#ep_nr').value.trim(),name,adresse:$('#ep_adr').value.trim()})}); toast('Projektdaten gespeichert'); route(); }catch(e){ toast(e.message); } };
  $('#ep_arch').onclick=async()=>{ const neu=p.status==='archiv'?'aktiv':'archiv';
    try{ await api('projekte/'+id,{method:'PUT',body:JSON.stringify({status:neu})}); toast(neu==='archiv'?'Projekt archiviert':'Projekt wieder aktiv'); route(); }catch(e){ toast(e.message); } };
  $('#ep_del').onclick=async()=>{
    let body={};
    if(hatDaten){
      const ein=prompt(`Achtung: Alle Aufmaße, Bautagebuch-Einträge, Fotos und das LV von „${p.name}“ werden endgültig gelöscht.\n\nZur Bestätigung den Projektnamen genau eintragen:`);
      if(ein===null) return;
      if(ein.trim()!==p.name) return toast('Der Name stimmt nicht, nichts gelöscht');
      body={bestaetigung:p.name};
    } else if(!confirm(`Projekt „${p.name}“ löschen?`)) return;
    try{ await api('projekte/'+id,{method:'DELETE',body:JSON.stringify(body)}); toast('Projekt gelöscht'); location.hash=''; }catch(e){ toast(e.message); } };
}
async function delAufmass(id,bez){
  if(!confirm(`Aufmaß „${bez}“ mit allen Einträgen endgültig löschen?`)) return;
  try{ await api('aufmasse/'+id,{method:'DELETE'}); route(); toast('Aufmaß gelöscht'); }catch(e){ toast(e.message); }
}

/* ---------- LV-Import aus Excel ---------- */
function loadScript(src,test,name){ return test()? Promise.resolve() : new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error(name+' konnte nicht geladen werden')); document.head.appendChild(s); }); }
const loadExcelJS=()=>loadScript('lib/exceljs.min.js',()=>window.ExcelJS,'ExcelJS');
const loadSheetJS=()=>loadScript('lib/xlsx.core.min.js',()=>window.XLSX,'SheetJS');
const cellVal=v=>{ if(v==null) return ''; if(typeof v==='object'){ if('result' in v) return v.result??''; if(v.richText) return v.richText.map(t=>t.text).join(''); if(v.text) return v.text; } return v; };
/* Liest .xlsx (ExcelJS) und alte .xls-Exporte, z. B. aus Addison (SheetJS).
   Ergebnis je Blatt: Zeilen {v:[Rohwerte], t:[Text], hidden} mit Spalten ab Index 1 wie in Excel. */
async function readSheets(f){
  const buf=await f.arrayBuffer();
  if(/\.xlsx$/i.test(f.name)){
    await loadExcelJS(); const wb=new ExcelJS.Workbook(); await wb.xlsx.load(buf);
    return wb.worksheets.map(ws=>({name:ws.name,rows:()=>{ const out=[]; for(let r=1;r<=ws.rowCount;r++){ const row=ws.getRow(r), v=[''], t=['']; for(let c=1;c<=Math.max(ws.columnCount,row.cellCount);c++){ const cell=row.getCell(c); const x=cellVal(cell.value); v.push(x); let tx=''; try{ tx=cell.text; }catch(e){} t.push(String(tx||x||'')); } out.push({v,t,hidden:!!row.hidden}); } return out; }}));
  }
  await loadSheetJS(); const wb=XLSX.read(new Uint8Array(buf),{type:'array',cellStyles:true});
  return wb.SheetNames.map(n=>({name:n,rows:()=>{ const ws=wb.Sheets[n]; if(!ws['!ref']) return []; const R=XLSX.utils.decode_range(ws['!ref']), meta=ws['!rows']||[], out=[];
    for(let r=R.s.r;r<=R.e.r;r++){ const v=[''], t=['']; for(let c=0;c<=R.e.c;c++){ const cell=ws[XLSX.utils.encode_cell({r,c})]; v.push(cell?cell.v:''); t.push(cell?String(cell.w!=null?cell.w:cell.v):''); } out.push({v,t,hidden:!!(meta[r]&&meta[r].hidden)}); }
    return out; }}));
}
/* pds-Export „pds XML (XML ohne Anhang)“: Export > Auftrag (o. ä.) > EbenenListe > Ebene (Los) > Ebene (Titel) > PositionenListe > Position.
   Positionen vom Typ TEXT (ohne Nummer) werden zu Zwischenüberschriften. Lohnzeit steht je Einheit in Sekunden
   (geprüft an FTZ: 3000 = 50 min laut Kalkulation) und wird in Minuten übernommen. Preise werden ignoriert.
   Alle Positionen kommen in die Aufmaß-Liste, weil pds keine ausgeblendeten Zeilen kennt. */
function parsePdsXml(txt){
  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('Die XML-Datei ist nicht lesbar');
  const kids=(e,n)=>e?[...e.children].filter(c=>c.localName===n):[], kid=(e,n)=>kids(e,n)[0], tx=(e,n)=>{ const c=kid(e,n); return c?c.textContent.trim():''; };
  const root=doc.documentElement, vorgang=[...root.children].find(c=>kid(c,'EbenenListe'));
  if(!vorgang) throw new Error('Keine pds-Vorgangsdatei: „EbenenListe“ nicht gefunden. Bitte in pds „Export pds XML (XML ohne Anhang)“ verwenden.');
  const out=[];
  const posListe=e=>{ for(const P of kids(kid(e,'PositionenListe'),'Position')){
      const nr=tx(P,'Nummer'), kurz=tx(P,'Kurztext').split(/\r?\n/)[0].trim();
      if(tx(P,'Typ')==='TEXT' || !nr){ if(kurz) out.push({typ:'X',bez:kurz.length>70? kurz.slice(0,67).replace(/\s+\S*$/,'')+' …' : kurz}); continue; }
      let me=tx(P,'Masseinheit'); if(/^st/i.test(me)) me='Stck'; if(me==='M') me='m';
      const lz=parseFloat(tx(P,'Lohnzeit'))||0, z=Math.round(lz/60*100)/100;
      out.push({typ:'P',pos:nr,bez:kurz||tx(P,'Name'),menge:parseFloat(tx(P,'Menge'))||0,me,in_liste:1,zeit:z>0?z:null}); } };
  const ebene=(E,prefix)=>{
    const nr=[prefix,tx(E,'Nummer')].filter(Boolean).join('.'), bez=tx(E,'Bezeichnung').split(/\r?\n/)[0].trim(), unter=kids(E,'Ebene');
    if(unter.length){ out.push({typ:'L',pos:nr,bez}); unter.forEach(u=>ebene(u,nr)); if(kids(kid(E,'PositionenListe'),'Position').length){ out.push({typ:'T',pos:nr,bez:bez+' (weitere Positionen)'}); posListe(E); } }
    else { out.push({typ:'T',pos:nr,bez}); posListe(E); }
  };
  kids(kid(vorgang,'EbenenListe'),'Ebene').forEach(E=>ebene(E,''));
  if(!out.some(o=>o.typ==='P')) throw new Error('Keine Positionen in der pds-Datei gefunden');
  return {lv:out, info:{nr:tx(vorgang,'Nummer'), bez:tx(vorgang,'Bezeichnung')}};
}
async function lvImport(pid){
  const f=$('#lv_f').files[0]; if(!f) return;
  $('#lv_msg').innerHTML='<p class="hint">Lese Datei …</p>';
  try{
    if(!/\.(xlsx|xls|xml)$/i.test(f.name)) throw new Error('Bitte eine Excel-Datei (.xlsx, .xls) oder einen pds-Export (.xml) wählen');
    if(/\.xml$/i.test(f.name)){ const {lv,info}=parsePdsXml(await f.text()); $('#lv_sheet').innerHTML=''; zeigLV(pid,lv,`pds-Vorgang ${info.nr} ${info.bez}`.trim()); return; }
    const sheets=await readSheets(f), names=sheets.map(w=>w.name);
    $('#lv_sheet').innerHTML=`<label>Blatt</label><select class="inp" id="lv_ws">${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select>`;
    const upd=()=>{ try{ zeigLV(pid,parseLV(sheets.find(w=>w.name===$('#lv_ws').value).rows()),''); }catch(e){ $('#lv_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; } };
    $('#lv_ws').onchange=upd;
    let pref=names.findIndex(n=>/aufma/i.test(n)); if(pref<0) pref=0; $('#lv_ws').selectedIndex=pref;
    upd();
  }catch(e){ $('#lv_msg').innerHTML=`<div class="err">${esc(e.message)}</div>`; }
}
function zeigLV(pid,r,quelle){
        window._lv=r;
        const P=r.filter(o=>o.typ==='P'), mitZeit=P.filter(o=>o.zeit>0), h=P.reduce((a,o)=>a+(o.zeit||0)*(o.menge||0),0)/60;
        $('#lv_msg').innerHTML=`${quelle?`<p class="hint" style="margin-bottom:4px">${esc(quelle)}</p>`:''}<p>${P.length} Positionen erkannt, davon ${P.filter(o=>o.in_liste).length} sichtbar (Aufmaß-Liste), ${r.filter(o=>o.typ==='L').length?r.filter(o=>o.typ==='L').length+' Lose, ':''}${r.filter(o=>o.typ==='T').length} Titel.</p>
          <p class="hint" style="margin-top:4px">${mitZeit.length?`Zeiten übernommen: ${mitZeit.length} Positionen, zusammen ${h.toLocaleString('de-DE',{maximumFractionDigits:1})} h. Sie sind nur im Aufmaß für das Team sichtbar, nicht im PDF und nicht bei der Unterschrift.`:'Keine Zeit-Spalte gefunden, das LV wird ohne Zeiten übernommen.'} Preise werden nicht übernommen.</p>
          <button class="btn cta block" id="lv_ok" style="margin-top:10px">LV übernehmen</button>`;
        $('#lv_ok').onclick=async()=>{ $('#lv_ok').disabled=true; try{ await api('projekte/'+pid+'/lv',{method:'PUT',body:JSON.stringify(window._lv)}); route(); }catch(e){ alert(e.message); $('#lv_ok').disabled=false; } };
}
/* Spalten über die Kopfzeile finden: Typ (Spalte A), Pos.-Nr., Bezeichnung, Menge, ME,
   dazu die Zeit je Einheit: „Zeit in min pro Stück“ (pds/Kalkulation), „Zeit“ (Addison, Minuten)
   oder „Zeit in h pro Stück“ (wird in Minuten umgerechnet). Preise werden ignoriert. */
function parseLV(rows){
  let hr=-1, col={};
  for(let r=0;r<Math.min(20,rows.length);r++){
    const vals=rows[r].t.map(v=>String(v).trim().toLowerCase());
    const pi=vals.findIndex(v=>v.startsWith('pos')), bi=vals.findIndex(v=>v.startsWith('bezeichnung'));
    if(pi>0&&bi>0){
      const jeEinheit=v=>/^zeit/.test(v) && /\b(pro|je)\b/.test(v) && !/gesamt/.test(v);
      let zi=vals.findIndex(v=>jeEinheit(v) && /\bmin\b/.test(v)), zf=1;
      if(zi<0) zi=vals.findIndex(v=>v==='zeit');
      if(zi<0){ zi=vals.findIndex(v=>jeEinheit(v) && /\bh\b/.test(v)); zf=60; }
      hr=r; col={pos:pi,bez:bi,menge:vals.findIndex(v=>v==='menge'),me:vals.findIndex(v=>v==='me'),typ:1,zeit:zi,zf}; break; }
  }
  if(hr<0) throw new Error('Kopfzeile mit „Pos.-Nr.“ und „Bezeichnung“ nicht gefunden');
  const num=x=>{ if(typeof x==='number') return x; const n=Number(String(x).replace(/\./g,'').replace(',','.')); return isFinite(n)?n:0; };
  const out=[]; let started=false;
  for(let r=hr+1;r<rows.length;r++){
    const row=rows[r]; const t=c=>c>0?String(row.t[c]??'').trim():'', v=c=>c>0?row.v[c]:'';
    const typ=t(col.typ), pos=t(col.pos).replace(/\.$/,''), bez=t(col.bez);
    const vis=!row.hidden;
    if(typ==='Los'){ started=true; out.push({typ:'L',pos,bez}); }
    else if(typ==='Titel'){ out.push({typ:'T',pos,bez:bez.split('\n')[0]}); }
    else if(typ==='Position'){ let me=t(col.me); if(/^st/i.test(me)) me='Stck'; if(me==='M') me='m';
      const z=col.zeit>0? Math.round(num(v(col.zeit))*col.zf*100)/100 : 0;
      out.push({typ:'P',pos,bez:bez.split('\n')[0],menge:num(v(col.menge))||0,me,in_liste:vis?1:0,zeit:z>0?z:null}); }
    else if(/^text/i.test(typ) && started){ const first=bez.split('\n')[0].trim(); if(first && first.length<=70) out.push({typ:'X',bez:first}); }
  }
  if(!out.some(o=>o.typ==='P')) throw new Error('Keine Positionen gefunden (Spalte A muss „Position“ enthalten)');
  return out;
}
route();
