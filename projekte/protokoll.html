<style>

@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.nrbox{display:grid;place-items:center;min-width:58px;height:52px;padding:0 8px;border-radius:15px;background:var(--surface-2);color:var(--brand);flex:0 0 auto;line-height:1.05;text-align:center}
.nrbox b{font-size:15px;font-weight:800}
.nrbox small{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--ink-3)}
.row-card .mt .desc{display:block;font-size:13px;color:var(--ink-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ov{position:fixed;inset:0;background:rgba(8,13,21,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 20px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto;box-shadow:0 -24px 70px -20px rgba(0,0,0,.5);max-height:88vh;overflow:auto}

.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

.pfl{color:var(--accent)}

.t-bar{height:8px;border-radius:4px;background:var(--surface-2);margin:10px 0 8px;overflow:hidden}.t-bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}

.fotos2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}

.warncard{background:var(--amber-bg);box-shadow:none}.warncard h2{display:flex;align-items:center;gap:8px;color:var(--ink)}

.li-bem{min-height:40px;margin:0 0 6px 34px;width:calc(100% - 34px);font-size:14px}

<body>
<header class="topbar">
  <a href="index.html" class="iconbtn" id="backBtn" aria-label="Zurück"></a>
  <div class="brand"><div class="lt"><img src="lib/heise-logo.svg" alt="Heise Haustechnik"></div><div style="min-width:0"><b id="hTitle">Protokolle</b><small id="hSub"></small></div></div>
  <span class="sync" id="syncState"></span>
</header>
<main class="shell" id="app"><div class="empty">Lädt …</div></main>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="lib/heise-icons.js"></script>
<script src="lib/pj-api.js"></script>
<script src="lib/pj-shell.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script>
/* =====================================================================
   Protokolle (PR-001 …): Vorlage wählen, Schritt für Schritt erfassen,
   unterschreiben, PDF erzeugen und senden. Daten über die RPC pj_pr
   (supabase/protokolle.sql). Vorlagen kommen als Daten aus pj_vorlagen.
   Offline wird lokal gespeichert (Protokolle im localStorage, Fotos und
   Diagramme in IndexedDB) und später übertragen.
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const nowIso=()=>new Date().toISOString();
const todayIso=()=>{ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const dDE=d=>d?new Date(d+'T12:00').toLocaleDateString('de-DE'):'';
const tsDE=t=>t?new Date(t).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'';
const uhr=t=>t?new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):'';
const num=v=>{ if(typeof v==='number') return v; const n=parseFloat(String(v??'').replace(',','.')); return isFinite(n)?n:NaN; };
const nfmt=v=>{ const n=num(v); return isFinite(n)?n.toLocaleString('de-DE',{maximumFractionDigits:3}):''; };
const prNr=n=>n?'PR-'+String(n).padStart(3,'0'):'PR neu';
const mmss=s=>{ s=Math.max(0,Math.floor(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2600); }
const ls={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const api=(path,opt={})=>PJ.api(path,opt);
const pr=(path,opt={})=>PJ.pr(path,opt);
const Q=new URLSearchParams(location.search);
const PID=Q.get('p');
let PROJ=null, INFO={}, VORL=[], PL=[], D=null, FILES=[], STEP=0;
const K={proj:'pr_proj_'+PID, info:'pr_info_'+PID, vorl:'pr_vorlagen', pl:'pr_list_'+PID, queue:'pr_queue', doc:id=>'pr_doc_'+id, step:id=>'pr_step_'+id};

/* ================= Dateien (IndexedDB) ================= */
const IDB={ db:null,
  open(){ if(this.db) return Promise.resolve(this.db); return new Promise((ok,err)=>{ const r=indexedDB.open('heise_protokolle',1); r.onupgradeneeded=()=>{ r.result.createObjectStore('files',{keyPath:'id'}); }; r.onsuccess=()=>{ this.db=r.result; ok(this.db); }; r.onerror=()=>err(r.error); }); },
  async tx(mode,fn){ const db=await this.open(); return new Promise((ok,err)=>{ const t=db.transaction('files',mode), s=t.objectStore('files'); const res=fn(s); t.oncomplete=()=>ok(res&&res.result!==undefined?res.result:res); t.onerror=()=>err(t.error); }); },
  put(rec){ return this.tx('readwrite',s=>s.put(rec)); },
  del(id){ return this.tx('readwrite',s=>s.delete(id)); },
  async all(){ const db=await this.open(); return new Promise((ok,err)=>{ const r=db.transaction('files').objectStore('files').getAll(); r.onsuccess=()=>ok(r.result||[]); r.onerror=()=>err(r.error); }); }
};

/* ================= Speichern / Offline-Warteschlange ================= */
function setSync(kind,txt){ const el=$('#syncState'); if(!el) return; el.innerHTML=IC(kind==='err'?'cloudoff':kind==='ok'?'cloud':'sync')+'<span>'+esc(txt)+'</span>'; el.style.color=kind==='err'?'var(--amber)':kind==='ok'?'var(--ok)':''; }
const queue=()=>ls.get(K.queue,[]);
function enqueue(item){ const q=queue().filter(x=>!(x.kind===item.kind&&x.id===item.id)); q.push(item); ls.set(K.queue,q); flushSoon(); }
let flushT=null, flushing=false, filesPending=0;
function flushSoon(){ clearTimeout(flushT); updSync(); flushT=setTimeout(flush,900); }
function updSync(){ const n=queue().length+filesPending; if(!navigator.onLine) setSync('err',n?`offline · ${n} Änderung${n>1?'en':''} warten`:'offline'); else if(n) setSync('',`${n} Änderung${n>1?'en':''} werden gespeichert …`); else setSync('ok','gespeichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})); }
const netzFehler=e=>!navigator.onLine || /Verbindung|fetch|network|angemeldet|timeout|abort/i.test(e.message||'');
async function flush(){
  if(flushing||!navigator.onLine){ updSync(); return; } flushing=true;
  try{
    for(const it of queue()){
      try{
        const r=it.kind==='info'? await pr('projekte/'+it.id+'/info',{method:'PUT',body:JSON.stringify(it.data)})
               : await pr('protokolle/'+it.id,{method:'PUT',body:JSON.stringify(it.data)});
        ls.set(K.queue,queue().filter(x=>!(x.kind===it.kind&&x.id===it.id&&x.v===it.v)));
        if(it.kind==='pr'&&r){ const loc=ls.get(K.doc(it.id),null); if(loc){ loc.nr=r.nr; ls.set(K.doc(it.id),loc); }
          const row=PL.find(x=>x.id===it.id); if(row){ row.nr=r.nr; ls.set(K.pl,PL); }
          if(D&&D.id===it.id){ D.nr=r.nr; D.erstellt_von=r.erstellt_von; hdr(); } }
      }catch(e){
        if(netzFehler(e)) break;
        ls.set(K.queue,queue().filter(x=>!(x.kind===it.kind&&x.id===it.id)));
        toast('Nicht gespeichert: '+e.message);
        if(D&&D.id===it.id) setTimeout(()=>location.reload(),1800);
      }
    }
    // Fotos und Diagramme erst, wenn das Protokoll auf dem Server ist
    const offen=(await IDB.all().catch(()=>[])).filter(f=>f.pending);
    for(const f of offen){
      if(queue().some(x=>x.kind==='pr'&&x.id===f.protokoll_id)) continue;
      try{ await pr('dateien/'+f.id,{method:'PUT',body:JSON.stringify({protokoll_id:f.protokoll_id,feld:f.feld,name:f.name,typ:f.typ,daten:f.daten})});
        f.pending=false; await IDB.put(f); }
      catch(e){ if(netzFehler(e)) break; if(/nicht gefunden/i.test(e.message)) continue; toast('Anhang nicht gespeichert: '+e.message); await IDB.del(f.id); }
    }
  } finally { flushing=false; filesPending=(await IDB.all().catch(()=>[])).filter(f=>f.pending).length; updSync(); }
}
window.addEventListener('online',flushSoon); window.addEventListener('offline',updSync);

async function loadBase(){
  PROJ=ls.get(K.proj,null); INFO=ls.get(K.info,{}); VORL=ls.get(K.vorl,[]); PL=ls.get(K.pl,[]);
  try{
    const [p,info,vorl,pl]=await Promise.all([api('projekte/'+PID),pr('projekte/'+PID+'/info'),pr('vorlagen'),pr('projekte/'+PID+'/protokolle')]);
    PROJ=p.projekt; INFO=info||{}; VORL=vorl||[]; PL=pl||[];
    ls.set(K.proj,PROJ); ls.set(K.info,INFO); ls.set(K.vorl,VORL); ls.set(K.pl,PL);
  }catch(e){
    if(/pj_pr/.test(e.message)) throw new Error('Die Datenbank für Protokolle ist noch nicht eingerichtet (protokolle.sql ausführen).');
    if(!PROJ) throw e;
  }
  // lokal angelegte, noch nicht übertragene Protokolle in die Liste
  queue().filter(it=>it.kind==='pr').forEach(it=>{ if(!PL.some(x=>x.id===it.id)){ const d=ls.get(K.doc(it.id),null); if(d) PL.unshift(listRow(d)); } });
  // Werte für „Auftraggeber vertreten durch“ usw. aus noch nicht übertragenen Änderungen
  const qi=queue().find(it=>it.kind==='info'&&it.id===PID); if(qi) Object.assign(INFO,qi.data);
}
const listRow=d=>({id:d.id,nr:d.nr,vorlage_id:d.vorlage_id,titel:d.titel,datum:d.datum,medium:d.werte?.medium,abschnitt:d.werte?.abschnitt,werkstoff:d.werte?.werkstoff,verbindung:d.werte?.verbindung,ergebnis_ok:d.def?.ergebnis?(ergebnis(d)?.ok??null):null,sig_an:!!d.sig_an,sig_ag:!!d.sig_ag,erstellt_von:d.erstellt_von,updated_at:d.updated_at,anhaenge:0});
function saveDoc(d){
  d.updated_at=nowIso(); ls.set(K.doc(d.id),d);
  const data={projekt_id:d.projekt_id,vorlage_id:d.vorlage_id,def:d.def,titel:d.titel,datum:d.datum,werte:d.werte,name_ag:d.name_ag||'',name_an:d.name_an||'',sig_ag:d.sig_ag||'',sig_an:d.sig_an||'',sig_ts:d.sig_ts||''};
  enqueue({kind:'pr',id:d.id,v:d.updated_at,data});
  const i=PL.findIndex(x=>x.id===d.id), row={...(PL[i]||{}),...listRow(d),anhaenge:PL[i]?.anhaenge||0};
  if(i>=0) PL[i]=row; else PL.unshift(row); ls.set(K.pl,PL);
}
async function loadDoc(id){
  const local=ls.get(K.doc(id),null);
  if(local&&queue().some(x=>x.kind==='pr'&&x.id===id)) return local;
  try{ const s=await pr('protokolle/'+id); if(!s) throw new Error('nicht gefunden'); s.werte=s.werte||{}; ls.set(K.doc(id),s); return s; }
  catch(e){ if(local) return local; throw e; }
}
async function loadFiles(id){
  let srv=null;
  try{ srv=await pr('protokolle/'+id+'/dateien'); }catch(e){}
  let alle=await IDB.all().catch(()=>[]);
  if(srv){ for(const f of srv){ await IDB.put({...f,protokoll_id:id,pending:false}).catch(()=>{}); }
    // auf dem Server gelöscht: lokal auch entfernen
    for(const f of alle.filter(f=>f.protokoll_id===id&&!f.pending&&!srv.some(x=>x.id===f.id))) await IDB.del(f.id).catch(()=>{});
    alle=await IDB.all().catch(()=>[]); }
  FILES=alle.filter(f=>f.protokoll_id===id).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
}
let saveT=null;
function changed(){ clearTimeout(saveT); setSync('','wird gespeichert …'); saveT=setTimeout(()=>saveDoc(D),500); }
const locked=()=>!!D.sig_an;

/* ================= Vorlagen-Logik ================= */
const W_=()=>D.werte;
const feldListe=def=>def.schritte.flatMap(s=>s.felder.map(f=>({...f,_schritt:s})));
function optTitel(f,w){ const o=(f.optionen||[]).find(o=>o.w===w); return o?(o.t||o.w):w; }
function txt(f){ if(typeof f.text!=='object') return f.text||''; const k=W_()[f.text_nach]; return f.text[k]??f.text['*']??''; }
function sichtbar(f){ if(!f.wenn) return true; const v=W_()[f.wenn.feld]; return (f.wenn.ist||[]).includes(v); }
function aktiv(s){ return (!s.schalter || W_()[s.schalter.id]!==false) && sichtbar(s); }
const feldDef=id=>feldListe(D.def).find(x=>x.id===id);
function wertVon(id,ctx){ if(ctx&&id in ctx) return num(ctx[id]); const f=feldDef(id); if(f&&f.typ==='berechnet') return num(berechne(f)); return num(W_()[id]); }
function berechne(f,ctx){
  const rd=x=>f.runden!=null?Math.round(x*10**f.runden)/10**f.runden:x;
  switch(f.formel){
    case 'fest': return f.wert;
    case 'zvshk_volumen': { const v=wertVon(f.aus,ctx); if(!isFinite(v)||v<=0) return ''; return v<=100?120:120+20*Math.ceil((v-100)/100); }
    case 'produkt': { const v=wertVon(f.aus,ctx); if(!isFinite(v)) return ''; let x=v*f.faktor; if(f.min_wert!=null) x=Math.max(x,f.min_wert); return rd(x); }
    case 'differenz_abs': { const a=wertVon(f.a,ctx), b=wertVon(f.b,ctx); if(!isFinite(a)||!isFinite(b)) return ''; return rd(Math.abs(a-b)); }
    case 'tabelle': { const v=ctx&&f.aus in ctx?ctx[f.aus]:W_()[f.aus]; const x=(f.werte||{})[v]; return x==null?'':x; }
    case 'stufen': { const v=wertVon(f.aus,ctx); if(!isFinite(v)) return ''; for(const [bis,x] of f.stufen){ if(bis==null||v<bis) return x; } return ''; }
  }
  return '';
}
function maxVon(f){ if(f.max!=null) return f.max; if(!f.max_aus) return null; const sel=W_()[f.max_aus]; const ff=feldDef(f.max_aus); const o=(ff?.optionen||[]).find(o=>o.w===sel); return o&&o.max!=null?o.max:null; }
function aktualisiereBerechnet(){ feldListe(D.def).filter(f=>f.typ==='berechnet').forEach(f=>{ W_()[f.id]=berechne(f); }); }
function titelVon(d){ const def=d.def; if(!def.pdf_titel) return def.titel; const med=feldListe(def).find(f=>f.id==='medium'||f.id==='anlage'); return def.pdf_titel.replace(/\{(medium|anlage)\}/,()=>med?optTitel(med,d.werte[med.id])||'…':''); }
function fehlend(){
  const out=[];
  D.def.schritte.forEach((s,si)=>{ if(!aktiv(s)) return; s.felder.forEach(f=>{ if(!f.pflicht||!sichtbar(f)) return;
    const v=W_()[f.id]; const leer=f.typ==='haken'?v!==true:f.typ==='liste'||f.typ==='zeilen'?!(Array.isArray(v)&&v.length):(v==null||String(v).trim()==='');
    if(leer) out.push({si,label:f.typ==='haken'?txt(f):f.label}); }); });
  return out;
}
// Ergebnis der Vorlage (z. B. „Die Rohrleitungen sind dicht.“), nicht jede Vorlage hat eins
function ergebnis(d){ const e=(d||D).def.ergebnis; if(!e) return null; const v=(d||D).werte[e.feld]; const ok=e.ok_wert!=null?v===e.ok_wert:v===true; return {ok, offen:v==null||v==='', ja:e.ja, nein:e.nein}; }
const ortAus=a=>{ const t=String(a||'').split(',').pop().trim(); return t.replace(/^\d{5}\s*/,''); };
function vorbelegung(def){
  const w={}, letztes=PL.find(x=>x.vorlage_id===D?.vorlage_id)||null;
  feldListe(def).forEach(f=>{
    if(f.standard!=null) w[f.id]=f.standard;
    const vb=f.vorbelegung;
    if(vb==='projekt') w[f.id]=[PROJ?.name,PROJ?.adresse].filter(Boolean).join(', ');
    else if(vb==='projekt.nr') w[f.id]=PROJ?.nr||'';
    else if(vb&&vb.startsWith('info.')) w[f.id]=INFO[vb.slice(5)]||'';
    else if(vb==='ich') w[f.id]=PJ.me?.name||'';
    else if(vb==='heute') w[f.id]=todayIso();
    else if(vb==='letztes'&&letztes&&letztes[f.id]) w[f.id]=letztes[f.id];
  });
  def.schritte.forEach(s=>{ if(s.schalter) w[s.schalter.id]=s.schalter.standard!==false; });
  w.ort=ortAus(PROJ?.adresse);
  return w;
}

function neuesProtokoll(v){
  const d={id:uid(),projekt_id:PID,nr:null,vorlage_id:v.id,def:v.def,titel:v.titel,datum:todayIso(),werte:{},name_ag:INFO.ag_vertreter||'',name_an:PJ.me?.name||'',sig_ag:null,sig_an:null,sig_ts:null,erstellt_von:PJ.me?.name||''};
  D=d; d.werte=vorbelegung(v.def); aktualisiereBerechnet(); d.titel=v.titel;
  saveDoc(d); FILES=[]; STEP=0; ls.set(K.step(d.id),0);
  history.pushState(null,'',`?p=${PID}&pr=${d.id}`); window.scrollTo(0,0); renderPr();
}

/* ================= Erfassen ================= */
const schritte=()=>[...D.def.schritte,{id:'_abschluss',titel:'Abschluss',felder:[]}];
function renderPr(){
  PJS.set({seite:'pr',pid:PID,pname:PROJ?.name||'',erfassen:true});
  hdr(); $('#backBtn').innerHTML=IC('back'); $('#backBtn').href='?p='+PID;
  aktualisiereBerechnet();
  if(locked()) return renderGesperrt();
  const S=schritte(); STEP=Math.min(Math.max(0,STEP),S.length-1); ls.set(K.step(D.id),STEP);
  const s=S[STEP], fe=fehlend();
  $('#app').innerHTML=`
    <div class="card stepcard"><div class="steptop"><span>${prNr(D.nr)} · Schritt ${STEP+1} von ${S.length}</span><span>${esc(titelVon(D))}</span></div>
      <div class="steps">${S.map((x,i)=>`<button class="stp${i===STEP?' on':''}${i<STEP?' done':''}${fe.some(m=>m.si===i)&&i<STEP?' warn':''}" data-step="${i}" title="${esc(x.titel)}"><i>${i+1}</i><span>${esc(x.titel)}</span></button>`).join('')}</div></div>
    <div id="stepBody">${s.id==='_abschluss'?abschlussHtml(fe):schrittHtml(s)}</div>
    <div class="bottombar">
      ${STEP>0?`<button class="btn ghost" id="bBack">${IC('back')}Zurück</button>`:''}
      ${s.id==='_abschluss'?`<button class="btn ghost" id="bPdf">${IC('file')}PDF</button><button class="btn cta" id="bMail">${IC('mail')}Senden</button>`:`<button class="btn cta" id="bNext">Weiter</button>`}
    </div>
    ${PJ.leitung()?`<div style="text-align:center;margin-top:6px"><button class="lnk" id="bDel" style="color:var(--red)">${IC('trash')}Protokoll löschen</button></div>`:''}`;
  $$('[data-step]').forEach(b=>b.onclick=()=>geheZu(+b.dataset.step));
  if($('#bBack')) $('#bBack').onclick=()=>geheZu(STEP-1);
  if($('#bNext')) $('#bNext').onclick=()=>geheZu(STEP+1);
  if($('#bDel')) $('#bDel').onclick=delPr;
  if(s.id==='_abschluss') bindAbschluss(); else bindSchritt(s);
}
function geheZu(i){ STEP=i; ls.set(K.step(D.id),STEP); renderPr(); window.scrollTo(0,0); }

function feldHtml(f){
  if(!sichtbar(f)) return '';
  const w=W_(), v=w[f.id], dis=locked()?' disabled':'';
  const lab=(t,id)=>`<label for="${id}">${esc(t)}${f.pflicht?' <span class="pfl">*</span>':''}</label>`;
  const hin=f.hinweis?`<div class="hint" style="margin-top:4px">${esc(f.hinweis)}</div>`:'';
  switch(f.typ){
    case 'info': return `<div class="info-box">${IC('info','sm')}<span>${esc(f.text)}</span></div>`;
    case 'text': return f.mehrzeilig
      ? `<div class="field">${lab(f.label,'f_'+f.id)}<textarea class="inp" rows="3" id="f_${f.id}" data-f="${f.id}" placeholder="${esc(f.platzhalter||'')}"${dis}>${esc(v??'')}</textarea>${hin}</div>`
      : `<div class="field${f.halb?' half':''}">${lab(f.label,'f_'+f.id)}<input class="inp" id="f_${f.id}" data-f="${f.id}" value="${esc(v??'')}" placeholder="${esc(f.platzhalter||'')}" autocomplete="off"${dis}>${hin}</div>`;
    case 'datum': return `<div class="field${f.halb?' half':''}">${lab(f.label,'f_'+f.id)}<input class="inp" type="date" id="f_${f.id}" data-f="${f.id}" value="${esc(v??'')}"${dis}>${hin}</div>`;
    case 'zahl': { const mx=maxVon(f); const over=mx!=null&&isFinite(num(v))&&num(v)>mx;
      return `<div class="field${f.halb?' half':''}">${lab(f.label,'f_'+f.id)}<div class="unitwrap"><input class="inp" id="f_${f.id}" data-f="${f.id}" inputmode="decimal" value="${esc(v==null?'':String(v).replace('.',','))}"${dis}><span>${esc(f.einheit||'')}</span></div>
        ${f.mpa?`<div class="hint" style="margin-top:4px" data-mpa="${f.id}">${isFinite(num(v))?'= '+nfmt(num(v)/10)+' MPa':''}</div>`:''}
        ${mx!=null?`<div class="hint${over?' warnt':''}" data-max="${f.id}" style="margin-top:4px">${over?'Achtung: ':''}höchstens ${nfmt(mx)} ${esc(f.einheit||'')}</div>`:''}${hin}</div>`; }
    case 'berechnet': { const r=berechne(f); return `<div class="field${f.halb?' half':''}"><label>${esc(f.label)}</label><div class="calc" data-calc="${f.id}">${r===''?'–':nfmt(r)+' '+esc(f.einheit||'')}</div>${f.hinweis?`<div class="hint" style="margin-top:4px">${esc(f.hinweis)}</div>`:''}</div>`; }
    case 'auswahl': { const opts=f.optionen||[], son=f.sonstiges&&v&&!opts.some(o=>o.w===v);
      return `<div class="field">${lab(f.label,'')}<div class="opts">${opts.map(o=>`<label class="opt${v===o.w?' on':''}"><input type="radio" name="r_${f.id}" value="${esc(o.w)}" data-r="${f.id}" ${v===o.w?'checked':''}${dis}><span>${esc(o.t&&o.t!==o.w&&!f.kurz_anzeige?o.t:o.w)}</span></label>`).join('')}
        ${f.sonstiges?`<label class="opt${son?' on':''}"><input type="radio" name="r_${f.id}" value="__s" data-r="${f.id}" ${son?'checked':''}${dis}><span>sonstige</span></label>`:''}</div>
        ${f.sonstiges?`<input class="inp" style="margin-top:8px;${son?'':'display:none'}" id="s_${f.id}" data-son="${f.id}" placeholder="bitte eintragen" value="${son?esc(v):''}"${dis}>`:''}${hin}</div>`; }
    case 'haken': return `<label class="chk big"><input type="checkbox" data-h="${f.id}" ${v===true?'checked':''}${dis}><span><b>${esc(txt(f))}${f.pflicht?' <span class="pfl">*</span>':''}</b>${f.hinweis?`<small>${esc(f.hinweis)}</small>`:''}</span></label>`;
    case 'messung': return messHtml(f);
    case 'liste': return listeHtml(f);
    case 'zeilen': return zeilenHtml(f);
    case 'dateien': return `<div class="field"><label>${esc(f.label)}</label>${f.hinweis?`<div class="hint" style="margin:-2px 0 8px">${esc(f.hinweis)}</div>`:''}
        <div class="thumbs" data-thumbs="${f.id}">${thumbs(f.id)}</div>
        ${locked()?'':`<label class="btn ghost sm upl">${IC('upload','sm')}Datei oder Foto hinzufügen<input type="file" accept="${esc(f.accept||'image/*')}" data-file="${f.id}" hidden></label>`}</div>`;
  }
  return '';
}
/* ---------- Checkliste (Anlagenteile) ---------- */
function listeHtml(f){
  const sel=Array.isArray(W_()[f.id])?W_()[f.id]:[], dis=locked()?' disabled':'';
  const eig=sel.filter(s=>String(s.nr).startsWith('x'));
  return `<div class="field">${f.label?`<label>${esc(f.label)}${f.pflicht?' <span class="pfl">*</span>':''}</label>`:''}${f.hinweis?`<div class="hint" style="margin:-2px 0 6px">${esc(f.hinweis)}</div>`:''}
    <div class="liste">${(f.punkte||[]).map((t,i)=>{ const nr=i+1, s=sel.find(x=>x.nr===nr);
      return `<div class="li${s?' on':''}"><label class="chk"><input type="checkbox" data-li="${f.id}|${nr}" ${s?'checked':''}${dis}><span><b><em>${nr}</em>${esc(t)}</b></span></label>
        ${s?`<input class="inp li-bem" data-lib="${f.id}|${nr}" placeholder="${esc(f.bem_platzhalter||'Bemerkung (optional)')}" value="${esc(s.bem||'')}"${dis}>`:''}</div>`; }).join('')}
    ${eig.map(s=>`<div class="li on"><div class="li-eig"><input class="inp" data-lit="${f.id}|${s.nr}" placeholder="Anlagenteil" value="${esc(s.text||'')}"${dis}>${locked()?'':`<button class="delbtn" data-lix="${f.id}|${s.nr}" aria-label="Entfernen">${IC('trash','sm')}</button>`}</div>
        <input class="inp li-bem" data-lib="${f.id}|${s.nr}" placeholder="Bemerkung (optional)" value="${esc(s.bem||'')}"${dis}></div>`).join('')}</div>
    ${locked()?'':`<button type="button" class="lnk" data-liadd="${f.id}">${IC('plus','sm')}Weiteres Anlagenteil</button>`}</div>`;
}
/* ---------- Tabelle mit Zeilen (z. B. Spülabschnitte) ---------- */
function zeilenHtml(f){
  const rows=Array.isArray(W_()[f.id])?W_()[f.id]:[], dis=locked()?' disabled':'';
  return `<div class="field"><label>${esc(f.label)}${f.pflicht?' <span class="pfl">*</span>':''}</label>${f.hinweis?`<div class="hint" style="margin:-2px 0 6px">${esc(f.hinweis)}</div>`:''}
    ${rows.map((r,i)=>`<div class="zl"><div class="zl-h"><b>${esc(f.zeile||'Zeile')} ${i+1}</b>${locked()?'':`<button class="delbtn" data-zx="${f.id}|${i}" aria-label="Entfernen">${IC('trash','sm')}</button>`}</div><div class="fgrid">
      ${f.spalten.map(c=>{ if(c.typ==='berechnet'){ const x=berechne(c,r); return `<div class="field half"><label>${esc(c.label)}</label><div class="calc sm" data-zc="${f.id}|${i}|${c.id}">${x===''?'–':nfmt(x)+' '+esc(c.einheit||'')}</div></div>`; }
        if(c.typ==='auswahl') return `<div class="field half"><label>${esc(c.label)}</label><select class="inp" data-zf="${f.id}|${i}|${c.id}"${dis}><option value=""></option>${c.optionen.map(o=>`<option ${r[c.id]===o.w?'selected':''}>${esc(o.w)}</option>`).join('')}</select></div>`;
        return `<div class="field half"><label>${esc(c.label)}</label><div class="unitwrap"><input class="inp" data-zf="${f.id}|${i}|${c.id}" ${c.typ==='zahl'?'inputmode="decimal"':''} value="${esc(String(r[c.id]??'').replace(c.typ==='zahl'?'.':'§',','))}"${dis}><span>${esc(c.einheit||'')}</span></div></div>`; }).join('')}
    </div></div>`).join('')||'<p class="hint">Noch nichts eingetragen.</p>'}
    ${locked()?'':`<button type="button" class="lnk" data-zadd="${f.id}">${IC('plus','sm')}${esc(f.zeile||'Zeile')} hinzufügen</button>`}</div>`;
}
function bindListen(){
  const w=W_(), arr=id=>Array.isArray(w[id])?w[id]:(w[id]=[]);
  $$('[data-li]').forEach(el=>el.addEventListener('change',()=>{ const [id,nr]=el.dataset.li.split('|'); const a=arr(id), n=+nr;
    if(el.checked){ if(!a.some(x=>x.nr===n)) a.push({nr:n,bem:''}); a.sort((x,y)=>(typeof x.nr==='number'?x.nr:999)-(typeof y.nr==='number'?y.nr:999)); } else w[id]=a.filter(x=>x.nr!==n);
    changed(); renderPr(); }));
  $$('[data-lib]').forEach(el=>el.addEventListener('input',()=>{ const [id,nr]=el.dataset.lib.split('|'); const s=arr(id).find(x=>String(x.nr)===nr); if(s){ s.bem=el.value; changed(); } }));
  $$('[data-lit]').forEach(el=>el.addEventListener('input',()=>{ const [id,nr]=el.dataset.lit.split('|'); const s=arr(id).find(x=>String(x.nr)===nr); if(s){ s.text=el.value; changed(); } }));
  $$('[data-lix]').forEach(b=>b.onclick=()=>{ const [id,nr]=b.dataset.lix.split('|'); w[id]=arr(id).filter(x=>String(x.nr)!==nr); changed(); renderPr(); });
  $$('[data-liadd]').forEach(b=>b.onclick=()=>{ const id=b.dataset.liadd; arr(id).push({nr:'x'+Date.now().toString(36),text:'',bem:''}); changed(); renderPr(); const ins=$$('[data-lit]'); ins.length&&ins[ins.length-1].focus(); });
  $$('[data-zadd]').forEach(b=>b.onclick=()=>{ arr(b.dataset.zadd).push({}); changed(); renderPr(); });
  $$('[data-zx]').forEach(b=>b.onclick=()=>{ const [id,i]=b.dataset.zx.split('|'); arr(id).splice(+i,1); changed(); renderPr(); });
  $$('[data-zf]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'input',()=>{ const [id,i,c]=el.dataset.zf.split('|'); const f=feldDef(id), col=f.spalten.find(x=>x.id===c);
    arr(id)[+i][c]=col.typ==='zahl'?el.value.trim().replace(',','.'):el.value;
    f.spalten.filter(x=>x.typ==='berechnet').forEach(x=>{ const e=$(`[data-zc="${id}|${i}|${x.id}"]`); if(e){ const r=berechne(x,arr(id)[+i]); e.textContent=r===''?'–':nfmt(r)+' '+(x.einheit||''); } });
    changed(); }));
}
function schrittHtml(s){
  if(!sichtbar(s)) return `<div class="card"><h2>${esc(s.titel)}</h2><p class="hint">Entfällt bei dieser Auswahl.</p></div>`;
  const sch=s.schalter, an=aktiv(s);
  return `<div class="card"><h2>${esc(s.titel)}</h2>
    ${sch?`<label class="chk big sw"><input type="checkbox" data-sw="${sch.id}" ${an?'checked':''}${locked()?' disabled':''}><span><b>${esc(sch.text)}</b><small>${an?'':'Abschnitt wird im PDF als „nicht durchgeführt“ vermerkt.'}</small></span></label>`:''}
    ${an?`<div class="fgrid">${s.felder.map(feldHtml).join('')}</div>`:''}</div>`;
}
function bindSchritt(s){
  const w=W_();
  $$('[data-f]').forEach(el=>el.addEventListener('input',()=>{ const f=feldListe(D.def).find(x=>x.id===el.dataset.f);
    w[f.id]=f.typ==='zahl'?el.value.trim().replace(',','.'):el.value;
    if(f.merken==='info') merkeInfo(f.info_key||f.id,el.value);

/* ================= Unterschriften ================= */
function setupSigs(ids,lockId){
  ids.forEach(id=>{
    const c=$('#'+id), ctx=c.getContext('2d'); let draw=false,last=null,dirty=false;
    const size=()=>{ const r=c.getBoundingClientRect(), dp=devicePixelRatio||1; c.width=r.width*dp; c.height=r.height*dp; ctx.setTransform(dp,0,0,dp,0,0); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0d1524'; ctx.fillStyle='#0d1524';
      if(D[id]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=D[id]; } };
    c._size=size; size();
    const pt=e=>{ const r=c.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
    c.addEventListener('pointerdown',e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); draw=true; dirty=true; last=pt(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fill(); });
    c.addEventListener('pointermove',e=>{ if(!draw) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
    const end=()=>{ if(!draw) return; draw=false; if(!dirty) return; dirty=false;
      if(id===lockId){ const fe=fehlend(); if(fe.length&&!confirm(fe.length+' Pflichtangabe(n) sind noch offen. Trotzdem abschließen?')){ D[id]=null; ctx.clearRect(0,0,c.width,c.height); return; } }
      D[id]=c.toDataURL('image/png'); D.sig_ts=nowIso(); sigText(ids);
      if(id===lockId){ clearTimeout(saveT); saveDoc(D); toast('Unterschrieben – das Protokoll ist abgeschlossen'); setTimeout(renderPr,900); } else changed(); };
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,end));
  });
  $$('[data-clr]').forEach(b=>b.onclick=()=>{ D[b.dataset.clr]=null; if(!ids.some(i=>D[i])) D.sig_ts=null; const c=$('#'+b.dataset.clr); c.getContext('2d').clearRect(0,0,c.width,c.height); c._size(); sigText(ids); changed(); });
  sigText(ids);
}

const filePr=()=>safe('Protokoll_'+prNr(D.nr)+'_'+(D.def.titel||'')+'_'+(PROJ?.name||'')+'_'+D.datum)+'.pdf';
async function pdfPr(){

  const leer=v=>v===''||v==null?'–':String(v);
  // zweispaltiges Raster aus Bezeichnung/Wert-Paaren; lange Werte über die volle Breite

    const teile=(p,breit)=>({l:doc.splitTextToSize(p.l,LW-1),v:doc.splitTextToSize(leer(p.v),(breit?BR:CW)-LW-2)});
    let i=0;
    while(i<paare.length){
      let p=paare[i]; const halb=teile(p,false); const voll=p.voll||halb.v.length>2;
      if(voll){ const t=teile(p,true), n=Math.max(t.l.length,t.v.length); need(n*LH+1); doc.setTextColor(115); doc.text(t.l,M+1.6,y); doc.setTextColor(25); doc.text(t.v,M+1.6+LW,y); y+=n*LH+1.1; i++; continue; }
      let q=paare[i+1], tq=null; if(q){ tq=teile(q,false); if(q.voll||tq.v.length>2){ q=null; tq=null; } }
      const n=Math.max(halb.l.length,halb.v.length,tq?Math.max(tq.l.length,tq.v.length):0); need(n*LH+1);
      doc.setTextColor(115); doc.text(halb.l,M+1.6,y); doc.setTextColor(25); doc.text(halb.v,M+1.6+LW,y);
      if(q){ const x=M+CW+6; doc.setTextColor(115); doc.text(tq.l,x,y); doc.setTextColor(25); doc.text(tq.v,x+LW,y); }
      y+=n*LH+1.1; i+=q?2:1;
    } };
  const box=(on,text)=>{ doc.setFontSize(FS); const lines=doc.splitTextToSize(text,BR-9); need(lines.length*LH+1.2); doc.setDrawColor(80); doc.setLineWidth(0.25); doc.rect(M+1.6,y-2.9,3.3,3.3);
    if(on){ doc.setDrawColor(226,83,4); doc.setLineWidth(0.55); doc.line(M+2.2,y-1.3,M+3.1,y-0.1); doc.line(M+3.1,y-0.1,M+4.6,y-2.5); doc.setLineWidth(0.2); }
    doc.setFont('helvetica','normal'); doc.setTextColor(on?25:115); doc.text(lines,M+7,y); y+=lines.length*LH+1.2; doc.setTextColor(25); };
  const info=t=>{ doc.setFontSize(7.6); doc.setFont('helvetica','italic'); doc.setTextColor(115); const lines=doc.splitTextToSize(t,BR-3); need(lines.length*3.2+1); doc.text(lines,M+1.6,y); y+=lines.length*3.2+1.2; doc.setFont('helvetica','normal'); doc.setTextColor(25); };
  const wert=f=>{ const v=w[f.id]; if(f.typ==='zahl') return isFinite(num(v))?nfmt(v)+' '+(f.einheit||'')+(f.mpa?' ('+nfmt(num(v)/10)+' MPa)':''):''; if(f.typ==='berechnet'){ const r=berechne(f); return r===''?'':nfmt(r)+' '+(f.einheit||''); } if(f.typ==='auswahl') return f.id==='medium'||f.id==='anlage'?optTitel(f,v)||'':(optTitel(f,v)||''); if(f.typ==='datum') return dDE(v); return v||''; };
  const anlagen=[];
  def.schritte.forEach((s,si)=>{
    if(!sichtbar(s)) return;
    const an=aktiv(s);
    sec(si===0?'Angaben':s.titel, s.schalter?(an?'durchgeführt':'nicht durchgeführt'):'');
    if(!an) return;
    let puffer=[]; const leeren=()=>{ if(puffer.length){ raster(puffer); puffer=[]; } };
    if(si===0) puffer.push({l:'Datum',v:dDE(d.datum)},{l:'Ort',v:w.ort||''});
    s.felder.forEach(f=>{
      if(!sichtbar(f)) return;
      const l=f.kurz||f.label;
      if(f.typ==='info'){ leeren(); info(f.text); }
      else if(f.typ==='haken'){ leeren(); box(w[f.id]===true,txt(f)); }
      else if(f.typ==='messung'){ const m=w[f.id]||{}, soll=sollMin(f), dau=m.start&&m.ende?Math.round((new Date(m.ende)-new Date(m.start))/60000):null, e=' '+(f.einheit||'');
        puffer.push({l:'Beginn',v:[m.start?tsDE(m.start):'',m.p_start!=null&&m.p_start!==''?nfmt(m.p_start)+e:''].filter(Boolean).join(' · ')},
                    {l:'Ende',v:[m.ende?tsDE(m.ende):'',m.p_ende!=null&&m.p_ende!==''?nfmt(m.p_ende)+e:''].filter(Boolean).join(' · ')},
                    {l:'Prüfdauer',v:dau!=null?dau+' min'+(isFinite(soll)?' (gefordert '+nfmt(soll)+' min)':''):(isFinite(soll)?'gefordert '+nfmt(soll)+' min':'')});
        ['start','ende'].forEach(k=>FILES.filter(x=>x.feld===f.id+'_'+k).forEach(x=>anlagen.push({...x,cap:s.titel+', Manometer '+(k==='start'?'Beginn':'Ende')}))); }
      else if(f.typ==='dateien'){ const fs=FILES.filter(x=>x.feld===f.id); fs.forEach(x=>anlagen.push({...x,cap:l.replace(' (optional)','')})); if(fs.length) puffer.push({l:l.replace(' (optional)',''),v:fs.length+' Anlage'+(fs.length>1?'n':'')+' (siehe Anhang)'}); }
      else if(f.typ==='liste'){ leeren(); const sel=Array.isArray(w[f.id])?w[f.id]:[];
        if(f.label){ doc.setFontSize(FS); doc.setTextColor(115); need(LH+1); doc.text(f.label,M+1.6,y); y+=LH+0.6; doc.setTextColor(25); }
        if(!sel.length){ info('Keine Angaben.'); return; }
        sel.forEach(x=>{ const t=typeof x.nr==='number'?x.nr+'. '+(f.punkte[x.nr-1]||''):(x.text||'weiteres Anlagenteil'); box(true,t+(x.bem?' – '+x.bem:'')); }); }
      else if(f.typ==='zeilen'){ leeren(); const rows=Array.isArray(w[f.id])?w[f.id]:[];
        if(!rows.length){ info(f.label+': keine Angaben.'); return; }
        need(14);
        doc.autoTable({startY:y-2.4,margin:{left:M+1.6,right:M},theme:'grid',styles:{fontSize:7.8,cellPadding:1.1,lineColor:[210,214,222],textColor:[25,25,25]},headStyles:{fillColor:[47,59,83],textColor:255,fontStyle:'bold'},
          head:[[f.zeile||'Nr.',...f.spalten.map(c=>c.label+(c.einheit?' ('+c.einheit+')':''))]],
          body:rows.map((r,i)=>[String(i+1),...f.spalten.map(c=>{ const v=c.typ==='berechnet'?berechne(c,r):r[c.id]; return c.typ==='zahl'||c.typ==='berechnet'?nfmt(v):leer(v); })])});
        y=doc.lastAutoTable.finalY+4.5; }
      else puffer.push({l, v:wert(f), voll:f.typ==='text'&&f.mehrzeilig});
    });
    leeren();
  });
  // Unterschriften
  need(50); y+=3;
  doc.setFontSize(FS); doc.setTextColor(25); doc.text('Ort, Datum: '+[w.ort,dDE(d.datum)].filter(Boolean).join(', '),M,y); y+=2;
  y=pdfSig(doc,y,[[d.sig_ag,'Auftraggeber bzw. Vertreter',d.name_ag],[d.sig_an,'Auftragnehmer bzw. Vertreter',d.name_an]],d.sig_ts);
  // Fotos als Anlage
  const bilder=anlagen.filter(a=>String(a.typ).startsWith('image/')), pdfs=anlagen.filter(a=>a.typ==='application/pdf');
  if(bilder.length){ doc.addPage(); y=20; doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(47,59,83); doc.text('Anlage: Fotos und Diagramme',M,y); y+=8;
    const bw=(BR-8)/2, bh=bw*0.75; let col=0;
    bilder.forEach(b=>{ if(col===0&&y+bh+10>280){ doc.addPage(); y=20; }
      const x=M+col*(bw+8); try{ const ip=doc.getImageProperties(b.daten); let ww=bw, hh=bw*ip.height/ip.width; if(hh>bh){ hh=bh; ww=bh*ip.width/ip.height; } doc.addImage(b.daten,'JPEG',x,y,ww,hh,undefined,'FAST'); }catch(e){}
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(90); doc.text(doc.splitTextToSize(b.cap,bw),x,y+bh+4);
      col++; if(col===2){ col=0; y+=bh+12; } }); }
  pdfFuss(doc,'Heise Haustechnik GmbH & Co. KG · Ramsenweg 2c · 38700 Braunlage');
  let blob=doc.output('blob');
  if(pdfs.length){ try{ await ladeSkript('lib/pdf-lib.min.js',()=>window.PDFLib);
      const haupt=await PDFLib.PDFDocument.load(await blob.arrayBuffer());
      for(const p of pdfs){ const src=await PDFLib.PDFDocument.load(Uint8Array.from(atob(p.daten.split(',')[1]),c=>c.charCodeAt(0)),{ignoreEncryption:true}); const seiten=await haupt.copyPages(src,src.getPageIndices()); seiten.forEach(s=>haupt.addPage(s)); }
      blob=new Blob([await haupt.save()],{type:'application/pdf'}); }
    catch(e){ console.warn(e); toast('PDF-Anhang konnte nicht angefügt werden'); } }
  return blob;
}
function ladeSkript(src,test){ return test()?Promise.resolve():new Promise((ok,err)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error('Bibliothek fehlt')); document.head.appendChild(s); }); }

/* ================= gemeinsame Bausteine (wie Zusätzliche Arbeiten) ================= */
let LOGO=null;
async function logoData(){ if(LOGO!==null) return LOGO; try{ const b=await (await fetch('lib/heise-logo.png')).blob(); LOGO=await new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); }); }catch(e){ LOGO=''; } return LOGO; }
const safe=s=>String(s).replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/ß/g,'ss').replace(/[^A-Za-z0-9-]+/g,'_');
const W=210,M=16;
async function pdfKopf(doc,titel,nr){
  const lg=await logoData(); if(lg) doc.addImage(lg,'PNG',W-M-38,8,38,38*91.014/200,undefined,'FAST');
  doc.setTextColor(47,59,83); doc.setFont('helvetica','bold'); doc.setFontSize(17); const tl=doc.splitTextToSize(titel,W-2*M-46); doc.text(tl,M,17);
  const o=(tl.length-1)*7;   // zweizeiliger Titel schiebt den Rest nach unten
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(100); doc.text('Heise Haustechnik GmbH & Co. KG · Ramsenweg 2c · 38700 Braunlage',M,24+o);
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(226,83,4); doc.text(nr,M,31+o);
  doc.setDrawColor(226,83,4); doc.setLineWidth(0.8); doc.line(M,34+o,W-M,34+o); doc.setLineWidth(0.2); doc.setTextColor(58,58,58); doc.setFont('helvetica','normal');
  return 38+o;
}
function pdfFuss(doc,txt){ const n=doc.getNumberOfPages(); for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFontSize(7.5); doc.setTextColor(120); doc.text(txt,M,290); doc.text('Seite '+i+' von '+n,W-M,290,{align:'right'}); } }
function pdfSig(doc,y,felder,ts){
  const bw=(W-2*M-12)/2;
  felder.forEach(([img,lab,name],i)=>{
    const x=M+i*(bw+12);
    if(img){ try{ const ip=doc.getImageProperties(img); let hh=22, ww=hh*ip.width/ip.height; if(ww>bw){ ww=bw; hh=ww*ip.height/ip.width; } doc.addImage(img,'PNG',x,y+24-hh,ww,hh,undefined,'FAST'); }catch(e){ console.warn('Unterschrift',e); } }
    doc.setDrawColor(90); doc.line(x,y+25,x+bw,y+25); doc.setFontSize(8.5); doc.setFont('helvetica','normal'); doc.setTextColor(58,58,58);
    doc.text(doc.splitTextToSize(lab+(name?': '+name:''),bw),x,y+29); doc.setTextColor(120); doc.text(img?'unterschrieben am '+tsDE(ts):'nicht unterschrieben',x,y+37); doc.setTextColor(58,58,58);
  });
  return y+40;
}
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }

/* ================= Senden (wie im Bautagebuch) ================= */
function empfaenger(){ try{ const a=JSON.parse(PROJ?.empfaenger||'[]'); return Array.isArray(a)?a.filter(x=>x&&x.email):[]; }catch(e){ return []; } }
const canShareFiles=()=>{ try{ return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.pdf',{type:'application/pdf'})]})); }catch(e){ return false; } };
function sendDialog(build,name,subject,text){
  const em=empfaenger(), share=canShareFiles();
  openSheet(`<h2>PDF senden</h2>
    ${em.length?`<label style="font-size:13px;font-weight:700;color:var(--ink-3)">Empfänger</label>`+em.map((r,i)=>`<label class="chk"><input type="checkbox" data-em="${i}" checked><span><b>${esc(r.name||r.email)}</b><small>${esc([r.rolle,r.email].filter(Boolean).join(' · '))}</small></span></label>`).join('')
      :`<p class="hint">Für dieses Projekt sind noch keine Empfänger hinterlegt. Die Bauleitung kann sie in der Projektübersicht unter „E-Mail-Empfänger“ eintragen.</p>`}
    <div class="field" style="margin-top:12px"><label for="em_x">Weitere Adresse (optional)</label><input class="inp" id="em_x" type="email" inputmode="email" placeholder="name@firma.de"></div>
    <p class="hint" id="em_st">PDF wird erstellt …</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      ${share?`<button class="btn cta block" id="em_share" disabled>${IC('share')}Teilen mit PDF-Anhang</button>`:''}
      <button class="btn ${share?'ghost':'cta'} block" id="em_mail" disabled>${IC('mail')}Im Mailprogramm öffnen</button></div>
    <p class="hint" style="margin-top:10px">${share?'Beim Teilen werden die Empfänger in die Zwischenablage kopiert, im Mailprogramm ins Feld „An“ einfügen. ':''}„Im Mailprogramm öffnen“ trägt die Empfänger ein und speichert das PDF, das dann noch angehängt werden muss.</p>`,async()=>{
    const to=()=>{ const a=$$('[data-em]').filter(c=>c.checked).map(c=>em[+c.dataset.em].email); const x=$('#em_x').value.trim(); if(x) a.push(x); return [...new Set(a)]; };
    let blob=null;
    try{ blob=await build(); }catch(e){ $('#em_st').textContent='PDF konnte nicht erstellt werden: '+e.message; return; }
    $('#em_st').textContent='PDF ist fertig.';
    const file=new File([blob],name,{type:'application/pdf'});
    if($('#em_share')){ $('#em_share').disabled=false; $('#em_share').onclick=async()=>{
      const a=to(); if(a.length&&navigator.clipboard) navigator.clipboard.writeText(a.join(', ')).catch(()=>{});
      try{ await navigator.share({files:[file],title:subject,text}); closeSheet(); if(a.length) toast('Empfänger wurden kopiert'); }catch(e){ if(e.name!=='AbortError') toast('Teilen nicht möglich: '+e.message); } }; }
    $('#em_mail').disabled=false; $('#em_mail').onclick=()=>{
      const a=to(); dl(blob,name); closeSheet(); toast('PDF gespeichert – bitte an die E-Mail anhängen');
      setTimeout(()=>location.href=`mailto:${a.map(encodeURIComponent).join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`,600); };
  });
}
function openSheet(html,after){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').classList.add('on'); after&&after(); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#ov').classList.remove('on'); }
$('#ov').onclick=closeSheet;

/* ================= Start ================= */
async function route(){
  const id=new URLSearchParams(location.search).get('pr');
  try{
    if(id){ D=await loadDoc(id); D.werte=D.werte||{}; await loadFiles(id); STEP=ls.get(K.step(id),0); renderPr(); }
    else renderList();
  }catch(e){ $('#app').innerHTML=`<div class="err">Protokoll nicht gefunden.</div><a class="btn ghost" href="?p=${PID}">Zurück</a>`; }
}
(async function(){
  $('#backBtn').innerHTML=IC('back');
  if(!PID){ $('#app').innerHTML='<div class="empty">Kein Projekt gewählt. <a href="index.html">Zur Projektübersicht</a></div>'; return; }
  if(PJ.ready) await PJ.ready;
  try{ await loadBase(); }catch(e){ $('#app').innerHTML=`<div class="err">${esc(e.message)}</div><a class="btn ghost" href="index.html#p=${PID}">Zum Projekt</a>`; return; }
  await route();
  window.addEventListener('popstate',route);
  document.title='Protokolle · '+(PROJ?.name||'');
  filesPending=(await IDB.all().catch(()=>[])).filter(f=>f.pending).length;
  updSync(); flush();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
