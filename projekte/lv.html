<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>Leistungsverzeichnis</title>
<link rel="stylesheet" href="lib/heise-ui.css">
<style>
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--ink-3);text-align:right;line-height:1.25;max-width:42%}
.sync .ic{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stats div{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px}
.stats b{display:block;font-size:19px;font-weight:800;color:var(--brand);letter-spacing:-.01em}
.stats small{font-size:12px;color:var(--ink-3);font-weight:650}
.sbar{position:sticky;top:calc(64px + var(--safe-t));z-index:20;background:var(--bg);padding:6px 0 8px;margin:0 -2px}
.sbox{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.sbox .ic{color:var(--ink-3);flex:0 0 auto}
.sbox input{flex:1;border:0;outline:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);min-width:0}
.sbox button{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;color:var(--ink-3)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 2px 8px;font-size:13px}
.tools .lnk{color:var(--brand-2);font-weight:650;padding:4px 0}
.tools .r{display:flex;gap:14px}
.los{font-size:12px;font-weight:780;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:18px 4px 8px}
.tit{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.tit-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px}
.tit-h .nr{font-weight:800;color:var(--ink-3);font-size:13px;min-width:38px}
.tit-h b{flex:1;min-width:0;font-size:15px;line-height:1.3}
.tit-h small{display:block;font-weight:600;color:var(--ink-3);font-size:12px;margin-top:2px}
.tit-h .ic{transition:transform .2s;color:var(--ink-3);flex:0 0 auto}
.tit.open .tit-h .ic{transform:rotate(90deg)}
.tit-b{display:none;border-top:1px solid var(--line)}
.tit.open .tit-b{display:block}
.zw{font-size:12px;font-weight:750;color:var(--ink-2);padding:10px 14px 4px;background:var(--surface-2)}
.ps{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.ps:last-child{border-bottom:0}
.ps .l{flex:1;min-width:0}
.ps .nr{font-size:12px;font-weight:700;color:var(--ink-3)}
.ps .bz{font-size:14.5px;line-height:1.35;margin-top:1px}
.ps .r{text-align:right;flex:0 0 auto;font-size:13px;font-weight:700;color:var(--ink-2)}
.ps .r small{display:block;font-weight:650;color:var(--blue);font-size:11.5px;margin-top:2px}
.ps mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.nl{display:inline-block;font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-radius:6px;padding:1px 6px;margin-left:4px}
.det dt{font-size:12px;font-weight:700;color:var(--ink-3);margin-top:12px}
.det dd{margin:2px 0 0;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(8,13,21,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 20px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto;box-shadow:0 -24px 70px -20px rgba(0,0,0,.5);max-height:88vh;overflow:auto}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
.sheet.on{transform:none}
.sheet h2{font-size:19px;font-weight:760;margin-bottom:4px;line-height:1.3}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="iconbtn" id="backBtn" aria-label="Zurück"></a>
  <div class="brand"><div class="lt"><img src="lib/heise-logo.svg" alt="Heise Haustechnik"></div><div style="min-width:0"><b>Leistungsverzeichnis</b><small id="hSub"></small></div></div>
  <span class="sync" id="syncState"></span>
</header>
<main class="shell" id="app"><div class="empty">Lädt …</div></main>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="lib/heise-icons.js"></script>
<script src="lib/pj-api.js"></script>
<script src="lib/pj-shell.js"></script>
<script>
/* =====================================================================
   Leistungsverzeichnis zum Nachschlagen (ohne Aufmaß): Gliederung, Suche,
   Mengen und Soll-Zeiten. Nur lesen. Offline aus dem letzten Stand.
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=n=>(Math.round((n||0)*1000)/1000).toLocaleString('de-DE');
const fmtMin=m=>m>=60? (Math.round(m/6)/10).toLocaleString('de-DE')+' h' : (Math.round(m*10)/10).toLocaleString('de-DE')+' min';
const fmtH=h=>(Math.round(h*10)/10).toLocaleString('de-DE',{maximumFractionDigits:1})+' h';
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2200); }
const ls={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
const PID=new URLSearchParams(location.search).get('p');
const K='lv_view_'+PID;
let PROJ=null, LV=[], STAND=null, OPEN=ls.get('lv_open_'+PID,{}), Q='';
let ZEIT_ON=true; try{ ZEIT_ON=localStorage.getItem('pj_zeiten')!=='0'; }catch(e){}

/* Gliederung aufbauen: Los › Titel › (Zwischenüberschrift) › Position */
function gliedern(){
  const out=[]; let los=null, tit=null;
  LV.forEach((o,i)=>{
    if(o.k==='L'){ los={p:o.p,b:o.b,tits:[]}; out.push(los); tit=null; }
    else if(o.k==='T'){ if(!los){ los={p:'',b:'',tits:[]}; out.push(los); } tit={p:o.p,b:o.b,items:[]}; los.tits.push(tit); }
    else { if(!los){ los={p:'',b:'',tits:[]}; out.push(los); } if(!tit){ tit={p:'',b:'ohne Titel',items:[]}; los.tits.push(tit); } tit.items.push({...o,i,t:tit.p}); }
  });
  return out;
}
const pos=()=>LV.filter(o=>o.k==='P');
const sollH=items=>items.filter(o=>o.k==='P'&&o.z>0).reduce((a,o)=>a+o.z*(o.m||0)/60,0);
const norm=s=>String(s||'').toLowerCase();
function treffer(o,terms){ const t=norm(o.p+' '+o.b+' '+o.me), t2=t.replace(/\s+/g,''); return terms.every(w=>t.includes(w)||t2.includes(w.replace(/\s+/g,''))); }
function hl(s,terms){ let h=esc(s); terms.filter(w=>w.length>1).forEach(w=>{ const re=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); h=h.replace(re,'<mark>$1</mark>'); }); return h; }

function posZeile(o,terms){
  return `<button class="ps" data-i="${o.i}"><div class="l"><div class="nr">${esc(o.p)}${o.v?'':'<span class="nl">nicht in Aufmaß-Liste</span>'}</div><div class="bz">${terms?hl(o.b,terms):esc(o.b)}</div></div>
    <div class="r">${nf(o.m)} ${esc(o.me)}${ZEIT_ON&&o.z>0?`<small>${fmtMin(o.z)}/${esc(o.me)}</small>`:''}</div></button>`;
}
function render(){
  const P=pos(), hz=LV.some(o=>o.k==='P'&&o.z>0);
  if(!LV.length){ $('#app').innerHTML=`<div class="empty">${IC('sheet')}<div>Für dieses Projekt ist noch kein LV importiert.<br>Die Bauleitung kann es in der Projektübersicht unter „Leistungsverzeichnis“ einlesen.</div></div><a class="btn ghost block" href="index.html#p=${PID}">Zum Projekt</a>`; return; }
  const G=gliedern(), anzT=G.reduce((a,l)=>a+l.tits.filter(t=>t.p).length,0);
  $('#app').innerHTML=`
    <div class="stats"><div><b>${P.length}</b><small>Positionen</small></div><div><b>${anzT}</b><small>Titel</small></div>
      <div>${hz&&ZEIT_ON?`<b>${fmtH(sollH(LV))}</b><small>Soll-Zeit gesamt</small>`:`<b>${P.filter(o=>o.v).length}</b><small>in Aufmaß-Liste</small>`}</div></div>
    <div class="sbar"><div class="sbox">${IC('search')}<input id="q" type="search" placeholder="Suchen, z. B. DN 100 Bogen oder 01.02" autocomplete="off" value="${esc(Q)}">${Q?`<button id="qx" aria-label="Suche leeren">${IC('x','sm')}</button>`:''}</div></div>
    <div class="tools"><span id="tInfo"></span><span class="r">${hz?`<button class="lnk" id="tZeit">${ZEIT_ON?'Zeiten ausblenden':'Zeiten einblenden'}</button>`:''}<button class="lnk" id="tAuf">Alle auf</button><button class="lnk" id="tZu">Alle zu</button></span></div>
    <div id="liste"></div>
    ${STAND?`<p class="hint" style="text-align:center;margin-top:14px">Stand ${new Date(STAND).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}${navigator.onLine?'':' · offline'}</p>`:''}`;
  liste();
  const q=$('#q'); q.addEventListener('input',()=>{ Q=q.value; liste(); });
  if($('#qx')) $('#qx').onclick=()=>{ Q=''; render(); };
  $('#tAuf').onclick=()=>{ G.forEach(l=>l.tits.forEach(t=>OPEN[t.p||'_']=true)); ls.set('lv_open_'+PID,OPEN); liste(); };
  $('#tZu').onclick=()=>{ OPEN={}; ls.set('lv_open_'+PID,OPEN); liste(); };
  if($('#tZeit')) $('#tZeit').onclick=()=>{ ZEIT_ON=!ZEIT_ON; try{ localStorage.setItem('pj_zeiten',ZEIT_ON?'1':'0'); }catch(e){} render(); };
}
function liste(){
  const terms=norm(Q).split(/\s+/).filter(Boolean), G=gliedern(); let html='', n=0;
  if(terms.length){
    G.forEach(l=>l.tits.forEach(t=>{ const hit=t.items.filter(o=>o.k==='P'&&treffer(o,terms)); if(!hit.length) return; n+=hit.length;
      html+=`<div class="tit open"><div class="tit-h" style="cursor:default"><span class="nr">${esc(t.p)}</span><b>${esc(t.b)}${l.b?`<small>${esc(l.b)}</small>`:''}</b></div><div class="tit-b">${hit.map(o=>posZeile(o,terms)).join('')}</div></div>`; }));
    $('#tInfo').textContent=n?`${n} Treffer`:'';
    $('#liste').innerHTML=html||`<div class="empty">${IC('search')}<div>Keine Position gefunden.<br>Die Position steht vermutlich nicht im LV.</div></div>`;
  } else {
    G.forEach(l=>{ if(l.b) html+=`<div class="los">${esc([l.p,l.b].filter(Boolean).join(' · '))}</div>`;
      l.tits.forEach(t=>{ const k=t.p||'_', P=t.items.filter(o=>o.k==='P'), op=!!OPEN[k], h=sollH(P);
        html+=`<div class="tit${op?' open':''}" data-t="${esc(k)}"><button class="tit-h"><span class="nr">${esc(t.p)}</span><b>${esc(t.b)}<small>${P.length} Position${P.length===1?'':'en'}${ZEIT_ON&&h>0?' · Soll '+fmtH(h):''}</small></b>${IC('chev')}</button>
          <div class="tit-b">${op?t.items.map(o=>o.k==='X'?`<div class="zw">${esc(o.b)}</div>`:posZeile(o)).join(''):''}</div></div>`; }); });
    $('#tInfo').textContent='';
    $('#liste').innerHTML=html;
    $$('.tit[data-t] .tit-h').forEach(b=>b.onclick=()=>{ const k=b.parentElement.dataset.t; OPEN[k]=!OPEN[k]; if(!OPEN[k]) delete OPEN[k]; ls.set('lv_open_'+PID,OPEN); liste(); });
  }
  $$('.ps[data-i]').forEach(b=>b.onclick=()=>detail(+b.dataset.i));
}
function detail(i){
  const o=LV[i]; let t=null, l=null; for(let k=i;k>=0;k--){ if(!t&&LV[k].k==='T') t=LV[k]; if(LV[k].k==='L'){ l=LV[k]; break; } }
  $('#sheet').innerHTML=`<div class="hint" style="font-weight:700">${esc(o.p)}</div><h2>${esc(o.b)}</h2>
    <dl class="det">
      ${l?`<dt>Los</dt><dd>${esc([l.p,l.b].filter(Boolean).join(' · '))}</dd>`:''}
      ${t?`<dt>Titel</dt><dd>${esc([t.p,t.b].filter(Boolean).join(' · '))}</dd>`:''}
      <dt>Menge laut LV</dt><dd>${nf(o.m)} ${esc(o.me)}</dd>
      ${ZEIT_ON&&o.z>0?`<dt>Soll-Zeit (Kalkulation)</dt><dd>${fmtMin(o.z)} je ${esc(o.me)} · ${fmtH(o.z*(o.m||0)/60)} für die LV-Menge</dd>`:''}
      <dt>Aufmaß-Liste</dt><dd>${o.v?'ja':'nein, nur im gesamten LV'}</dd>
    </dl>
    <button class="btn ghost block" style="margin-top:18px" onclick="schliessen()">Schließen</button>`;
  $('#ov').classList.add('on'); $('#sheet').classList.add('on');
}
function schliessen(){ $('#sheet').classList.remove('on'); $('#ov').classList.remove('on'); }
$('#ov').onclick=schliessen;

(async function(){
  $('#backBtn').innerHTML=IC('back'); $('#backBtn').href='index.html#p='+encodeURIComponent(PID||'');
  if(!PID){ $('#app').innerHTML='<div class="empty">Kein Projekt gewählt. <a href="index.html">Zur Projektübersicht</a></div>'; return; }
  if(PJ.ready) await PJ.ready;
  const c=ls.get(K,null); if(c){ PROJ=c.PROJ; LV=c.LV; STAND=c.STAND; }
  PJS.set({seite:'lv',pid:PID,pname:PROJ?.name||'',erfassen:false});
  if(c) { $('#hSub').textContent=PROJ?.name||''; render(); }
  try{
    const d=await PJ.api('projekte/'+PID);
    PROJ=d.projekt; LV=(d.lv||[]).map(o=>({k:o.typ,p:o.pos||'',b:o.bez||'',m:o.menge,me:o.me||'',v:o.in_liste?1:0,z:o.zeit||null})); STAND=new Date().toISOString();
    ls.set(K,{PROJ,LV,STAND});
  }catch(e){ if(!c){ $('#app').innerHTML=`<div class="err">${esc(e.message)}</div><a class="btn ghost" href="index.html#p=${PID}">Zum Projekt</a>`; return; } }
  $('#hSub').textContent=PROJ?.name||''; document.title='LV · '+(PROJ?.name||'');
  PJS.set({seite:'lv',pid:PID,pname:PROJ?.name||'',erfassen:false});
  const q=Q; render(); if(q){ $('#q').value=q; }
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
