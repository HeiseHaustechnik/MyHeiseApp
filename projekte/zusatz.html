<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f8">
<title>Zusätzliche Arbeiten</title>
<link rel="stylesheet" href="lib/heise-ui.css">
<style>
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;color:var(--ink-3);text-align:right;line-height:1.25;max-width:42%}
.sync .ic{width:16px;height:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.card .field:last-child{margin-bottom:0}
.sig{border:1.5px dashed var(--ink-3);border-radius:16px;background:var(--surface);touch-action:none;width:100%;height:160px;display:block}
.sig.lock{border-style:solid;border-color:var(--line);touch-action:auto}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.lnk{color:var(--brand-2);font-weight:650;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.lnk .ic{width:16px;height:16px}
.nrbox{display:grid;place-items:center;min-width:58px;height:52px;padding:0 8px;border-radius:15px;background:var(--surface-2);color:var(--brand);flex:0 0 auto;line-height:1.05;text-align:center}
.nrbox b{font-size:15px;font-weight:800}
.nrbox small{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--ink-3)}
.row-card .mt .desc{display:block;font-size:13px;color:var(--ink-2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ov{position:fixed;inset:0;background:rgba(8,13,21,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 20px calc(20px + var(--safe-b));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);max-width:560px;margin:0 auto;box-shadow:0 -24px 70px -20px rgba(0,0,0,.5);max-height:88vh;overflow:auto}
.sheet::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:5px;border-radius:3px;background:var(--line);transform:translateX(-50%)}
.sheet.on{transform:none}
.sheet h2{font-size:20px;font-weight:760;margin-bottom:14px}
.bottombar{position:sticky;bottom:0;z-index:5;padding:12px 0 calc(8px + var(--safe-b));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px}
.bottombar .btn{flex:1}
.chk{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto}
.chk b{display:block;font-size:14.5px}.chk small{display:block;font-size:12.5px;color:var(--ink-3)}
.opt{display:flex;gap:10px;flex-wrap:wrap}
.opt label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:650;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--accent)}
.opt label:has(input:checked){box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.lock-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--ok-bg);color:var(--ink);margin-bottom:14px;font-size:14px}
.lock-note .ic{color:var(--ok);flex:0 0 auto}
.vob{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.4}
.trow{display:grid;grid-template-columns:1fr 84px 40px;gap:8px;align-items:end;margin-bottom:8px}
.trow.mat{grid-template-columns:1fr 72px 70px 40px;margin-bottom:6px}
.trow .field{margin:0}
.trow .field label{font-size:11.5px}
.trow .bem{grid-column:1/3}
.pname{min-height:50px;display:flex;flex-direction:column;justify-content:center;font-weight:700;font-size:15px;line-height:1.2}
.pname small{font-weight:600;font-size:12px;color:var(--ink-3)}
.prow{padding:10px 0 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pps{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.pp{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px 0 6px;border-radius:21px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:650;font-size:14px;text-align:left}
.pp .av{width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:780;color:var(--ink-2);flex:0 0 auto}
.pp small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.1}
.pp.on{background:color-mix(in srgb,var(--brand) 8%,var(--surface));box-shadow:inset 0 0 0 2px var(--brand)}
.pp.on .av{background:var(--brand);color:#fff}
.pp.add{padding:0 14px;color:var(--accent-2);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent);background:var(--amber-bg)}
fieldset:disabled .pp{opacity:.6}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mat2{display:grid;grid-template-columns:1fr 50px 112px;gap:8px;align-items:end}
.mat2 .field{margin:0}.mat2 .field label{font-size:11.5px}
.scanbtn{height:50px;border-radius:14px;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--brand)}
.lvline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px}
.lvchip{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:12px;background:var(--ok-bg);font-weight:650;max-width:100%}
.lvchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lvchip button{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.lvhint{color:var(--ink-3)}
.lvhit{display:block;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.lvhit b{font-size:12.5px;color:var(--ink-3)}.lvhit span{display:block;font-size:14.5px}
.auf-note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:14px;background:var(--surface-2);font-size:13.5px;margin-top:10px}
.auf-note .ic{flex:0 0 auto;color:var(--brand)}
.scanvid{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:#000}
@media(max-width:560px){.trow.mat{grid-template-columns:1fr 1fr 40px}.trow.mat>.field:nth-child(1){grid-column:1/3;grid-row:1}.trow.mat>.delbtn{grid-column:3;grid-row:1}.trow.mat>.field:nth-child(2){grid-column:1;grid-row:2}.trow.mat>.field:nth-child(3){grid-column:2;grid-row:2}.mat2{grid-template-columns:1fr 50px 104px}}
.delbtn{width:40px;height:50px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
.delbtn:active{background:var(--red-bg);color:var(--red)}
.sum{display:flex;justify-content:space-between;font-weight:760;padding:8px 2px 0;border-top:1px solid var(--line);margin-top:4px}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset:disabled .inp{background:var(--surface-2);color:var(--ink-2)}
</style>
</head>
<body>
<header class="topbar">
  <a href="index.html" class="iconbtn" id="backBtn" aria-label="Zurück"></a>
  <div class="brand"><div class="lt"><img src="lib/heise-logo.svg" alt="Heise Haustechnik"></div><div style="min-width:0"><b id="hTitle">Zusätzliche Arbeiten</b><small id="hSub"></small></div></div>
  <span class="sync" id="syncState"></span>
</header>
<main class="shell" id="app"><div class="empty">Lädt …</div></main>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="lib/heise-icons.js"></script>
<script src="lib/pj-api.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script>
/* =====================================================================
   Zusätzliche Arbeiten: Auftrag (ZA-001 …) und Stundennachweis (SN-001 …)
   Daten über die RPC pj_za (supabase/zusatz.sql). Offline wird lokal gespeichert
   und später übertragen. Nach der Unterschrift des Auftraggebers bzw. Kunden ist
   das Dokument gesperrt, nur die Bauleitung kann entsperren.
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const nowIso=()=>new Date().toISOString();
const todayIso=()=>{ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const WT=['So','Mo','Di','Mi','Do','Fr','Sa'], WTL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const dDE=d=>d?new Date(d+'T12:00').toLocaleDateString('de-DE'):'';
const dLong=d=>d?WTL[new Date(d+'T12:00').getDay()]+', '+new Date(d+'T12:00').toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'}):'';
const tsDE=t=>t?new Date(t).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'}):'';
const num=v=>{ if(typeof v==='number') return v; const n=parseFloat(String(v||'').replace(',','.')); return isFinite(n)?n:0; };
const hStr=h=>(Math.round(h*100)/100).toLocaleString('de-DE',{maximumFractionDigits:2})+' h';
const eur=v=>v?Number(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €/h':'';
const zaNr=n=>n?'ZA-'+String(n).padStart(3,'0'):'ZA neu', snNr=n=>n?'SN-'+String(n).padStart(3,'0'):'SN neu';
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2600); }
const ls={ get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };
const api=(path,opt={})=>PJ.api(path,opt);
const za=(path,opt={})=>PJ.za(path,opt);
const Q=new URLSearchParams(location.search);
const PID=Q.get('p');
let PROJ=null, PERS=[], TEAM=[], LVP=[], ZL=[], SL=[], D=null, KIND=null;   // Projekt, Personen, Aufträge, Stundennachweise, aktuelles Dokument
const K={proj:'za_proj_'+PID, pers:'za_pers_'+PID, team:'za_team_'+PID, lv:'za_lv_'+PID, zl:'za_list_'+PID, sl:'sn_list_'+PID, queue:'za_queue', doc:(k,id)=>'za_doc_'+k+'_'+id, tab:'za_tab'};
const ZAEND={ausfuehrung:'regie',saetze:'vereinbart',material_nachweis:1};

/* ================= Speichern / Offline-Warteschlange ================= */
function setSync(kind,txt){ const el=$('#syncState'); el.innerHTML=IC(kind==='err'?'cloudoff':kind==='ok'?'cloud':'sync')+'<span>'+esc(txt)+'</span>'; el.style.color=kind==='err'?'var(--amber)':kind==='ok'?'var(--ok)':''; }
const queue=()=>ls.get(K.queue,[]);
function enqueue(item){ const q=queue().filter(x=>!(x.kind===item.kind&&x.id===item.id)); q.push(item); ls.set(K.queue,q); flushSoon(); }
let flushT=null, flushing=false;
function flushSoon(){ clearTimeout(flushT); updSync(); flushT=setTimeout(flush,900); }
function updSync(){ const n=queue().length; if(!navigator.onLine) setSync('err',n?`offline · ${n} Änderung${n>1?'en':''} warten`:'offline'); else if(n) setSync('',`${n} Änderung${n>1?'en':''} werden gespeichert …`); else setSync('ok','gespeichert '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})); }
async function flush(){
  if(flushing||!navigator.onLine) { updSync(); return; } flushing=true;
  try{
    for(const it of queue()){
      try{
        const r=await za((it.kind==='zusatz'?'zusatz/':'stunden/')+it.id,{method:'PUT',body:JSON.stringify(it.data)});
        ls.set(K.queue,queue().filter(x=>!(x.kind===it.kind&&x.id===it.id&&x.v===it.v)));
        if(r){ const loc=ls.get(K.doc(it.kind,it.id),null); if(loc){ loc.nr=r.nr; ls.set(K.doc(it.kind,it.id),loc); }
          if(D&&D.id===it.id){ D.nr=r.nr; D.erstellt_von=r.erstellt_von;
            if(it.kind==='stunden'){ D.ae_map=r.ae_map; D.aufmass_id=r.aufmass_id; const l=ls.get(K.doc(it.kind,it.id),null); if(l){ l.ae_map=r.ae_map; l.aufmass_id=r.aufmass_id; ls.set(K.doc(it.kind,it.id),l); } aufNote(); }
            hdr(); } }
      }catch(e){
        if(!navigator.onLine || /Verbindung|fetch|network|angemeldet|timeout|abort/i.test(e.message||'')) break;   // Netzproblem: später erneut
        ls.set(K.queue,queue().filter(x=>!(x.kind===it.kind&&x.id===it.id)));   // vom Server abgelehnt: nicht endlos wiederholen
        toast('Nicht gespeichert: '+e.message);
        if(D&&D.id===it.id) setTimeout(()=>location.reload(),1800);
      }
    }
  } finally { flushing=false; updSync(); }
}
window.addEventListener('online',flushSoon); window.addEventListener('offline',updSync);

async function loadBase(){
  PROJ=ls.get(K.proj,null); PERS=ls.get(K.pers,[]); TEAM=ls.get(K.team,[]); LVP=ls.get(K.lv,[]); ZL=ls.get(K.zl,[]); SL=ls.get(K.sl,[]);
  try{
    const [p,pers,team,zl,sl]=await Promise.all([api('projekte/'+PID),api('projekte/'+PID+'/personen').catch(()=>[]),api('projekte/'+PID+'/team').catch(()=>null),za('projekte/'+PID+'/zusatz'),za('projekte/'+PID+'/stunden')]);
    PROJ=p.projekt; PERS=pers||[]; ZL=zl; SL=sl;
    if(team) TEAM=team.filter(b=>b.zugeordnet).map(b=>b.name).filter(Boolean);
    // nur die Positionen des LV (für die Zuordnung von Material)
    LVP=(p.lv||[]).filter(o=>o.typ==='P').map(o=>({p:o.pos,b:o.bez||'',me:o.me||''}));
    ls.set(K.proj,PROJ); ls.set(K.pers,PERS); ls.set(K.team,TEAM); ls.set(K.zl,ZL); ls.set(K.sl,SL);
    try{ ls.set(K.lv,LVP); }catch(e){}
  }catch(e){
    if(/pj_za/.test(e.message)) throw new Error('Die Datenbank für „Zusätzliche Arbeiten“ ist noch nicht eingerichtet (zusatz.sql ausführen).');
    if(!PROJ) throw e;
  }
  // lokal angelegte, noch nicht übertragene Dokumente in die Listen
  queue().forEach(it=>{ const L=it.kind==='zusatz'?ZL:SL; if(!L.some(x=>x.id===it.id)){ const d=it.data; L.unshift(it.kind==='zusatz'?{id:it.id,nr:null,datum:d.datum,beschreibung:d.beschreibung,bereich:d.bereich,geschoss:d.geschoss,sig_heise:!!d.sig_heise,sig_ag:!!d.sig_ag,sn:[],stunden:0}:{id:it.id,nr:null,datum:d.datum,zusatz_ids:d.zusatz_ids,personen:d.personen,beschreibung:d.beschreibung,sig_kunde:!!d.sig_kunde,sig_monteur:!!d.sig_monteur}); } });
}
function sumStd(p){ return (p||[]).reduce((a,x)=>a+num(x.stunden),0); }

/* ================= Übersicht ================= */
function renderList(){
  D=null; KIND=null;
  const tab=ls.get(K.tab,'za');
  $('#hTitle').textContent='Zusätzliche Arbeiten'; $('#hSub').textContent=PROJ?.name||'';
  $('#backBtn').innerHTML=IC('back'); $('#backBtn').href='index.html#p='+PID;
  const offen=ZL.filter(z=>!z.sig_ag).length;
  $('#app').innerHTML=`
    <section class="hero">
      <div><div class="ey">${esc(PROJ?.name||'')}</div><h1>Zusätzliche Arbeiten</h1></div>
      <div class="logo-tile"><img src="lib/heise-logo.svg" alt=""></div>
      <p>${ZL.length} ${ZL.length==1?'Auftrag':'Aufträge'}${offen?` · ${offen} ohne Unterschrift Auftraggeber`:''} · ${SL.length} ${SL.length==1?'Stundennachweis':'Stundennachweise'}</p>
    </section>
    <div class="segc" style="margin:18px 0 12px"><button data-tab="za" class="${tab==='za'?'on':''}">Aufträge (${ZL.length})</button><button data-tab="sn" class="${tab==='sn'?'on':''}">Stundennachweise (${SL.length})</button></div>
    ${tab==='za'?`
      <button class="btn cta block" id="newZa">${IC('plus')}Zusätzliche Arbeiten anmelden</button>
      <p class="hint" style="margin:8px 2px 4px">Arbeiten kurz beschreiben und begründen, der Auftraggeber oder sein Vertreter unterschreibt direkt auf dem Gerät. Danach als PDF senden.</p>
      ${ZL.length?ZL.map(z=>`<a class="row-card" href="?p=${PID}&za=${z.id}">
        <div class="nrbox"><small>ZA</small><b>${z.nr?String(z.nr).padStart(3,'0'):'neu'}</b></div>
        <div class="mt"><b>${esc((z.beschreibung||'ohne Beschreibung').split('\n')[0])}</b>
          <small>${dDE(z.datum)}${z.bereich||z.geschoss?' · '+esc([z.geschoss,z.bereich].filter(Boolean).join(', ')):''}${z.sn&&z.sn.length?' · '+z.sn.map(snNr).join(', ')+' · '+hStr(z.stunden||0):''}</small>
          <div class="tags">${z.sig_ag?'<span class="pill tone-ok"><i></i>vom Auftraggeber unterschrieben</span>':'<span class="pill tone-amber"><i></i>Unterschrift Auftraggeber fehlt</span>'}${z.ausfuehrung==='nachtrag'?'<span class="pill tone-blue">Nachtrag</span>':''}</div></div>
        <span class="chev">${IC('chev')}</span></a>`).join(''):`<div class="empty" style="margin-top:12px">${IC('file')}<div>Noch keine zusätzlichen Arbeiten angemeldet.</div></div>`}`
    :`
      <button class="btn cta block" id="newSn">${IC('plus')}Stundennachweis schreiben</button>
      <p class="hint" style="margin:8px 2px 4px">Je Arbeitstag ein Nachweis mit Personen, Stunden und Material, zugeordnet zu einem oder mehreren Aufträgen (ZA-Nummern).</p>
      ${SL.length?SL.map(s=>{ const d=s.datum?new Date(s.datum+'T12:00'):null; let p=s.personen; if(typeof p==='string'){ try{ p=JSON.parse(p); }catch(e){ p=[]; } } let zi=s.zusatz_ids; if(typeof zi==='string'){ try{ zi=JSON.parse(zi); }catch(e){ zi=[]; } }
        const zn=(zi||[]).map(id=>ZL.find(z=>z.id===id)).filter(Boolean).map(z=>zaNr(z.nr));
        return `<a class="row-card" href="?p=${PID}&sn=${s.id}">
        <div class="nrbox"><small>${d?WT[d.getDay()]:'SN'}</small><b>${d?d.getDate()+'.'+(d.getMonth()+1)+'.':'neu'}</b></div>
        <div class="mt"><b>${snNr(s.nr)} · ${hStr(sumStd(p))}</b>
          <small>${(p||[]).length} ${(p||[]).length==1?'Person':'Personen'}${zn.length?' · '+zn.join(', '):' · ohne Auftrag'}</small>
          ${s.beschreibung?`<span class="desc">${esc(s.beschreibung)}</span>`:''}
          <div class="tags">${s.sig_kunde?'<span class="pill tone-ok"><i></i>Kunde</span>':'<span class="pill tone-amber"><i></i>Unterschrift Kunde fehlt</span>'}${s.sig_monteur?'<span class="pill tone-ok"><i></i>Monteur</span>':''}</div></div>
        <span class="chev">${IC('chev')}</span></a>`; }).join(''):`<div class="empty" style="margin-top:12px">${IC('clock')}<div>Noch keine Stundennachweise.</div></div>`}`}`;
  $$('[data-tab]').forEach(b=>b.onclick=()=>{ ls.set(K.tab,b.dataset.tab); renderList(); });
  if($('#newZa')) $('#newZa').onclick=newZa;
  if($('#newSn')) $('#newSn').onclick=()=>newSn([]);
}

/* ================= Neues Dokument ================= */
function newZa(){
  const last=ZL[0];
  const d={id:uid(),projekt_id:PID,nr:null,datum:todayIso(),gewerk:last?.gewerk||'',geschoss:'',bereich:'',beschreibung:'',begruendung:'',...ZAEND,
    satz_vorarbeiter:null,satz_facharbeiter:null,ort:'',name_heise:ls.get('za_name_heise',PJ.me?.name||''),name_ag:'',sig_heise:null,sig_ag:null,sig_ts:null};
  ls.set(K.doc('zusatz',d.id),d); saveDoc('zusatz',d);
  D=d; KIND='zusatz'; history.pushState(null,'',`?p=${PID}&za=${d.id}`); window.scrollTo(0,0); renderZa();
}
function newSn(zids){
  const last=SL[0];
  const d={id:uid(),projekt_id:PID,nr:null,datum:todayIso(),zusatz_ids:zids,personen:PJ.me?.name?[{name:PJ.me.name,stunden:'',bem:''}]:[],
    beschreibung:'',material:[],name_kunde:'',name_monteur:PJ.me?.name||'',sig_kunde:null,sig_monteur:null,sig_ts:null};
  if(zids.length===1){ const z=(D&&D.id===zids[0])?D:ZL.find(x=>x.id===zids[0]); if(z&&z.beschreibung) d.beschreibung=z.beschreibung; }
  ls.set(K.doc('stunden',d.id),d); saveDoc('stunden',d);
  D=d; KIND='stunden'; history.pushState(null,'',`?p=${PID}&sn=${d.id}`); window.scrollTo(0,0); renderSn();
}
function saveDoc(kind,d){
  d.updated_at=nowIso(); ls.set(K.doc(kind,d.id),d);
  const data={...d}; delete data.nr; delete data.erstellt_von; delete data.created_at; delete data.updated_at;
  if(kind==='stunden'){ data.personen=JSON.stringify(d.personen||[]); data.material=JSON.stringify(d.material||[]); data.zusatz_ids=JSON.stringify(d.zusatz_ids||[]); }
  enqueue({kind,id:d.id,v:d.updated_at,data});
  // Listen im Speicher aktuell halten (für Zuordnungen und Anzeige in dieser Sitzung)
  const L=kind==='zusatz'?ZL:SL, i=L.findIndex(x=>x.id===d.id);
  const row=kind==='zusatz'?{...(L[i]||{sn:[],stunden:0}),id:d.id,nr:d.nr,datum:d.datum,beschreibung:d.beschreibung,bereich:d.bereich,geschoss:d.geschoss,ausfuehrung:d.ausfuehrung,sig_heise:!!d.sig_heise,sig_ag:!!d.sig_ag}
    :{id:d.id,nr:d.nr,datum:d.datum,zusatz_ids:d.zusatz_ids,personen:d.personen,beschreibung:d.beschreibung,sig_kunde:!!d.sig_kunde,sig_monteur:!!d.sig_monteur};
  if(i>=0) L[i]=row; else L.unshift(row);
  ls.set(kind==='zusatz'?K.zl:K.sl,L);
}
async function loadDoc(kind,id){
  const local=ls.get(K.doc(kind,id),null);
  if(local&&queue().some(x=>x.kind===kind&&x.id===id)) return local;
  try{ const s=await za((kind==='zusatz'?'zusatz/':'stunden/')+id); if(!s) throw new Error('nicht gefunden');
    if(kind==='stunden'){ ['personen','material','zusatz_ids'].forEach(k=>{ try{ s[k]=JSON.parse(s[k]||'[]'); }catch(e){ s[k]=[]; } }); }
    ls.set(K.doc(kind,id),s); return s; }
  catch(e){ if(local) return local; throw e; }
}

const SCAN={stream:null,timer:null,zx:null};
function loadScript(src){ return new Promise((ok,err)=>{ if(window.ZXing) return ok(); const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>err(new Error('Scanner konnte nicht geladen werden')); document.head.appendChild(s); }); }
async function scanStart(video,onCode){
  scanStop();
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  SCAN.stream=stream; video.srcObject=stream; video.muted=true; video.setAttribute('playsinline',''); try{ await video.play(); }catch(e){}
  let formats=[];
  if('BarcodeDetector' in window){ try{ formats=(await BarcodeDetector.getSupportedFormats()).filter(f=>['code_128','code_39','ean_13','ean_8','upc_a','upc_e','itf','qr_code','data_matrix'].includes(f)); }catch(e){} }
  if(formats.includes('ean_13')||formats.includes('code_128')){
    const det=new BarcodeDetector({formats});
    SCAN.timer=setInterval(async()=>{ try{ const c=await det.detect(video); if(c.length) onCode(c[0].rawValue); }catch(e){} },250);
  } else {
    await loadScript('lib/zxing.min.js');
    const F=ZXing.BarcodeFormat, hints=new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.EAN_13,F.EAN_8,F.CODE_128,F.CODE_39,F.UPC_A,F.UPC_E,F.ITF,F.QR_CODE,F.DATA_MATRIX]);
    const reader=new ZXing.BrowserMultiFormatReader(hints,250); SCAN.zx=reader;
    reader.decodeFromStream(stream,video,res=>{ if(res) onCode(res.getText()); }).catch(()=>{});
  }
}
function scanStop(){ if(SCAN.timer){ clearInterval(SCAN.timer); SCAN.timer=null; } if(SCAN.zx){ try{ SCAN.zx.reset(); }catch(e){} SCAN.zx=null; } if(SCAN.stream){ SCAN.stream.getTracks().forEach(t=>t.stop()); SCAN.stream=null; } }

function setupSigs(ids,lockId){
  const lk=locked();
  ids.forEach(id=>{
    const c=$('#'+id), ctx=c.getContext('2d'); let draw=false,last=null,dirty=false;
    const size=()=>{ const r=c.getBoundingClientRect(), dp=devicePixelRatio||1; c.width=r.width*dp; c.height=r.height*dp; ctx.setTransform(dp,0,0,dp,0,0); ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0d1524'; ctx.fillStyle='#0d1524';
      if(D[id]){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height); im.src=D[id]; } };
    c._size=size; size();
    if(lk) return;
    const pt=e=>{ const r=c.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
    c.addEventListener('pointerdown',e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId); draw=true; dirty=true; last=pt(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fill(); });
    c.addEventListener('pointermove',e=>{ if(!draw) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; });
    const end=()=>{ if(!draw) return; draw=false; if(dirty){ D[id]=c.toDataURL('image/png'); D.sig_ts=nowIso(); sigText(ids);
      if(id===lockId){ clearTimeout(saveT); saveDoc(KIND,D); toast('Unterschrift gespeichert – das Dokument ist jetzt gesperrt'); setTimeout(()=>KIND==='zusatz'?renderZa():renderSn(),900); } else changed(); } };
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>c.addEventListener(ev,end));
  });
  $$('[data-clr]').forEach(b=>b.onclick=()=>{ D[b.dataset.clr]=null; if(!ids.some(i=>D[i])) D.sig_ts=null; const c=$('#'+b.dataset.clr); c.getContext('2d').clearRect(0,0,c.width,c.height); c._size(); sigText(ids); changed(); });
  sigText(ids);
}

    doc.autoTable({startY:y,margin:{left:M,right:M},headStyles:{fillColor:[47,59,83],textColor:255,fontStyle:'bold',fontSize:9},styles:{fontSize:9.5,cellPadding:1.6},
      columnStyles:mitNr?{1:{cellWidth:30},2:{cellWidth:20,halign:'right'},3:{cellWidth:14},4:{cellWidth:17,halign:'center'},5:{cellWidth:14,halign:'center'}}
        :{1:{cellWidth:22,halign:'right'},2:{cellWidth:16},3:{cellWidth:20,halign:'center'},4:{cellWidth:16,halign:'center'}},
      head:[mitNr?['Material','Art.-Nr.','Menge','ME','bestellt','Lager']:['Material','Menge','ME','bestellt','Lager']],
      body:mat.map(m=>{ const r=[m.bez||'',String(m.menge??'').replace('.',','),m.me||'',m.quelle==='bestellt'?'X':'',m.quelle==='bestellt'?'':'X']; if(mitNr) r.splice(1,0,m.artnr||''); return r; })});
    y=doc.lastAutoTable.finalY+8;
  }
  if(y>235){ doc.addPage(); y=24; }
  pdfSig(doc,y+2,[[d.sig_kunde,'Unterschrift Kunde',d.name_kunde],[d.sig_monteur,'Unterschrift Monteur',d.name_monteur]],d.sig_ts);
  pdfFuss(doc,'Stundennachweis '+snNr(d.nr)+' · '+(PROJ?.name||'')+' · '+dDE(d.datum));
  return doc.output('blob');
}
function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); }

/* ================= Senden (wie im Bautagebuch) ================= */
function empfaenger(){ try{ const a=JSON.parse(PROJ?.empfaenger||'[]'); return Array.isArray(a)?a.filter(x=>x&&x.email):[]; }catch(e){ return []; } }
const canShareFiles=()=>{ try{ return !!(navigator.canShare&&navigator.canShare({files:[new File(['x'],'x.pdf',{type:'application/pdf'})]})); }catch(e){ return false; } };
function sendDialog(build,name,subject,text){
  const em=empfaenger(), share=canShareFiles();
  openSheet(`<h2>PDF senden</h2>
    ${em.length?`<label style="font-size:13px;font-weight:700;color:var(--ink-3)">Empfänger</label>`+em.map((r,i)=>`<label class="chk"><input type="checkbox" data-em="${i}" checked><span><b>${esc(r.name||r.email)}</b><small>${esc([r.rolle,r.email].filter(Boolean).join(' · '))}</small></span></label>`).join('')
      :`<p class="hint">Für dieses Projekt sind noch keine Empfänger hinterlegt. Die Bauleitung kann sie in der Projektübersicht unter „E-Mail-Empfänger“ eintragen.</p>`}
    <div class="field" style="margin-top:12px"><label for="em_x">Weitere Adresse (optional)</label><input class="inp" id="em_x" type="email" inputmode="email" placeholder="name@firma.de"></div>
    <p class="hint" id="em_st">PDF wird erstellt …</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
      ${share?`<button class="btn cta block" id="em_share" disabled>${IC('share')}Teilen mit PDF-Anhang</button>`:''}
      <button class="btn ${share?'ghost':'cta'} block" id="em_mail" disabled>${IC('mail')}Im Mailprogramm öffnen</button></div>
    <p class="hint" style="margin-top:10px">${share?'Beim Teilen werden die Empfänger in die Zwischenablage kopiert, im Mailprogramm ins Feld „An“ einfügen. ':''}„Im Mailprogramm öffnen“ trägt die Empfänger ein und speichert das PDF, das dann noch angehängt werden muss.</p>`,async()=>{
    const to=()=>{ const a=$$('[data-em]').filter(c=>c.checked).map(c=>em[+c.dataset.em].email); const x=$('#em_x').value.trim(); if(x) a.push(x); return [...new Set(a)]; };
    let blob=null;
    try{ blob=await build(); }catch(e){ $('#em_st').textContent='PDF konnte nicht erstellt werden: '+e.message; return; }
    $('#em_st').textContent='PDF ist fertig.';
    const file=new File([blob],name,{type:'application/pdf'});
    if($('#em_share')){ $('#em_share').disabled=false; $('#em_share').onclick=async()=>{
      const a=to(); if(a.length&&navigator.clipboard) navigator.clipboard.writeText(a.join(', ')).catch(()=>{});
      try{ await navigator.share({files:[file],title:subject,text}); closeSheet(); if(a.length) toast('Empfänger wurden kopiert'); }catch(e){ if(e.name!=='AbortError') toast('Teilen nicht möglich: '+e.message); } }; }
    $('#em_mail').disabled=false; $('#em_mail').onclick=()=>{
      const a=to(); dl(blob,name); closeSheet(); toast('PDF gespeichert – bitte an die E-Mail anhängen');
      setTimeout(()=>location.href=`mailto:${a.map(encodeURIComponent).join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`,600); };
  });
}
function openSheet(html,after){ $('#sheet').innerHTML=html; $('#ov').classList.add('on'); $('#sheet').classList.add('on'); after&&after(); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#ov').classList.remove('on'); }
$('#ov').onclick=()=>{ scanStop(); closeSheet(); };

/* ================= Start ================= */
async function route(){
  const q=new URLSearchParams(location.search), zid=q.get('za'), sid=q.get('sn');
  try{
    if(zid){ D=await loadDoc('zusatz',zid); KIND='zusatz'; renderZa(); }
    else if(sid){ D=await loadDoc('stunden',sid); D.personen=D.personen||[]; D.material=(D.material||[]).map((m,i)=>({...m,id:m.id||'i'+(i+1)})); D.zusatz_ids=D.zusatz_ids||[]; KIND='stunden'; renderSn(); }
    else renderList();
  }catch(e){ $('#app').innerHTML=`<div class="err">Dokument nicht gefunden.</div><a class="btn ghost" href="?p=${PID}">Zurück</a>`; }
}
(async function(){
  $('#backBtn').innerHTML=IC('back');
  if(!PID){ $('#app').innerHTML='<div class="empty">Kein Projekt gewählt. <a href="index.html">Zur Projektübersicht</a></div>'; return; }
  if(PJ.ready) await PJ.ready;
  try{ await loadBase(); }catch(e){ $('#app').innerHTML=`<div class="err">${esc(e.message)}</div><a class="btn ghost" href="index.html#p=${PID}">Zum Projekt</a>`; return; }
  await route();
  window.addEventListener('popstate',route);
  document.title='Zusätzliche Arbeiten · '+(PROJ?.name||'');
  updSync(); flush();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
