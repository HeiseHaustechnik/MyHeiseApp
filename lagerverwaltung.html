/* =====================================================================
   Kamera-Scanner (Barcode, QR) – aus lager.html übernommen
   BarcodeDetector (Android/Chrome) oder ZXing als Ersatz (iPhone).
   scanSheet({title,onCode,fortlaufend}): onCode darf einen Hinweistext zurückgeben (fortlaufend scannen).
   ===================================================================== */
const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const SCAN={stream:null,timer:null,zx:null,onCode:null,paused:false,last:'',lastAt:0};
async function scanStart(video,onCode){
  scanStop();SCAN.onCode=onCode;SCAN.paused=false;SCAN.last='';SCAN.lastAt=0;
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  SCAN.stream=stream;video.srcObject=stream;video.muted=true;video.setAttribute('playsinline','');
  try{await video.play()}catch(e){}
  let formats=[];
  if('BarcodeDetector' in window){try{formats=(await BarcodeDetector.getSupportedFormats()).filter(f=>['qr_code','code_128','code_39','ean_13','ean_8','upc_a','upc_e','data_matrix','itf'].includes(f))}catch(e){}}
  if(formats.includes('qr_code')&&(formats.includes('code_128')||formats.includes('ean_13'))){
    const det=new BarcodeDetector({formats});
    SCAN.timer=setInterval(async()=>{if(SCAN.paused)return;try{const c=await det.detect(video);if(c.length)scanEmit(c[0].rawValue)}catch(e){}},250);
  }else{
    await loadLib(ZXING_URL);
    const F=ZXing.BarcodeFormat,hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[F.QR_CODE,F.CODE_128,F.CODE_39,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.ITF,F.DATA_MATRIX]);
    const reader=new ZXing.BrowserMultiFormatReader(hints,250);SCAN.zx=reader;
    reader.decodeFromStream(stream,video,res=>{if(res)scanEmit(res.getText())}).catch(()=>{});
  }
}
function scanEmit(v){
  if(SCAN.paused||!v)return;const now=Date.now();
  if(v===SCAN.last&&now-SCAN.lastAt<2000){SCAN.lastAt=now;return}
  SCAN.last=v;SCAN.lastAt=now;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
  SCAN.onCode(String(v).trim());
}
function scanStop(){
  if(SCAN.timer){clearInterval(SCAN.timer);SCAN.timer=null}
  if(SCAN.zx){try{SCAN.zx.reset()}catch(e){}SCAN.zx=null}
  if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null}
}
function scanSheet({title,onCode,fortlaufend=false}){
  const bd=sheet({title,body:`<video class="scanvid" autoplay playsinline muted></video><div class="scaninfo" id="scInfo">Kamera wird gestartet …</div>
    <div class="searchbar" style="margin-top:10px">${ic('search')}<input id="scMan" placeholder="Oder Nummer eintippen / Hand-Scanner, Enter" autocomplete="off" aria-label="Nummer eingeben"></div>`,
    footer:`<button class="btn btn-primary" data-act="closeSheet">Fertig</button>`,onClose:scanStop});
  const info=$('#scInfo',bd);
  const hand=async code=>{
    SCAN.paused=true;
    try{const msg=await onCode(code);if(!bd.isConnected)return;info.innerHTML=msg||(fortlaufend?'Nächsten Code scannen …':'');}
    catch(e){toast(niceErr(e),'err')}
    finally{SCAN.paused=false}
  };
  scanStart($('video',bd),hand).then(()=>{if(bd.isConnected)info.textContent='Code in den Rahmen halten …'}).catch(()=>{info.innerHTML='<span style="color:var(--red)">Kamera nicht verfügbar – bitte Nummer unten eintippen.</span>'});
  const m=$('#scMan',bd);m.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=m.value.trim();m.value='';if(v){SCAN.last='';hand(v)}}});
  return bd;
}
/* =====================================================================
   Start der App
   ===================================================================== */
function showNoAccess(msg){
  $('#boot').hidden=true;
  $('#view').innerHTML=`<div class="noaccess">${ic('lock')}<h1>Kein Zugriff auf die Lagerverwaltung</h1><p class="muted">${esc(msg||'Für dein Konto ist die Lagerverwaltung nicht freigeschaltet. Bitte melde dich beim Administrator.')}</p><div class="btnrow" style="margin-top:22px"><a class="btn btn-primary" href="${PORTAL}">Zur Startseite</a><button class="btn btn-ghost" data-act="logout">Abmelden</button></div></div>`;
  $('#app').hidden=false;$('#tabbar').hidden=true;
}
async function boot(){
  if(!storedRefresh()&&!AUTH.refresh)return toLogin();
  try{
    await ensureToken();
    const rows=await api('GET','benutzer',null,`?auth_id=eq.${jwtSub(AUTH.access)}`);
    if(!rows.length)return showNoAccess('Für dieses Konto ist kein Benutzerprofil hinterlegt.');
    S.me=rows[0];
    if(S.me.pw_aendern)return location.replace(`${PORTAL}?next=${encodeURIComponent(SELF)}`);
    await loadAll();
    if(!S.lager.length)return showNoAccess();
  }catch(e){
    console.error(e);
    if(/abgelaufen|Nicht angemeldet/.test(e.message||''))return;
    $('#boot').hidden=true;$('#app').hidden=false;$('#tabbar').hidden=true;
    $('#view').innerHTML=`<div class="noaccess">${ic('alert')}<h1>Konnte nicht laden</h1><p class="muted">${esc(niceErr(e))}</p><div class="btnrow" style="margin-top:22px"><button class="btn btn-primary" onclick="location.reload()">Erneut versuchen</button></div></div>`;
    return;
  }
  $('#boot').hidden=true;$('#app').hidden=false;
  renderShell();route();
}
window.addEventListener('storage',e=>{if(e.key===SESS_KEY&&!e.newValue&&S.me){location.replace(PORTAL)}});
boot();
